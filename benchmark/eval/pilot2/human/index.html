o all four years (conservative, since the decision is mid-2027).\n    - Evidence: Listings move from the cross-border seller to Onsoo's own operation inside the $0.8M setup cost.\n    - Evidence: Stall case = Amazon flat at 200k units ($4.8M) a year, consistent with peers below $5M.\n    - Evidence: Cash envelope $4M is our proposal, covering the worst non-stall stress case (\u2013$3.9M).\n  - Claim: Modeling conventions\n    - Evidence: Pre-tax US cash flow; constant FX (KRW 1,380/$); no terminal value.\n    - Evidence: Cash = units \u00d7 unit contribution \u2013 fixed costs \u2013 one-time costs \u2013 change in inventory.\n    - Evidence: Inventory = 4 months of landed cost (ex-factory + freight + duty): $4.575 a unit on Amazon, $4.775 in retail.\n    - Evidence: Door fixtures ($1,100 per new door) expensed in the year the door opens.\n    - Evidence: Group margin = (ex-US plan revenue \u00d7 11% + US operating result) \u00f7 (ex-US revenue + US revenue). Inventory is excluded from the margin.\n    - Evidence: Hero-SKU unit economics applied to all SKUs, as the planning team does.\n    - Evidence: Japan (Option J): incremental revenue \u00d7 30% \u2013 $0.8M fixed \u2013 $1.0M one-time; no working-capital data provided.\n    - Evidence: Peak cash = the most negative cumulative cash position, 2027\u201330.\n    - Evidence: All inputs come from the briefing pack; no outside data used. Figures are synthetic benchmark data.\n- Slide 19: Appendix: Option A (Amazon-led) pays back in 2030 at the plan's 25% ACoS but not at the 32% benchmark\n  - Claim: Option A \u00b7 plan inputs: 300k \u2192 1.1M units; 25% ACoS ($4.725 a unit); fixed $2.1M a year; setup $0.8M\n    - Evidence: 2027: Revenue 7.20; Contribution 1.42; Fixed \u20132.10; One-time \u20130.80; Op result \u20131.48; \u0394Inv \u20130.46; Cash flow \u20131.94; Cum \u20131.94; Margin 9.5%\n    - Evidence: 2028: 13.44; 2.65; \u20132.10; \u2014; 0.55; \u20130.40; 0.15; \u20131.79; 10.4%\n    - Evidence: 2029: 20.4 areness median), no halo\n    - Evidence: 2027: 8.34; 2.03; \u20139.60; \u20131.96; \u20139.53; \u20130.59; \u201310.12; \u201310.12; 4.0%\n    - Evidence: 2028: 14.58; 3.26; \u20139.60; \u2014; \u20136.34; \u20130.40; \u20136.74; \u201316.86; 6.1%\n    - Evidence: 2029: 21.91; 4.83; \u20139.60; \u20130.22; \u20134.99; \u20130.49; \u20135.47; \u201322.33; 6.7%\n    - Evidence: 2030: 28.29; 6.22; \u20139.60; \u20130.22; \u20133.60; \u20130.42; \u20134.03; \u201326.36; 7.4%\n  - Claim: A + CEO's phase 2: 600 doors from 2029 at B's cost base, 4.6 units/door/week\n    - Evidence: 2027: 7.20; 1.42; \u20132.10; \u20130.80; \u20131.48; \u20130.46; \u20131.94; \u20131.94; 9.5%\n    - Evidence: 2028: 13.44; 2.65; \u20132.10; \u2014; 0.55; \u20130.40; 0.15; \u20131.79; 10.4%\n    - Evidence: 2029: 22.41; 5.10; \u20139.60; \u20131.16; \u20135.66; \u20130.67; \u20136.33; \u20138.12; 6.3%\n    - Evidence: 2030: 28.41; 6.28; \u20139.60; \u2014; \u20133.32; \u20130.38; \u20133.70; \u201311.82; 7.5%\n  - Claim: B fixed = $2.1M + national retail marketing $6.0M + field team $1.5M; one-time 2027 = setup $0.8M + launch fee $0.5M + fixtures 600 \u00d7 $1,100.\n- Slide 21: Appendix: Option J (Japan scale-up) is low-risk and pays back in 2029, but adds only $7M of revenue by 2030\n  - Claim: Option J \u00b7 incremental revenue \u00d7 30% contribution; $0.8M fixed a year; $1.0M one-time in 2027\n    - Evidence: 2027: 2.50; 0.75; \u20130.80; \u20131.00; \u20131.05; \u2014; \u20131.05; \u20131.05; 10.1%\n    - Evidence: 2028: 4.50; 1.35; \u20130.80; \u2014; 0.55; \u2014; 0.55; \u20130.50; 11.0%\n    - Evidence: 2029: 6.00; 1.80; \u20130.80; \u2014; 1.00; \u2014; 1.00; 0.50; 11.2%\n    - Evidence: 2030: 7.00; 2.10; \u20130.80; \u2014; 1.30; \u2014; 1.30; 1.80; 11.3%\n  - Claim: Key calculations used in the deck\n    - Evidence: K-beauty CAGR 2021\u201325 = (3.6 \u00f7 1.9)^(1/4) \u2013 1 = 17.3%; all facial skincare (24.5 \u00f7 20.1)^(1/4) \u2013 1 = 5.1%; share 9.5% \u2192 14.7%.\n    - Evidence: Amazon contribution = 24.00 \u2013 3.60 referral \u2013 5.10 FBA \u2013 3.50 product \u2013 0.55 freight \u2013 0.525 duty = $10.725 before ads; \u2013 25% \u00d7 $24 = $4.725.\n    - Evidence: Retail contribution = 14.00 \u2013 3.50 \u2013 0.75 \u2013 0.525 \u2013 1.12 co-op \u2013 0.56 returns = $7.545; break-even at 600 doors = 7.5M \u00f7 7.545 \u00f7 31,200 = 31.9 units/door/week.\n    - Evidence: Break-even ACoS for 2030 payback: cumulative contribution must cover $9.2M of fixed and setup costs plus $1.68M of end-2030 inventory over 2.81M units \u2192 $3.87 a unit \u2192 ACoS \u2264 28.6%.\n    - Evidence: Tariff at 25%: duty $0.875 vs $0.525 \u2192 +$0.35 a unit \u00d7 2.81M = \u2013$0.98M, plus \u2013$0.13M of extra inventory = \u2013$1.1M.\n    - Evidence: Pilot run-rate: 14,000 \u00d7 12 = 168k units = $4.03M; 2027 plan of 300k = 1.79\u00d7 that.\n    - Evidence: group context (ex-US revenue $140M/$146M/$152M/$158M at 11.0% operating margin)\n\n**Recommendation:** Approve the Amazon-led launch (Option A) in 2027 with a $4M cash envelope, a 28% ACoS ceiling and a gate in March 2028; defer specialty retail (do not launch national specialty retail in 2027; revisit in 2030 for 2031, once awareness is above 20% and US cash has paid back); move the ambition to $25M+ US revenue in 2030 and $40M around 2032, keeping the cash cap, payback rule and margin floor unchanged; look again at the Japan scale-up for 2028.\n\n**Alternatives considered:**\n- A \u00b7 Amazon-led launch: Chosen. Passes all three financial tests: peak cash \u2013$1.9M (cap $18M), payback in 2030, group margin never below 9.5%; $26.4M 2030 revenue. Payback only if ACoS \u2264 28.6% (fails at 32% benchmark), hence gated.\n- B \u00b7 Retail-led launch (600 specialty doors): Rejected. Fails all three tests on its own numbers: peak cash \u2013$20.8M, no payback by 2030, group margin 4.5% in 2027; key inputs (4.5 units/door/week, 1.3\u00d7 halo) do not hold; \u2013$26.4M on evidence inputs.\n- J \u00b7 Japan scale-up: Not chosen for 2027. Safer bet for 2030 cash (+$1.8M vs \u2013$2.3M at benchmark ACoS), pays back in 2029, but adds only $7.0M of revenue in a market growing 1.5%/yr; recommended to look at again for 2028.\n- CEO's phase 2: A + 600 retail doors from 2029 at $10M Amazon sales and 15% awareness: Rejected. Would break payback and the margin floor (\u2013$11.8M at 2030, margin 6.3%); 15% awareness gate too low (10\u201320% band median 3.5 < 4.0 delisting bar). Replaced by: decide in 2030 for 2031, >20% awareness, payback met, door-scaled cost base.\n- Keep 2030 for the $40M ambition and relax the financial rules: Not recommended. Only retail-led gets near $40M, and it needs a cap above $20.8M on optimistic inputs (\u2013$26.4M on evidence inputs), no payback by 2030, and margins below 8% for three years.\n- Keep the financial rules and move the $40M date to about 2032: Recommended. Read \"on the way to $40M\" as $25M+ in 2030 with a credible path to $40M around 2032.\n- Use the trade-press $5.2B market size: Rejected: includes makeup and hair care; overstates Onsoo's addressable market by about 45%. Use $3.6B.\n\n**Assumptions and uncertainties:**\n- \"$40M by 2030\" is read as a 2030 revenue target and treated as an ambition. The cash cap, payback and margin floor are treated as hard constraints.\n- US revenue = what Onsoo receives: $24 on Amazon and $14 wholesale for retail, not shelf value.\n- Retail volumes run for the full year from 2027, as the planning team implies; no ramp-up.\n- Tariff stress applies 25% duty to all four years (conservative, since the decision is mid-2027).\n- Listings move from the cross-border seller to Onsoo's own operation inside the $0.8M setup cost.\n- Stall case = Amazon flat at 200k units ($4.8M) a year, consistent with peers below $5M.\n- Cash envelope $4M is our proposal, covering the worst non-stall stress case (\u2013$3.9M).\n- Pre-tax US cash flow; constant FX (KRW 1,380/$); no terminal value.\n- Hero-SKU unit economics applied to all SKUs, as the planning team does.\n- Japan: incremental figures as given (no working-capital data provided); Japan worst case not modeled in the pack.\n- All inputs come from the briefing pack; no outside data used. Figures are synthetic benchmark data.\n- Post-2030 path is illustrative: assumes ~25% a year growth after 2030 (A grew 29% in 2030); not in the planning data.\n- Payback holds only if ACoS \u2264 28.6%; benchmark for brands this size is 32% (range 26\u201338%).\n- The Amazon halo may exist, but it is unproven.\n- Risk: Ad cost at scale \u2013 \u2013$0.67M per ACoS point; 32% \u2192 \u2013$2.3M (no payback).\n- Risk: Demand stall \u2013 2 of 3 Amazon-first peers stayed below $5M; \u2013$7.1M by 2030 if continued; about \u2013$3M if stopped at Gate 1.\n- Risk: Tariff 15% \u2192 25% \u2013 +$0.35/unit; \u2013$1.1M; break-even ACoS 28.6% \u2192 26.9%; decision mid-2027.\n- Risk: Low repeat \u2013 29% vs 31% benchmark; lower lifetime value means more reliance on ads.\n- Risk: FX (KRW/USD) \u2013 10% weaker won = +$0.40/unit (upside); stronger won is the mirror risk.\n- Risk: Launch execution \u2013 Korean-only labels in 6% of reviews; first US entity; MoCRA compliance.\n- 2027 plan needs 300k units = 1.8\u00d7 the June run-rate; from today's 3 SKUs alone that takes ~4.6% monthly growth through 2027.\n\n**Next steps:**\n- Approve five decisions at the March 2027 board meeting\n- Before launch: re-forecast Option A at 32% ACoS and a 25% tariff\n- Confirm the label and MoCRA work plan\n- Plan the hand-over from the cross-border seller\n- Phase 1 (Apr\u2013Dec 2027): set up the US entity, MoCRA registration and US-compliant labels; move listings to Onsoo's own Amazon operation; add four SKUs; weight the $0.7M off-Amazon budget to TikTok and social; run at a 28% blended ACoS ceiling within a $4M cash envelope\n- Gate 1 at the March 2028 board on full-year 2027 results under green/amber/red rules\n- Track KPIs monthly: blended ACoS, Amazon units vs plan, 90-day repeat, aided awareness, cumulative US cash\n- Re-run the awareness survey every year\n- Look again at the Japan scale-up for 2028\n- Decide on retail in 2030 for a 2031 launch; measure the Amazon halo directly before scaling doors\n\n## Part 2 \u00b7 Full slide text (mechanical extraction)\n\n=== Slide 1 ===\n[Title] Onsoo Botanicals \u00b7 US market entry\n- Should Onsoo enter the US market in 2027, and if so, by which route?\n- Recommendation: yes, with an Amazon-led launch run as a gated build\n- Discussion document for CEO Park Ji-won and the Board \u00b7 for decision at the March 2027 board meeting\n- Prepared November 2026 using only the planning team's briefing pack (synthetic benchmark data; all figures fictional)\n\n=== Slide 2 ===\n[Title] Onsoo should enter the US in 2027 with an Amazon-led launch: it is the only route that fits the board's financial rules, but it needs gates because payback depends on ad cost\n\n- Enter the US in 2027, rather than scale up Japan\n- US K-beauty skincare is $3.6B, growing 17% a year (category: 5%), and 41% of it sells on Amazon.\n- The pilot shows demand: 64,800 units in six months at 4.5 stars, a $4.0M annualised run-rate, and 29% repeat (benchmark 31%).\n- Amazon-led gives $26.4M of US revenue in 2030 vs $7.0M of extra revenue from the Japan scale-up, with peak cash of only $1.9\u20133.2M.\n- Lead with Amazon, not a 600-door specialty-retail launch\n\n- Amazon-led passes all three financial tests: peak cash \u2013$1.9M (cap $18M), payback in 2030, group margin never below 9.5%.\n- Retail-led fails all three on its own numbers: peak cash \u2013$20.8M, no payback by 2030, group margin 4.5% in 2027.\n- Its key inputs do not hold: at Onsoo's 4% awareness, newcomers sell a median 2.6 units/door/week (plan: 4.5; delisting below 4.0), and the 1.3\u00d7 halo rests on a correlation.\n\n- Launch with conditions, because three parts of the CEO's plan need changing\n- Payback holds only if ACoS \u2264 28.6%. At the 32% benchmark for brands this size, cash is still \u2013$2.3M at end-2030, so set a 28% ACoS ceiling and hold a gate in March 2028.\n- Retail from 2029 at the planned cost would break payback and the margin floor. Enter retail after payback and above 20% awareness (not 15%).\n- No modeled route reaches $40M by 2030 inside the cash cap and payback rule. Keep the rules and move the $40M date to about 2032.\n- Decision for March 2027: approve the Amazon-led launch with a $4M cash envelope, a 28% ACoS ceiling and a gate in March 2028; defer specialty retail; move the $40M ambition to about 2032.\n- Source: Onsoo briefing pack (Tables 1\u20139, survey Sept 2026); team analysis. Cash figures are pre-tax, cumulative US cash flow 2027\u20132030 incl. inventory.\n\n=== Slide 3 ===\n[Title] We tested the CEO's starting hypothesis against seven conditions: the Amazon-first route holds, but payback, retail timing and the $40M date need changing\n[Table]\n  |  | What would have to be true | What the evidence says | Verdict |\n  | Market | US K-beauty skincare is large, growing and bought mainly on Amazon | $3.6B in 2025, +17%/yr; Amazon 41% of sales; 61% of K-beauty buyers buy there most often | \u2713 Holds |\n  | Product | Onsoo's products win with US Amazon shoppers | 4.5 stars from 2,140 reviews; units +89% Jan\u2192Jun; repeat 29% vs 31% benchmark; 6% complain of Korean-only labels | \u2713 Holds, after a label fix |\n  | Use of 2027 | The US is a better use of the single 2027 launch slot than Japan | 2030 revenue $26.4M (US) vs $7.0M (Japan); both inside the constraints on plan; Japan grows 1.5%/yr | \u2713 Holds |\n  | Route | Starting on Amazon beats starting in 600 specialty doors | Retail-led breaks the cash cap, payback and margin floor; 4.5 units/door/week is unsupported at 4% awareness | \u2713 Holds |\n  | Economics | Amazon-led meets the cash cap, payback and margin floor | Cap and margin hold in every case tested; payback only if ACoS \u2264 28.6% (benchmark at this scale 32%) | \u25d0 Partly: payback at risk |\n  | Retail timing | Retail from 2029 at $10M sales and 15% awareness works | At 10\u201320% awareness the median is 3.5 units/door/week (< 4.0 delisting bar); 2029 retail takes cash to \u2013$11.8M | \u2717 Does not hold |\n  | Ambition | The route gets Onsoo to $40M of US revenue by 2030 | Amazon-led reaches $26.4M; only retail-led gets close ($37.6M), and it breaks the cash cap | \u2717 Does not hold |\n- Revised answer: enter via Amazon in 2027, run against a 28% ACoS ceiling with a gate in March 2028; add specialty retail only after payback and above 20% awareness; move the $40M ambition to about 2032.\n- Starting hypothesis (CEO): \"Launch in the US in 2027 through Amazon, then add specialty beauty retail from 2029 once Amazon sales pass $10M and aided awareness passes 15%.\"\n\n=== Slide 4 ===\n[Title] US K-beauty skincare is a $3.6B segment growing 17% a year, over three times the category's rate, and 41% of it is bought on Amazon\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n- US facial skincare sales, $B: K-beauty share rose from 9.5% to 14.7%\n- Where K-beauty skincare was bought, 2025\n- What K-beauty buyers told us\n- 61% buy K-beauty on Amazon most often; 22% at specialty retail\n- 38% discovered their last new brand on TikTok; 17% in a store\n- 52% cite \"price compared with US brands\" as a reason to try K-beauty\n- Amazon K-beauty skincare \u2248 41% \u00d7 $3.6B = $1.48B; Option A's 2030 revenue is 1.8% of that\n[Chart: COLUMN_STACKED]\n  categories: 2021; 2022; 2023; 2024; 2025\n  series 'K-beauty brands': 1.9; 2.3; 2.7; 3.1; 3.6\n  series 'Other facial skincare': 18.2; 19; 19.9; 20.4; 20.9\n[Chart: BAR_CLUSTERED]\n  categories: Other; Brand DTC; Mass retail; Specialty beauty; Amazon\n  series 'Share of 2025 K-beauty skincare sales': 0.06; 0.12; 0.14; 0.27; 0.41\n- Use $3.6B, not $5.2B. The trade-press figure of \"$5.2B US K-beauty\" includes makeup and hair care. It overstates Onsoo's addressable market by about 45%.\n- CAGR 2021\u201325: K-beauty +17% \u00b7 all facial skincare +5% \u00b7 non-K-beauty +3.5%\n- So what: the market is big enough, growing fast, and Amazon-centric. That favours an Amazon-led entry.\n- Source: briefing pack Table 1 (US facial skincare sales), Table 2 (K-beauty channel shares 2025), customer survey Sept 2026 (n=1,200 US women 18\u201344). CAGR = (2025/2021)^(1/4) \u2013 1.\n\n=== Slide 5 ===\n[Title] The Amazon pilot shows real demand: monthly sales nearly doubled in six months at 4.5 stars, and repeat purchase is close to the US benchmark\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n- Pilot units per month, 2026 (labels: units and month-on-month growth)\n- 64,800\n- $4.0M\n[Chart: COLUMN_CLUSTERED]\n  categories: Jan; Feb; Mar; Apr; May; Jun\n  series 'Pilot units sold per month': 7400; 8600; 10100; 11800; 12900; 14000\n- units sold Jan\u2013Jun\n- $1.56M of sales at $24.00\n- annualised run-rate\n- June: 14,000 units \u00d7 12 \u00d7 $24\n- 4.5 / 5\n- 29%\n- stars, from 2,140 reviews\n- Top complaint: Korean-only labels (6% of reviews)\n- 90-day repeat\n- Benchmark 31% (first-year US brands); Korea 48%\n- 2027 plan needs 300k units = 1.8\u00d7 the June run-rate (168k). From today's 3 SKUs alone that takes ~4.6% monthly growth through 2027. The four new SKUs add headroom.\n- 28%\n- ACoS in the pilot\n- On a small budget; the plan assumes 25%\n- Growth slowed from 16\u201317% a month (Feb\u2013Apr) to 8\u20139% (May\u2013Jun). The average was 13.6% a month.\n- So what: product-market fit is good enough to scale. Two watch-points: fix the US labels before scaling, and bring repeat from 29% up to the 31% benchmark as the range grows.\n- Source: briefing pack \u00a76 (pilot Jan\u2013Jun 2026, three SKUs, cross-border seller). Run-rate = June units \u00d7 12 \u00d7 $24. Growth needed = constant monthly growth from June 2026 that delivers 300k units in calendar 2027 with today's SKUs.\n\n=== Slide 6 ===\n[Title] An Amazon-led US launch is a better use of the single 2027 launch slot than the Japan scale-up: about four times the 2030 revenue for a small, capped downside\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n[Table]\n  | Metric (US cash = cumulative, pre-tax, incl. inventory) | A \u00b7 Amazon-led / plan (25% ACoS) | A \u00b7 Amazon-led / benchmark (32% ACoS) | J \u00b7 Japan scale-up |\n  | Revenue in 2030 | $26.4M | $26.4M | $7.0M (incremental) |\n  | Peak cumulative cash need, 2027\u201330 | \u2013$1.9M | \u2013$3.2M | \u2013$1.05M |\n  | Cumulative cash at end-2030 | +$2.4M | \u2013$2.3M | +$1.8M |\n  | Cash flow in 2030 (run-rate) | +$2.7M | +$0.9M | +$1.3M |\n  | Lowest group operating margin, 2027\u201330 | 9.5% | 9.1% | 10.1% |\n  | Board tests met (cap / payback / margin) | \u2713 / \u2713 / \u2713 | \u2713 / \u2717 / \u2713 | \u2713 / \u2713 / \u2713 |\n  | Market growth; Onsoo's position | +17%/yr K-beauty; new market | +17%/yr K-beauty; new market | +1.5%/yr; already 3.1% share |\n  | Worst case tested | Sales stall: \u2013$7.1M by 2030, or about \u2013$3M if stopped at the March 2028 gate |  | Small; not modeled in the pack |\n- Why the US wins the 2027 slot\n- Scale: the US adds about 4\u00d7 the revenue Japan does by 2030, and is still growing 29% a year in 2030.\n- Bounded downside: even the worst US case tested (\u2013$7.1M) uses under 40% of the $18M cap.\n- Timing: the pilot has momentum and 2,140 reviews. Waiting a year cedes a market growing 17% a year.\n- The trade-off\n- Japan is the safer bet for 2030 cash (+$1.8M vs \u2013$2.3M at benchmark ACoS). We give that up for the only option that moves the US ambition forward.\n- The bandwidth limit covers 2027 only, so we recommend looking at the Japan scale-up again for 2028.\n- So what: use 2027 for the US. Japan's extra cash does not make up for losing a year in a market growing 17% a year, and the US downside is small.\n- Source: briefing pack Tables 5\u20137, group context; team model. Japan: incremental figures as given (no working-capital data provided). Stall case: Amazon flat at 200k units ($4.8M) a year at 32% ACoS.\n\n=== Slide 7 ===\n[Title] Per unit, retail earns more than Amazon ($7.55 vs $4.73), but the retail route adds $7.5M a year of fixed cost that its unit margin cannot cover\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n[Table]\n  | Per unit, US$ | Amazon | Specialty retail |\n  | Price Onsoo receives | 24.00 | 14.00 (50% of $28 shelf) |\n  | Amazon referral fee (15%) | \u20133.60 | \u2014 |\n  | Amazon FBA fee | \u20135.10 | \u2014 |\n  | Ex-factory product cost | \u20133.50 | \u20133.50 |\n  | Freight to US warehouse / retailer DC | \u20130.55 | \u20130.75 |\n  | Import duty (15% of ex-factory) | \u20130.53 | \u20130.53 |\n  | Co-op marketing (8%) + returns (4%) of wholesale | \u2014 | \u20131.68 |\n  | Contribution before advertising | 10.73 | 7.55 |\n  | Advertising at 25% ACoS (plan) / 32% (benchmark) | \u20136.00 / \u20137.68 | in fixed budget |\n  | Contribution per unit | 4.73 / 3.05 | 7.55 |\n- Retail's own break-even, at the planned cost base\n- Retail-only fixed cost: $6.0M national marketing + $1.5M field team = $7.5M a year.\n- Units needed = $7.5M \u00f7 $7.545 = 994k a year. Across 600 doors that is \u00f7 (600 \u00d7 52) = 32 units/door/week.\n- The plan assumes 4.5; the evidence for Onsoo suggests 2.6. At 4.5, retail would need \u22484,248 doors to cover its costs.\n- At 4.5 units/door/week, 600 doors sell 140k units: $2.0M of wholesale revenue against $7.5M of fixed cost.\n- Amazon's sensitivity is advertising\n- Each ACoS point costs $0.24 a unit, or \u2248 $0.67M over the 2.81M units planned for 2027\u201330.\n- Unit break-even ACoS is 44.7%, but covering fixed costs by 2030 needs \u2264 28.6% (see section 3).\n- So what: retail only makes sense if it lifts Amazon sales enough to pay for itself. That rests on the halo assumption tested on page 10.\n- Source: briefing pack Table 4 (Rice Ferment Barrier Cream, applied to all SKUs as the planning team does), Table 6. Contribution before fixed costs; duty at 15% of ex-factory cost.\n\n=== Slide 8 ===\n[Title] Only the Amazon-led route passes all three of the board's financial tests; retail-led fails all three even on the planning team's own assumptions\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n- Cumulative cash flow by option, $M (planning-team assumptions)\n[Table]\n  | Board test | A \u00b7 Amazon | B \u00b7 Retail | J \u00b7 Japan |\n  | Peak cash \u2264 $18M | \u2713 \u2013$1.9M | \u2717 \u2013$20.8M | \u2713 \u2013$1.05M |\n  | Payback by end-2030 | \u2713 2030 (+$2.4M) | \u2717 Not by 2030 | \u2713 2029 |\n  | Group margin \u2265 8% every year | \u2713 low 9.5% | \u2717 4.5% in 2027 | \u2713 low 10.1% |\n  | Ambition: 2030 revenue vs $40M | $26.4M | $37.6M | No US; +$7.0M Japan |\n[Chart: LINE]\n  categories: 2027; 2028; 2029; 2030\n  series 'A \u00b7 Amazon-led': -1.94; -1.7905; -0.3165; 2.39975\n  series 'B \u00b7 Retail-led': -9.47615; -15.0925; -18.9283; -20.7962\n  series 'J \u00b7 Japan scale-up': -1.05; -0.5; 0.5; 1.8\n  series 'Board cap: \u2013$18M peak cash': -18; -18; -18; -18\n- Group margin under B, 2027: ($140M \u00d7 11% \u2013 $8.66M US loss) \u00f7 ($140M + $11.33M) = 4.5%. It stays below 8% until 2030 (6.6%, 7.5%, then 8.2%).\n- B's cash is still falling in 2030 (\u2013$1.9M that year), so it has no route to payback on the planning team's own inputs.\n- So what: retail-led is out on the board's own rules before we even question its inputs. Amazon-led passes, but with little room on payback.\n- Source: team model on briefing-pack inputs (Tables 4\u20137; planning-team volumes, 25% ACoS, 4.5 units/door/week, 1.3\u00d7 halo). Cash = contribution \u2013 fixed \u2013 one-time \u2013 change in inventory (4 months of landed cost); pre-tax.\n\n=== Slide 9 ===\n[Title] Retail-led's 4.5 units/door/week comes from successful brands; at Onsoo's 4% awareness, newcomers sell a median 2.6, and most fall below the delisting bar\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n- Median first-year units/door/week, by awareness among category buyers\n- Why 4.5 is not a credible base case for Onsoo\n- Onsoo's aided awareness is 4% of category buyers (9% among K-beauty buyers), so it falls in the below-10% band.\n- In that band even the top quartile (3.4) is below the 4.0 bar. More than 75% of comparable newcomers would be removed at the 12-month review.\n- The 4.5 comes from the retailer's deck on successful newcomers, which is survivorship bias. It matches the above-20% band (4.6), five times Onsoo's awareness.\n- Mooncrest (retail-first, 450 doors, 2023) was removed from shelves in 2025 after an estimated $21M US loss.\n- With 2.6 units/door/week and no halo, retail-led's cumulative cash reaches \u2013$26.4M by 2030.\n[Chart: COLUMN_CLUSTERED]\n  categories: Below 10%\n(Onsoo today: 4%)\nIQR 1.9\u20133.4; 10\u201320%\n(CEO's 15% gate)\nIQR 2.8\u20134.3; Above 20%\n\nIQR 3.9\u20135.5\n  series 'Median units per door per week, first year': 2.6; 3.5; 4.6\n- Option B assumes 4.5\n- Delisting bar: below 4.0 at the 12-month review\n- So what: on the evidence, a 2027 national retail launch would probably be delisted in 2028, repeating Mooncrest's loss.\n- Source: briefing pack Table 8 (retail analytics firm, 2025, 46 newcomer brands; IQR = interquartile range), Table 9, survey Sept 2026. Evidence-adjusted B = 2.6 units/door/week, no halo, otherwise as planned.\n\n=== Slide 10 ===\n[Title] The 1.3\u00d7 Amazon \"halo\" behind retail-led rests on a correlation; to pay for retail's costs the halo would need to be 2.1\u20133.4\u00d7 from 2028\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n- Why a 0.71 correlation does not show that retail drives Amazon\n- Reverse causation: retailers sign brands that already sell. Saebom reached ~$30M on Amazon first and then added 300 doors in 2025.\n- Common cause: older, bigger, better-funded brands have both more doors and more Amazon sales.\n- Survivorship: the sample is 30 brands sold in the US today. Failures such as Mooncrest are probably not in it.\n- Size of effect: r = 0.71 means r\u00b2 \u2248 0.50 shared variance. It says nothing about direction or about how big a 1.3\u00d7 uplift would be.\n- Customer evidence points the other way: only 17% of K-beauty buyers found their last new brand in a store (38% on TikTok), and 22% buy at specialty retail most often.\n- Amazon multiple needed for retail to cover its own costs\n[Chart: COLUMN_CLUSTERED]\n  categories: 2027; 2028; 2029; 2030\n  series 'Amazon multiple needed to cover retail costs': 5.54369; 3.43412; 2.51574; 2.10331\n- Dashed orange line = the 1.3\u00d7 halo assumed in Option B (a 30% uplift)\n- So what: the halo may exist, but it is unproven. To pay for retail it would have to lift Amazon sales by 110\u2013240%, not 30%. Measure it before paying $7.5M a year for it.\n- Source: board member memo (r = 0.71 across 30 K-beauty brands), Table 9, survey Sept 2026. Halo needed = 1 + (retail fixed cost $7.5M \u2013 retail contribution) \u00f7 Option-A Amazon contribution at 25% ACoS; one-time costs excluded.\n\n=== Slide 11 ===\n[Title] Payback by 2030 is the binding constraint: Amazon-led pays back only if ACoS stays at or below 28.6%, while the benchmark for brands this size is 32%\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n- Option A cumulative cash at end-2030 by ACoS (blue = pays back, red = does not)\n- Cumulative cash at end-2030, $M: ACoS \u00d7 volume\n[Chart: COLUMN_CLUSTERED]\n  categories: 25%\nplan; 26%\nlow end; 28%\npilot; 30%; 32%\nmedian; 35%; 38%\nhigh end\n  series 'Cumulative US cash at end-2030': 2.39975; 1.72535; 0.37655; -0.97225; -2.32105; -4.34425; -6.36745\n[Table]\n  | Volume vs plan \u2193 / ACoS \u2192 | 25% | 28% | 30% | 32% | 35% |\n  | 70% | \u2013$1.1M | \u2013$2.5M | \u2013$3.4M | \u2013$4.4M | \u2013$5.8M |\n  | 85% | +$0.7M | \u2013$1.1M | \u2013$2.2M | \u2013$3.4M | \u2013$5.1M |\n  | 100% (plan) | +$2.4M | +$0.4M | \u2013$1.0M | \u2013$2.3M | \u2013$4.3M |\n  | 115% | +$4.1M | +$1.8M | +$0.3M | \u2013$1.3M | \u2013$3.6M |\n- The plan assumes ACoS falls to 25% as the brand matures. The agency data says it rises as brands bid on broader keywords, to a median of 32% between $5M and $20M a year, which is exactly A's path ($7.2M \u2192 $26.4M).\n- At the pilot's 28%, volume must reach \u2265 96% of plan to pay back. At 25%, \u2265 79%.\n- The cash cap is never the issue: peak cash stays between \u2013$1.9M and \u2013$6.4M across 25\u201338% ACoS.\n- So what: treat ACoS as the key operating metric. Cap blended ACoS at 28%, and give up growth rather than buy volume above the ceiling. Re-forecast at 32% before launch.\n- Source: team model; briefing pack \u00a76 (pilot ACoS 28%), \u00a711 (agency benchmark: median 32%, range 26\u201338% for brands scaling $5M\u2192$20M on Amazon US). Volumes as planned unless stated.\n\n=== Slide 12 ===\n[Title] The downside is bounded: even if sales stall or tariffs rise, Amazon-led needs at most $7.1M of peak cash, well under the $18M cap, and group margin stays above the 8% floor\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n- Peak US cash need by scenario, $M (blue = Amazon-led; orange = retail-led for comparison)\n[Table]\n  | Scenario | Payback by 2030 | Lowest group margin |\n  | Plan (25% ACoS) | \u2713 Yes | 9.5% |\n  | Pilot ACoS (28%) | \u2713 Yes | 9.3% |\n  | Tariff rises to 25% | \u2713 Yes | 9.4% |\n  | Benchmark ACoS (32%) | \u2717 No | 9.1% |\n  | 32% ACoS + 25% tariff | \u2717 No | 9.0% |\n  | ACoS at top of range (38%) | \u2717 No | 8.8% |\n  | Sales stall at $4.8M/yr, 32% ACoS | \u2717 No | 9.1% |\n  | B \u00b7 Retail-led plan (comparison) | \u2717 No | 4.5% |\n[Chart: BAR_CLUSTERED]\n  categories: B \u00b7 Retail-led plan (comparison); Sales stall at $4.8M/yr, 32% ACoS; ACoS at top of range (38%); 32% ACoS + 25% tariff; Benchmark ACoS (32%); Tariff rises to 25%; Pilot ACoS (28%); Plan (25% ACoS)\n  series 'Peak cumulative cash need': 20.7962; 7.069; 6.36745; 3.88697; 3.2353; 2.15683; 2.4097; 1.94\n- $18M cap\n- If sales stall and we stop at the March 2028 gate, the loss is about $3M (2027: \u2013$2.6M, plus one quarter of 2028). A 10% weaker won (\u2248 \u2013$0.40 a unit) would roughly offset the tariff rise (+$0.35 a unit).\n- So what: the cash cap and margin floor are safe in every Amazon-led case. The real risk is payback. A gate can limit the cost of a stall to about $3M.\n- Source: team model. Tariff stress applies 25% duty to all years (decision expected mid-2027, so conservative). Stall = Gaon Lab/Yeoreum-type outcome (<$5M US revenue). FX: 10% weaker won cuts ex-factory + duty by \u2248$0.40 a unit.\n\n=== Slide 13 ===\n[Title] Specialty retail should follow payback, not come before it: 600 doors in 2029 would break payback and the margin floor, and a 15% awareness gate is too low\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n- Cumulative US cash, $M\n[Table]\n  | Gate for entering retail | CEO's proposal | Recommended | Why |\n  | Timing | From 2029 | Decide in 2030 for 2031 | 2029 entry: \u2013$11.8M at 2030, margin 6.3% |\n  | Aided awareness (category buyers) | > 15% | > 20% | 10\u201320%: median 3.5 < 4.0 bar; >20%: median 4.6 |\n  | Amazon sales | > $10M | > $10M (kept) | Reached in 2028 on plan; not binding |\n  | US cash | \u2014 | Cumulative \u2265 0 (payback met) | Board's payback rule |\n  | Cost base | National, $7.5M/yr | Scaled to doors | Needs 32 units/door/week at 600 doors |\n[Chart: LINE_MARKERS]\n  categories: 2027; 2028; 2029; 2030\n  series 'A \u00b7 Amazon-led only': -1.94; -1.7905; -0.3165; 2.39975\n  series \"A + 600 retail doors from 2029 (CEO's phase 2)\": -1.94; -1.7905; -8.12208; -11.823\n- Raising awareness from 4% to 20% (5\u00d7) is the main brand-building job for 2027\u201330. TikTok (38% of discovery) is the main lever, so weight the $0.7M off-Amazon budget towards it. Re-run the awareness survey every year.\n- So what: keep retail in the plan but make it the next step after payback, triggered by >20% awareness rather than by the calendar.\n- Source: team model (A plan + 600 doors from 2029 at B's cost base: $7.5M/yr fixed, $0.5M launch fee, $1,100/door, 4.6 units/door/week = above-20% awareness median); Table 8.\n\n=== Slide 14 ===\n[Title] No modeled route reaches $40M by 2030 within the $18M cap and 2030 payback; we recommend keeping the financial rules and moving the $40M date to about 2032\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n- US revenue in 2030 by route, $M, and the board tests each route meets\n- Board options for the ambition\n[Chart: COLUMN_CLUSTERED]\n  categories: A \u00b7 Amazon-led; A + retail 2029; B \u00b7 plan inputs; B \u00b7 evidence inputs\n  series 'US revenue in 2030': 26.4; 28.4093; 37.596; 28.2928\n- Recommended: keep the rules, move the date. Read \"on the way to $40M\" as $25M+ in 2030 with a credible path to $40M around 2032.\n- Not recommended: keep 2030, relax the rules. Only retail-led gets near $40M, and it needs a cap above $20.8M on optimistic inputs (\u2013$26.4M on evidence inputs), no payback by 2030, and margins below 8% for three years.\n- Ambition: $40M in 2030\n- Illustrative path for Option A after 2030\n[Table]\n  | Path | 2030 | 2031 | 2032 |\n  | A, continuing at ~25%/yr (illustrative) | $26.4M | $33.0M | $41.3M |\n  | + retail from 2031 if gates are met | \u2014 | upside | upside |\n[Table]\n  | \u2713 cap \u00b7 \u2713 payback / \u2713 margin floor | \u2713 cap \u00b7 \u2717 payback / \u2717 margin floor | \u2717 cap \u00b7 \u2717 payback / \u2717 margin floor | \u2717 cap \u00b7 \u2717 payback / \u2717 margin floor |\n- So what: the $40M-by-2030 ambition cannot be met together with the board's $18M cap and 2030 payback rule. The board should formally choose which one gives way. We recommend the date.\n- Source: team model. US revenue = Onsoo's receipts (Amazon at $24; retail at $14 wholesale). Post-2030 path is illustrative: assumes ~25% a year growth after 2030 (A grew 29% in 2030); not in the planning data.\n\n=== Slide 15 ===\n[Title] We recommend a three-phase plan in which each phase is unlocked by measured results rather than by the calendar\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n- Phase 1 \u00b7 Launch\n- Apr\u2013Dec 2027\n- Phase 2 \u00b7 Scale on Amazon\n- 2028\u20132030\n- Phase 3 \u00b7 Add retail\n- Decide 2030 \u2192 launch 2031\n- Gate 1 \u00b7 March 2028 board\n- on full-year 2027 results\n- Set up the US entity, MoCRA registration and US-compliant labels (removes the Korean-only label complaint)\n- Move the listings from the cross-border seller to Onsoo's own Amazon operation\n- Add four SKUs (seven in total); weight the $0.7M off-Amazon budget to TikTok and social\n- Run at a blended ACoS ceiling of 28%; cash envelope $4M (covers the \u2013$3.9M stress case)\n- Scale towards ~1.1M units ($26M) only while ACoS \u2264 28%\n- Build aided awareness from 4% towards 20%; survey every year\n- Lift 90-day repeat from 29% to \u2265 31% through the wider range\n- Look again at the Japan scale-up for 2028 (bandwidth now free)\n- Only when awareness > 20% and US cash has paid back\n- Start with a door-scaled cost base, not the $7.5M national model\n- Measure the Amazon halo directly before scaling doors\n- Path to $40M around 2032\n[Table]\n  | \u2713 Green: scale | ACoS \u2264 28% and units \u2265 96% of plan (re-forecast pays back by 2030); repeat \u2265 31% |\n  | \u25d0 Amber: hold | Anything between green and red: hold ad spend at the ceiling, slow SKU additions, re-forecast in 6 months |\n  | \u2717 Red: stop | ACoS > 32% or units < 70% of plan (stall zone): move to a maintenance model or exit; cash at risk about $3M |\n[Table]\n  | KPI tracked monthly | Today | Gate / target |\n  | Blended ACoS | 28% (pilot) | \u2264 28% ceiling |\n  | Amazon units vs plan | 168k/yr run-rate | 300k in 2027 \u2192 1.1M in 2030 |\n  | 90-day repeat | 29% | \u2265 31% by Gate 1 |\n  | Aided awareness, category buyers | 4% | > 20% before retail |\n  | Cumulative US cash | \u2014 | \u2265 \u2013$4M envelope; \u2265 0 by 2030 |\n- Gate thresholds derived from the team model: payback needs \u226596% of planned volume at 28% ACoS (\u226579% at 25%); 70% of plan \u2248 the stall zone of peers below $5M; 20% awareness from Table 8.\n\n=== Slide 16 ===\n[Title] Six risks could derail the plan; ad cost at scale is the largest, and each risk has an early warning sign and an agreed response\n- 1  Enter in 2027\n- 2  Lead with Amazon\n- 3  Launch with conditions\n[Table]\n  | Risk | Evidence | Quantified impact | Early warning sign | Response |\n  | Ad cost at scale | Pilot 28% on a small budget; benchmark 32% (26\u201338%) | \u2013$0.67M per ACoS point; 32% \u2192 \u2013$2.3M (no payback) | Monthly blended ACoS | 28% ceiling; slower growth over paid volume |\n  | Demand stall | 2 of 3 Amazon-first peers stayed below $5M | \u2013$7.1M by 2030 if continued; about \u2013$3M if stopped at Gate 1 | Units vs plan; growth after SKU launches | Gate 1 red rule; maintenance model or exit |\n  | Tariff 15% \u2192 25% | US review; decision mid-2027 | +$0.35/unit; \u2013$1.1M; break-even ACoS 28.6% \u2192 26.9% | US decision, mid-2027 | Re-forecast; FX offset; review price (limited: 52% buy partly on price) |\n  | Low repeat | 29% vs 31% benchmark; 48% in Korea | Lower lifetime value means more reliance on ads | 90-day repeat by cohort | Range build-out, US labels, regimen bundles |\n  | FX (KRW/USD) | Product costs in won | 10% weaker won = +$0.40/unit (upside); stronger won is the mirror risk | Monthly KRW/USD | Budget at today's rate; group treasury policy |\n  | Launch execution | Korean-only labels in 6% of reviews; first US entity | Reviews and conversion; MoCRA compliance | Review complaints; registration milestones | Labels and MoCRA fixed before scale-up; $0.8M setup budget |\n- So what: most risks hit the payback date, not the cash cap or margin floor. Monitor them monthly and decide on them at Gate 1.\n- Source: briefing pack \u00a713 (uncertainties), \u00a76, \u00a711; team model. Impacts are on Option A cumulative cash at end-2030 vs the plan case (+$2.4M) unless stated.\n\n=== Slide 17 ===\n[Title] We ask the board to approve five decisions at the March 2027 meeting\n- Approve US entry in 2027 through the Amazon-led route (Option A)\n- Setup $0.8M; fixed costs $2.1M a year; cash envelope $4M against the $18M cap\n\n- Adopt the ACoS ceiling and Gate 1\n- Blended ACoS \u2264 28%; review at the March 2028 board under the green/amber/red rules\n\n- Do not launch national specialty retail in 2027\n- Revisit in 2030 for 2031, once awareness is above 20% and US cash has paid back\n\n- Move the ambition to $25M+ US revenue in 2030 and $40M around 2032\n- Keep the cash cap, payback rule and margin floor unchanged\n\n- Look again at the Japan scale-up for 2028\n- Japan becomes the next major launch once 2027 bandwidth is freed\n- Before launch: re-forecast Option A at 32% ACoS and a 25% tariff, confirm the label and MoCRA work plan, and plan the hand-over from the cross-border seller.\n- Interpretation choices made without being able to ask are listed on page 18.\n\n=== Slide 18 ===\n[Title] Appendix: interpretation choices and key modeling assumptions\n- Choices made where we would have asked\n- \"$40M by 2030\" is read as a 2030 revenue target and treated as an ambition. The cash cap, payback and margin floor are treated as hard constraints.\n- US revenue = what Onsoo receives: $24 on Amazon and $14 wholesale for retail, not shelf value.\n- Retail volumes run for the full year from 2027, as the planning team implies; no ramp-up.\n- Tariff stress applies 25% duty to all four years (conservative, since the decision is mid-2027).\n- Listings move from the cross-border seller to Onsoo's own operation inside the $0.8M setup cost.\n- Stall case = Amazon flat at 200k units ($4.8M) a year, consistent with peers below $5M.\n- Cash envelope $4M is our proposal, covering the worst non-stall stress case (\u2013$3.9M).\n- Modeling conventions\n- Pre-tax US cash flow; constant FX (KRW 1,380/$); no terminal value.\n- Cash = units \u00d7 unit contribution \u2013 fixed costs \u2013 one-time costs \u2013 change in inventory.\n- Inventory = 4 months of landed cost (ex-factory + freight + duty): $4.575 a unit on Amazon, $4.775 in retail.\n- Door fixtures ($1,100 per new door) expensed in the year the door opens.\n- Group margin = (ex-US plan revenue \u00d7 11% + US operating result) \u00f7 (ex-US revenue + US revenue). Inventory is excluded from the margin.\n- Hero-SKU unit economics applied to all SKUs, as the planning team does.\n- Japan (Option J): incremental revenue \u00d7 30% \u2013 $0.8M fixed \u2013 $1.0M one-time; no working-capital data provided.\n- Peak cash = the most negative cumulative cash position, 2027\u201330.\n- All inputs come from the briefing pack; no outside data used. Figures are synthetic benchmark data.\n\n=== Slide 19 ===\n[Title] Appendix: Option A (Amazon-led) pays back in 2030 at the plan's 25% ACoS but not at the 32% benchmark\n- Option A \u00b7 plan inputs: 300k \u2192 1.1M units; 25% ACoS ($4.725 a unit); fixed $2.1M a year; setup $0.8M\n[Table]\n  | $M | Revenue | Contribution | Fixed | One-time | Operating result | \u0394 Inventory | Cash flow | Cumulative cash | Group margin |\n  | 2027 | 7.20 | 1.42 | \u20132.10 | \u20130.80 | \u20131.48 | \u20130.46 | \u20131.94 | \u20131.94 | 9.5% |\n  | 2028 | 13.44 | 2.65 | \u20132.10 | \u2014 | 0.55 | \u20130.40 | 0.15 | \u20131.79 | 10.4% |\n  | 2029 | 20.40 | 4.02 | \u20132.10 | \u2014 | 1.92 | \u20130.44 | 1.47 | \u20130.32 | 10.8% |\n  | 2030 | 26.40 | 5.20 | \u201
