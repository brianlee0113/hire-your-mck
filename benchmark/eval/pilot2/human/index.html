nce: SMB 2.0% \u2192 3.1% a month\n    - Evidence: Other SMB customers moved from 2.0% to 2.1%.\n  - Claim: The promotion cohort is an onboarding problem.\n    - Evidence: Only 41% got started properly (72% for other cohorts)\n    - Evidence: most leavers went within two months of the discount ending\n  - Claim: Mid-market and enterprise can take an increase.\n    - Evidence: NRR is 112% and 118%\n    - Evidence: a +10% list test had no significant effect on conversion\n    - Evidence: Inkwell is absent above 200 seats\n  - Claim: SMB is the open question.\n    - Evidence: Inkwell sells at $9 against our $15\n    - Evidence: A 12% SMB increase adds about $1.2M if customers react as they did in 2023, and nothing if they react twice as strongly\n  - Claim: The CFO's $10.3M is $7.6M before any churn response, because only part of the ARR renews in 2027 and enterprise increases are capped.\n  - Claim: Recommended plan: Mid-market +10% at renewal; Enterprise up to 7% cap where capped, up to +10% elsewhere; SMB hold $15 in H1 and split-test +8% in Q1; Promotion cohort no increase, onboarding programme.\n  - Claim: Plan outcomes\n    - Evidence: $4.3M ARR from price, plus up to $0.7M if the SMB test passes\n    - Evidence: ~114% overall NRR (target above 100%)\n    - Evidence: +14.2% growth from existing customers. About $0.6M of new-customer ARR reaches 15%\n  - Claim: Trade-off: on paper this is $0.8\u20132.0M less 2027 ARR than the CFO's plan. In return, we avoid betting the 5,900-customer SMB base on a reaction we have not measured.\n- Slide 3: Churn is rising almost entirely in SMB, and within SMB almost entirely among customers who joined on the 2025 promotion\n  - Claim: If the promotion cohort churned like other SMB customers, SMB churn would be 2.1%, not 3.1%. About 1.0 of the 1.1-point rise is the cohort.\n    - Evidence: Monthly logo churn H1 2025 vs H1 2026: Enterprise (150 customers) 0.2 \u2192 0.2; Mid-market (1,350 customers) 0.6 \u2192 0.8; SMB regular (3,800 customers) 2.0 \u2192 2.1; SMB 2025 promotion cohort (2,100 customers, joined Feb\u2013Aug 2025) not yet a full cohort \u2192 4.9*; SMB total (5,900 customers) 2.0 \u2192 3.1\n    - Evidence: * Implied, not reported: (5,900 \u00d7 3.1% \u2212 3,800 \u00d7 2.1%) \u00f7 2,100 \u2248 4.9%, using mid-2026 customer counts as weights.\n  - Claim: Regular SMB customers have barely moved, even after Inkwell's launch in October 2025.\n    - Evidence: 2.0% \u2192 2.1%\n  - Claim: Mid-market is up from a low base. Watch it, but it is not the driver. Enterprise is flat.\n    - Evidence: 0.6% \u2192 0.8%\n  - Claim: The board dashboard's \"1.4% \u2192 2.3%\" does not define its measure and cannot be reconciled with these figures (appendix). Decide on segment logo churn.\n- Slide 4: The rise in price complaints comes from customers who left when their discount ended. Regular SMB customers cite price no more than in 2025\n  - Claim: The blended rise (19% \u2192 34%) is a mix effect. The promotion cohort's share of churners grew, and 52% of those churners cite price. Regular SMB churners are flat at 18%.\n    - Evidence: Exit-survey churners whose main reason was \"price / found a cheaper option\": All SMB churners H1 2025 19%; All SMB churners H1 2026 34%; Promotion-cohort churners H1 2026 52%; Regular SMB churners H1 2026 18%\n  - Claim: The cohort never got going\n    - Evidence: 41% of promotion-cohort customers sent five or more documents in their first month\n    - Evidence: 72% of customers in other cohorts did the same\n    - Evidence: ~3\u00d7 higher churn for SMB customers who send fewer than five documents in month one\n  - Claim: Most cohort leavers went within two months of the 50% discount ending. For them, the \"price\" answer is the jump back to full price, not our list level.\n  - Claim: So what: the CFO is right that this is mostly an onboarding problem. It also means this cohort will not absorb a further increase in 2027.\n- Slide 5: SMB is now exposed on price. A 12% increase pays off only if customers react less than twice as strongly as they did in 2023, and we cannot yet tell\n  - Claim: SMB is now exposed on price.\n    - Evidence: List price per user per month: Inkwell Starter $9 (launched Oct 2025); Palisade SMB $15 today; Palisade SMB +12% $16.80 CFO proposal; Inkwell Pro $24; Palisade Business $29\n    - Evidence: Win rate vs Inkwell in SMB: 51% \u2192 38% (H1 2025 \u2192 H1 2026).\n  - Claim: A 12% increase pays off only if customers react less than twice as strongly as they did in 2023.\n    - Evidence: Net 2027 ARR effect of +12% on all SMB: No reaction +$2.5M; As in 2023 +$1.2M; 2\u00d7 the 2023 reaction \u2248 $0.0M; 3\u00d7 the 2023 reaction \u2212$1.3M\n    - Evidence: Gross gain is 12% \u00d7 $21.0M = $2.5M. The 2023 response, scaled to 12%, means +0.75 pts of churn for six months and +0.15 pts after, losing about 5.4% of SMB customers. Break-even is about twice the 2023 reaction.\n    - Evidence: 2023 precedent: +8% at renewal lifted SMB churn from 1.8% to 2.3% for six months, then it settled at 1.9%. That was before Inkwell existed.\n  - Claim: The win-rate drop makes that plausible but not proven.\n    - Evidence: Pointing the other way: regular SMB churners citing price are flat (18% vs 19%).\n- Slide 6: Mid-market and enterprise show pricing power. A 10% increase breaks even only if mid-market churn roughly doubles\n  - Claim: Retention is strong\n    - Evidence: Net revenue retention: 112% mid-market, 118% enterprise\n    - Evidence: Monthly logo churn: 0.8% mid-market, 0.2% enterprise\n  - Claim: Price was tested\n    - Evidence: 2024: +10% list price for new mid-market sign-ups\n    - Evidence: Conversion 23.1% vs 23.6% for the control group, not statistically significant\n  - Claim: Competition is absent\n    - Evidence: Inkwell not seen in mid-market or enterprise deals above 200 seats\n    - Evidence: Customers stay for integrations and audit trail (advisory board, 2026)\n  - Claim: A 10% increase breaks even only if mid-market churn roughly doubles\n    - Evidence: Mid-market monthly logo churn: H1 2025 0.6%; H1 2026 0.8%; Proposed tripwire 1.2%; Break-even ~1.6%\n    - Evidence: Break-even: +10% on renewing ARR is lost if an extra 9.1% of renewing customers leave within the year (0.10 \u00f7 1.10). That is about +0.8 pts a month on top of today's 0.8%.\n  - Claim: Why +10%, not the CFO's 12%\n    - Evidence: 10% is the level we tested. 12% on existing customers is untested.\n    - Evidence: The test covered new sign-ups. Renewing customers may react differently, so watch Q1 renewals.\n    - Evidence: Mid-market churn is up 0.2 pts, and accounts of 200 seats or fewer may meet Inkwell.\n    - Evidence: Cost of the caution: $0.7M of 2027 ARR.\n- Slide 7: The CFO's $10.3M assumes all ARR reprices in 2027. The realistic figure is $7.6M before any churn response, and $5.0\u20136.3M after it\n  - Claim: The CFO's $10.3M assumes all ARR reprices in 2027. The realistic figure is $7.6M before any churn response, and $5.0\u20136.3M after it\n    - Evidence: ARR added by +12% on every plan at renewal from January 2027, $M: CFO headline $10.3M (12% \u00d7 $86.0M); Mid-market ARR not renewing in 2027 (15%) \u22120.7; Enterprise ARR not renewing in 2027 (60%) \u22121.7; Enterprise caps: 7% max on 60% of contracts \u22120.3; Before churn response $7.6M; SMB churn response as in 2023 \u22121.3; Realistic, 2023-like reaction $6.3M; Extra loss if reaction is 2\u00d7 \u22121.3; Realistic, 2\u00d7 reaction $5.0M\n    - Evidence: Assumes 2027 enterprise renewals carry the same 60% capped share as the whole enterprise book, and 85% of mid-market ARR renews in 2027 (per the pack). The SMB response uses the 2023 precedent scaled to 12%. Mid-market and enterprise reactions are not modelled.\n- Slide 8: Recommended plan: raise mid-market and enterprise prices at renewal, hold the SMB list price while we test it, and onboard the promotion cohort\n  - Claim: Mid-market: +10% list price at renewal from January.\n    - Evidence: 1,350 customers \u00b7 $41.0M\n    - Evidence: 85% of mid-market ARR ($34.9M) renews in 2027.\n    - Evidence: +$3.5M\n    - Evidence: NRR 112%. The +10% test showed no significant effect. Break-even needs churn to roughly double.\n  - Claim: Enterprise: Up to the 7% cap on capped contracts; up to +10% on uncapped renewals, under each contract's terms.\n    - Evidence: 150 customers \u00b7 $24.0M\n    - Evidence: 40% renews in 2027.\n    - Evidence: +$0.8M\n    - Evidence: NRR 118%, churn 0.2%. Customers stay for integrations and audit trail.\n  - Claim: SMB regular: Hold $15 in H1. In Q1, split-test +8% on half of renewals. If the test passes, apply +8% to H2 renewals.\n    - Evidence: 3,800 customers \u00b7 $16.6M\n    - Evidence: $0 in plan; up to +$0.7M\n    - Evidence: Inkwell at $9; win rate down to 38%. Whether customers react like 2023 or twice as strongly decides whether 12% pays.\n  - Claim: SMB promo cohort: No increase in 2027. Run an onboarding programme for customers sending fewer than five documents a month.\n    - Evidence: 2,100 customers \u00b7 $4.4M\n    - Evidence: Up to ~$1.0M retained (upside)\n    - Evidence: 41% got started properly. Leavers went when the discount ended. Price would accelerate it.\n  - Claim: Total: +$4.3M of 2027 ARR from price in the plan, with up to +$1.7M of upside if the SMB test passes and onboarding works.\n  - Claim: We also recommend not repeating untargeted 50%-off promotions for new self-serve customers.\n- Slide 9: The plan keeps NRR near 114% and grows ARR 14.2% from existing customers. About $0.6M of new-customer ARR closes the gap to the 15% target\n  - Claim: The plan keeps NRR near 114% and grows ARR 14.2% from existing customers. About $0.6M of new-customer ARR closes the gap to the 15% target\n    - Evidence: 2027 ARR bridge: Start of 2027 86.0; Existing customers at trailing NRR +8.0; Mid-market +10% +3.5; Enterprise to cap / +10% +0.8; Existing customers, end 2027 98.3; New-customer ARR needed +0.6; 15% target 98.9\n    - Evidence: Trailing NRR: SMB 94%, mid-market 112%, enterprise 118%.\n  - Claim: Recommended plan vs CFO plan\n    - Evidence: ARR from price: Recommended $4.3M (+$0.7M option); CFO $5.0\u20136.3M (after SMB response)\n    - Evidence: End-2027 ARR, existing customers: $98.3M vs $99.0\u2013100.3M\n    - Evidence: Overall NRR: ~114% vs ~115\u2013117%\n    - Evidence: SMB customers repriced: None until tested vs All 5,900, incl. the promo cohort\n    - Evidence: Mid-market increase: 10%: tested level vs 12%: untested on renewals\n    - Evidence: Can we read churn in 2027?: Yes: clean test and control vs No: price mixed with promo exits\n  - Claim: The CFO's plan is worth $0.8\u20132.0M more on paper. Both plans clear the NRR objective. The difference is which risk we carry into 2028.\n  - Claim: If 2027 NRR runs 3 points below trailing, the new-customer ARR needed rises to about $3.2M.\n    - Evidence: Axis starts at $80M.\n- Slide 10: Onboarding can bring SMB churn back to about 2.1%, not halve it. Plan around the promotion cohort, not the headline claim\n  - Claim: Onboarding can bring SMB churn back to about 2.1%, not halve it.\n    - Evidence: SMB monthly logo churn: 2023, before +8% 1.8%; 2023, settled after +8% 1.9%; H1 2025 2.0%; H1 2026 3.1%\n    - Evidence: Scenarios for 2027: Cohort fixed: churns like regular SMB 2.1% realistic target; \"Halve SMB churn\" (CS claim) 1.55% below any level since 2023\n    - Evidence: Halving 3.1% means 1.55%. That would need regular SMB customers to fall well below the 1.8\u20132.0% range SMB has run at since 2023, not just to fix the promotion cohort.\n  - Claim: Closing that gap retains up to ~$1.0M of ARR. That is a real prize, but not a substitute for price.\n    - Evidence: The cohort is $4.4M of ARR. At ~4.9% a month it loses about 45% of that over 12 months; at 2.1%, about 22%.\n  - Claim: Caveat: much of the H1 2026 churn was the cliff when the discount ended. The survivors may already churn less, so the gain could be smaller.\n  - Claim: Target: cohort churn converging on the regular SMB rate (~2.1%) by mid-2027, tracked monthly.\n- Slide 11: Agreed tripwires let us stop or extend each 2027 increase on evidence, not opinion\n  - Claim: Mid-market renewals at +10%: tripwire if monthly churn of customers who renewed at the new price goes above 1.2%; pause further increases, review accounts of 200 seats or fewer first\n    - Evidence: 0.8% today; break-even ~1.6%\n    - Evidence: Monthly from February; decision end of March\n  - Claim: SMB split test (+8%): tripwire if test group's churn exceeds control by 0.6 pts a month or more. Below the line: +8% on H2 SMB renewals (up to +$0.7M). Above it: hold SMB through 2027\n    - Evidence: That reaction would wipe out the gain\n    - Evidence: End of Q1; H2 decision in April\n  - Claim: Promotion cohort: if churn not converging on ~2.1% by mid-2027 despite the onboarding programme, stop extra onboarding spend and plan for the remaining cohort to churn\n    - Evidence: Monthly; review in July\n  - Claim: SMB win rate vs Inkwell: if it falls below 38% (H1 2026 level), revisit SMB packaging against Inkwell before any SMB increase\n    - Evidence: Quarterly\n  - Claim: Board churn metric: undefined today; report logo churn by segment, with the promotion cohort shown separately\n    - Evidence: \"1.4% \u2192 2.3%\" does not reconcile\n    - Evidence: Before the December decision\n  - Claim: The SMB test should cover about half of regular SMB renewals. That is enough to detect a reaction large enough to cancel the gain (~0.6 pts a month), not a smaller one like 2023's (~0.3 pts).\n- Slide 12: Five decisions for the leadership team in December\n  - Claim: 1. Approve mid-market +10% and enterprise to-cap increases at renewal from January 2027\n    - Evidence: Replaces the CFO's 12% on every plan. Worth +$4.3M of 2027 ARR.\n  - Claim: 2. Hold the SMB list price at $15 for H1 2027 and approve the Q1 split test\n    - Evidence: Use the decision rule on the previous page to set H2 SMB pricing in April.\n  - Claim: 3. Fund an onboarding programme for the 2025 promotion cohort, with a realistic target\n    - Evidence: Target: cohort churn converging on ~2.1% by mid-2027, not \"halve SMB churn\".\n  - Claim: 4. Confirm the 2027 new-customer ARR plan covers at least $0.6M, ideally about $3M\n    - Evidence: The pack has no new-business figures. This is the one input the 15% target still depends on.\n  - Claim: 5. Ask Finance to redefine the board churn metric before the board sees the pricing plan\n    - Evidence: Logo churn by segment, with the promotion cohort shown separately.\n  - Claim: Timeline\n    - Evidence: Dec 2026: Decision; define churn metric\n    - Evidence: Jan 2027: Mid-market and enterprise renewals at new prices; SMB test and onboarding start\n    - Evidence: Mar 2027: Q1 read-outs: mid-market tripwire, SMB test\n    - Evidence: Apr 2027: Decide H2 SMB pricing\n    - Evidence: Jul 2027: Promotion-cohort review\n- Slide 13: How the main figures were calculated\n  - Claim: CFO headline\n    - Evidence: 12% \u00d7 $86.0M = $10.3M. This assumes every dollar of ARR reprices in 2027 at the full 12%.\n  - Claim: CFO before churn response\n    - Evidence: SMB 12% \u00d7 $21.0M = $2.52M; mid-market 12% \u00d7 85% \u00d7 $41.0M = $4.18M; enterprise renewing $9.6M (40% of $24.0M): 60% capped at 7% = $0.40M, plus 40% at 12% = $0.46M. Total $7.57M.\n  - Claim: SMB churn response\n    - Evidence: 2023: +8% gave +0.5 pts for six months, then +0.1 pts. Scaled linearly to 12%: +0.75 pts \u00d7 6 months + 0.15 pts \u00d7 6 months = 5.4% of customers lost, \u00d7 $23.5M repriced ARR = $1.27M (\u00d72 = $2.54M).\n  - Claim: Recommended price ARR\n    - Evidence: Mid-market 10% \u00d7 $34.85M = $3.49M. Enterprise: $5.76M capped at 7% = $0.40M, plus $3.84M at 10% = $0.38M. Total $4.27M.\n  - Claim: SMB H2 option\n    - Evidence: +8% on roughly half of regular SMB ARR (renewing in H2): 8% \u00d7 50% \u00d7 $16.6M \u2248 $0.66M. Regular SMB ARR = $21.0M \u2212 $4.4M cohort.\n  - Claim: Existing-customer bridge\n    - Evidence: $21.0M \u00d7 94% + $41.0M \u00d7 112% + $24.0M \u00d7 118% = $93.98M (+$7.98M), plus price $4.27M = $98.25M (+14.2%). 15% target = $98.9M, so the gap is $0.65M.\n  - Claim: Break-evens\n    - Evidence: Gain p is cancelled when the share of customers lost in the year reaches p \u00f7 (1 + p). Mid-market at 10%: 9.1% a year \u2248 +0.8 pts a month. SMB at 8%: 7.4% \u2248 +0.6 pts. SMB at 12%: 10.7%, about twice the 2023 response.\n  - Claim: Promotion-cohort value\n    - Evidence: 12-month retention at 4.9% a month = 55%; at 2.1% = 78%. Difference \u00d7 $4.4M \u2248 $1.0M.\n  - Claim: SMB test size\n    - Evidence: About 1,900 customers per arm for three months at a 2.1% base rate gives a standard error of about 0.27 pts on the difference. A 0.6-pt reaction is about 2.2 standard errors (detectable); a 0.3-pt reaction is about 1.1 (not). This assumes most test customers renew within Q1, which needs monthly plans; fewer renewals means a weaker test.\n- Slide 14: The board churn figure cannot be reproduced. This page also lists the choices made where the briefing pack was silent\n  - Claim: None of the obvious definitions gives 1.4% \u2192 2.3%. Until Finance defines the figure, it should not be used for this decision.\n    - Evidence: H1 2025 \u2192 H1 2026: Board dashboard (undefined) 1.4% \u2192 2.3%; Customer-weighted logo churn 1.7% \u2192 2.6%; ARR-weighted logo churn 0.8% \u2192 1.2%; SMB logo churn 2.0% \u2192 3.1%\n    - Evidence: Weighted with mid-2026 customer counts and ARR from Table 1.\n  - Claim: Choices made where the pack was silent\n    - Evidence: Mid-market increase set at 10%, the tested level, rather than 12%.\n    - Evidence: SMB test at +8%, the 2023 level, so the 2023 response is a usable benchmark.\n    - Evidence: Enterprise uncapped renewals at up to +10%, matching mid-market. Actual terms vary by contract.\n    - Evidence: 2027 enterprise renewals assumed 60% capped, the same share as the whole enterprise book.\n    - Evidence: 2027 NRR before price assumed equal to trailing 12-month NRR. The SMB figure (94%) includes the promotion cliff, so it is probably conservative.\n    - Evidence: Renewals spread evenly through the year, so about half of SMB ARR renews in H2.\n    - Evidence: Promotion-cohort churn (4.9%) is implied from blended and regular SMB rates, weighted by mid-2026 counts.\n    - Evidence: Not in the pack, so not modelled: new-customer bookings, gross margin, and the cost of the onboarding programme.\n  - Claim: What would change the recommendation\n    - Evidence: SMB test shows little reaction \u2192 extend +8% to H2 SMB renewals (already in the rule).\n    - Evidence: Mid-market renewals react much more than the new-sign-up test suggested \u2192 pause at the tripwire.\n    - Evidence: New-customer bookings fall short of ~$0.6M \u2192 revisit the 12% mid-market option ($0.7M).\n\n**Recommendation:** Raise mid-market and enterprise prices at renewal, hold the SMB list price while we test it, and onboard the promotion cohort: Mid-market +10% list price at renewal from January 2027; Enterprise up to the 7% cap on capped contracts and up to +10% on uncapped renewals; SMB regular hold $15 in H1, split-test +8% on half of renewals in Q1 and apply +8% to H2 renewals if the test passes; SMB promotion cohort no increase in 2027, run an onboarding programme. Total +$4.3M of 2027 ARR from price, with up to +$1.7M of upside. We also recommend not repeating untargeted 50%-off promotions for new self-serve customers.\n\n**Alternatives considered:**\n- CFO's plan: +12% on every plan at renewal from January 2027 ($10.3M headline): Rejected/replaced. The $10.3M assumes all ARR reprices in 2027; realistic figure is $7.6M before churn response and $5.0\u20136.3M after. Worth $0.8\u20132.0M more on paper; both plans clear the NRR objective; the difference is which risk we carry into 2028. It reprices all 5,900 SMB incl. the promo cohort, uses an untested 12% on mid-market renewals, and mixes price with promo exits so churn cannot be read.\n- +12% on all SMB: Not chosen yet. Adds about $1.2M if customers react as in 2023, nothing at 2\u00d7 the reaction, \u2212$1.3M at 3\u00d7; break-even is about twice the 2023 reaction and the win-rate drop makes that plausible but not proven. SMB held and tested at +8% instead.\n- 12% mid-market increase instead of 10%: Rejected: 10% is the tested level; 12% on existing customers is untested. Cost of the caution: $0.7M of 2027 ARR. Revisit if new-customer bookings fall short of ~$0.6M.\n- Price increase for the 2025 promotion cohort: Rejected: the cohort will not absorb a further increase in 2027; price would accelerate churn. Onboarding programme instead.\n- \"Halve SMB churn\" via onboarding (CS claim): Rejected as target: halving 3.1% means 1.55%, below any level since 2023; realistic target is ~2.1% (cohort churns like regular SMB).\n- Repeating untargeted 50%-off promotions for new self-serve customers: Recommended not to repeat.\n- Using the board dashboard churn metric (1.4% \u2192 2.3%): Rejected: undefined and cannot be reconciled; decide on segment logo churn until Finance defines the figure.\n\n**Assumptions and uncertainties:**\n- Prepared from the internal briefing pack only; no outside research. All company figures are synthetic benchmark data.\n- Promotion-cohort churn (4.9%) is implied, not reported, from blended and regular SMB rates weighted by mid-2026 counts.\n- 2027 enterprise renewals assumed 60% capped, the same share as the whole enterprise book; 85% of mid-market ARR renews in 2027 (per the pack).\n- SMB churn response uses the 2023 precedent scaled linearly to 12%; mid-market and enterprise reactions are not modelled.\n- 2023 precedent was before Inkwell existed; break-even at about twice the 2023 reaction is plausible but not proven given the win-rate drop.\n- The +10% mid-market test covered new sign-ups; renewing customers may react differently.\n- Mid-market churn is up 0.2 pts, and accounts of 200 seats or fewer may meet Inkwell.\n- Enterprise uncapped renewals at up to +10%, matching mid-market; actual terms vary by contract.\n- 2027 NRR before price assumed equal to trailing 12-month NRR; the SMB figure (94%) includes the promotion cliff, so it is probably conservative. If 2027 NRR runs 3 points below trailing, the new-customer ARR needed rises to about $3.2M.\n- Renewals spread evenly through the year, so about half of SMB ARR renews in H2.\n- Onboarding caveat: much of the H1 2026 churn was the cliff when the discount ended; survivors may already churn less, so the gain could be smaller.\n- SMB test can detect a ~0.6-pt reaction but not a smaller one like 2023's (~0.3 pts); assumes most test customers renew within Q1, which needs monthly plans; fewer renewals means a weaker test.\n- Not in the pack, so not modelled: new-customer bookings, gross margin, and the cost of the onboarding programme.\n- The board dashboard churn figure (1.4% \u2192 2.3%) is undefined and cannot be reproduced.\n\n**Next steps:**\n- Approve mid-market +10% and enterprise to-cap increases at renewal from January 2027\n- Hold the SMB list price at $15 for H1 2027 and approve the Q1 split test; use the decision rule to set H2 SMB pricing in April\n- Fund an onboarding programme for the 2025 promotion cohort, with a realistic target (cohort churn converging on ~2.1% by mid-2027)\n- Confirm the 2027 new-customer ARR plan covers at least $0.6M, ideally about $3M\n- Ask Finance to redefine the board churn metric before the board sees the pricing plan (logo churn by segment, promotion cohort shown separately)\n- Dec 2026: Decision; define churn metric\n- Jan 2027: Mid-market and enterprise renewals at new prices; SMB test and onboarding start\n- Mar 2027: Q1 read-outs: mid-market tripwire, SMB test\n- Apr 2027: Decide H2 SMB pricing\n- Jul 2027: Promotion-cohort review\n- Monitor tripwires: mid-market renewed-customer churn above 1.2%; SMB test vs control gap of 0.6 pts or more; promo cohort not converging on ~2.1%; SMB win rate vs Inkwell below 38% (quarterly)\n\n## Part 2 \u00b7 Full slide text (mechanical extraction)\n\n=== Slide 1 ===\n[Title] Raise prices in 2027 where we have pricing power, and hold SMB until we have tested it\n- PALISADE DOCS \u00b7 2027 PRICING DECISION\n- Recommendation to the CEO and leadership team for the December 2026 pricing decision\n- Prepared November 2026 from the internal briefing pack only. No outside research was used.\n- All company figures are synthetic benchmark data. ARR figures are $M; churn is monthly logo churn unless stated.\n\n=== Slide 2 ===\n[Title] Yes, raise prices in 2027, but only for mid-market and enterprise. Hold SMB, test it, and fix the promotion cohort with onboarding, not price\n- EXECUTIVE SUMMARY\n- WHAT THE EVIDENCE SAYS\n- WHAT WE RECOMMEND\n- Churn is rising in one place. About 90% of the SMB rise (2.0% \u2192 3.1% a month) comes from the 2,100 customers who joined on the 2025 half-price promotion. Other SMB customers moved from 2.0% to 2.1%.\n- The promotion cohort is an onboarding problem. Only 41% got started properly (72% for other cohorts), and most leavers went within two months of the discount ending.\n- Mid-market and enterprise can take an increase. Their NRR is 112% and 118%, a +10% list test had no significant effect on conversion, and Inkwell is absent above 200 seats.\n- SMB is the open question. Inkwell sells at $9 against our $15. A 12% SMB increase adds about $1.2M if customers react as they did in 2023, and nothing if they react twice as strongly.\n- The CFO's $10.3M is $7.6M before any churn response, because only part of the ARR renews in 2027 and enterprise increases are capped.\n- Mid-market: +10% list price at renewal (the tested level).\n- Enterprise: up to the 7% cap where contracts cap increases; up to +10% elsewhere.\n- SMB: hold $15 in H1 and split-test +8% in Q1. Extend it to H2 renewals only if churn holds.\n- Promotion cohort: no increase. Run an onboarding programme aimed at returning it to normal SMB churn.\n- $4.3M\n- ~114%\n- +14.2%\n- ARR from price,\n- plus up to $0.7M if the SMB test passes\n- overall NRR\n- (target above 100%)\n- growth from existing customers. About $0.6M of new-customer ARR reaches 15%\n- Trade-off: on paper this is $0.8\u20132.0M less 2027 ARR than the CFO's plan. In return, we avoid betting the 5,900-customer SMB base on a reaction we have not measured.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 3 ===\n[Title] Churn is rising almost entirely in SMB, and within SMB almost entirely among customers who joined on the 2025 promotion\n- DIAGNOSIS \u00b7 WHERE CHURN IS RISING\n- Monthly logo churn by group, %, H1 2025 vs H1 2026\n- What this means\n- H1 2025\n- H1 2026\n- If the promotion cohort churned like other SMB customers, SMB churn would be 2.1%, not 3.1%. About 1.0 of the 1.1-point rise is the cohort.\n- Regular SMB customers have barely moved (2.0% \u2192 2.1%), even after Inkwell's launch in October 2025.\n- Mid-market is up from a low base (0.6% \u2192 0.8%). Watch it, but it is not the driver. Enterprise is flat.\n- The board dashboard's \"1.4% \u2192 2.3%\" does not define its measure and cannot be reconciled with these figures (appendix). Decide on segment logo churn.\n- Enterprise\n- 150 customers\n- 0.2\n- 0.2\n- Mid-market\n- 0.6\n- 1,350 customers\n- 0.8\n- SMB: regular customers\n- 2.0\n- 3,800 customers\n- 2.1\n- SMB: 2025 promotion cohort\n- not yet a full cohort\n- 2,100 customers, joined Feb\u2013Aug 2025\n- 4.9*\n- SMB total\n- 2.0\n- 5,900 customers\n- 3.1\n- * Implied, not reported: (5,900 \u00d7 3.1% \u2212 3,800 \u00d7 2.1%) \u00f7 2,100 \u2248 4.9%, using mid-2026 customer counts as weights.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 4 ===\n[Title] The rise in price complaints comes from customers who left when their discount ended. Regular SMB customers cite price no more than in 2025\n- DIAGNOSIS \u00b7 WHY THEY LEAVE\n- Exit-survey churners whose main reason was \"price / found a cheaper option\", %\n- The cohort never got going\n- All SMB churners, H1 2025\n- 19%\n- 41%\n- of promotion-cohort customers sent five or more documents in their first month\n- All SMB churners, H1 2026\n- 34%\n- 72%\n- of customers in other cohorts did the same\n- Promotion-cohort churners, H1 2026\n- 52%\n- Regular SMB churners, H1 2026\n- 18%\n- ~3\u00d7\n- higher churn for SMB customers who send fewer than five documents in month one\n- The blended rise (19% \u2192 34%) is a mix effect. The promotion cohort's share of churners grew, and 52% of those churners cite price. Regular SMB churners are flat at 18%.\n- Most cohort leavers went within two months of the 50% discount ending. For them, the \"price\" answer is the jump back to full price, not our list level.\n- So what: the CFO is right that this is mostly an onboarding problem. It also means this cohort will not absorb a further increase in 2027.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 5 ===\n[Title] SMB is now exposed on price. A 12% increase pays off only if customers react less than twice as strongly as they did in 2023, and we cannot yet tell\n- OPTIONS \u00b7 SMB\n- List price per user per month, $\n- Net 2027 ARR effect of +12% on all SMB, by strength of churn reaction, $M\n- Inkwell Starter\n- $9  launched Oct 2025\n- +$2.5M\n- Palisade SMB\n- $15  today\n- +$1.2M\n- Palisade SMB +12%\n- $16.80  CFO proposal\n- Inkwell Pro\n- $24\n- \u2248 $0.0M\n- Palisade Business\n- $29\n- Win rate vs Inkwell in SMB: 51% \u2192 38% (H1 2025 \u2192 H1 2026).\n- 2023 precedent: +8% at renewal lifted SMB churn from 1.8% to 2.3% for six months, then it settled at 1.9%. That was before Inkwell existed.\n- Pointing the other way: regular SMB churners citing price are flat (18% vs 19%).\n- \u2212$1.3M\n- No reaction\n- As in 2023\n- 2\u00d7 the 2023 reaction\n- 3\u00d7 the 2023 reaction\n- Gross gain is 12% \u00d7 $21.0M = $2.5M. The 2023 response, scaled to 12%, means +0.75 pts of churn for six months and +0.15 pts after, losing about 5.4% of SMB customers. Break-even is about twice the 2023 reaction. The win-rate drop makes that plausible but not proven.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 6 ===\n[Title] Mid-market and enterprise show pricing power. A 10% increase breaks even only if mid-market churn roughly doubles\n- OPTIONS \u00b7 MID-MARKET AND ENTERPRISE\n- Retention is strong\n- Price was tested\n- Competition is absent\n- Net revenue retention: 112% mid-market, 118% enterprise\n- Monthly logo churn: 0.8% mid-market, 0.2% enterprise\n- 2024: +10% list price for new mid-market sign-ups\n- Conversion 23.1% vs 23.6% for the control group, not statistically significant\n- Inkwell not seen in mid-market or enterprise deals above 200 seats\n- Customers stay for integrations and audit trail (advisory board, 2026)\n- Mid-market monthly logo churn: where we are vs where +10% stops paying, %\n- Why +10%, not the CFO's 12%\n- 0.6%\n- 0.8%\n- 1.2%\n- ~1.6%\n- 10% is the level we tested. 12% on existing customers is untested.\n- The test covered new sign-ups. Renewing customers may react differently, so watch Q1 renewals.\n- Mid-market churn is up 0.2 pts, and accounts of 200 seats or fewer may meet Inkwell.\n- Cost of the caution: $0.7M of 2027 ARR.\n- H1 2025\n- H1 2026\n- Proposed tripwire\n- Break-even\n- 0.0\n- 0.5\n- 1.0\n- 1.5\n- 2.0\n- Break-even: +10% on renewing ARR is lost if an extra 9.1% of renewing customers leave within the year (0.10 \u00f7 1.10). That is about +0.8 pts a month on top of today's 0.8%.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 7 ===\n[Title] The CFO's $10.3M assumes all ARR reprices in 2027. The realistic figure is $7.6M before any churn response, and $5.0\u20136.3M after it\n- OPTIONS \u00b7 THE CFO'S PLAN\n- ARR added by +12% on every plan at renewal from January 2027, $M\n- $10.3M\n- \u22120.7\n- \u22121.7\n- \u22120.3\n- $7.6M\n- \u22121.3\n- $6.3M\n- \u22121.3\n- $5.0M\n- CFO headline\n- 12% \u00d7 $86.0M\n- Mid-market ARR\n- not renewing in 2027\n- (15%)\n- Enterprise ARR\n- not renewing in 2027\n- (60%)\n- Enterprise caps:\n- 7% max on 60%\n- of contracts\n- Before churn\n- response\n- SMB churn response\n- as in 2023\n- Realistic,\n- 2023-like\n- reaction\n- Extra loss if\n- reaction is 2\u00d7\n- Realistic,\n- 2\u00d7 reaction\n- Assumes 2027 enterprise renewals carry the same 60% capped share as the whole enterprise book, and 85% of mid-market ARR renews in 2027 (per the pack). The SMB response uses the 2023 precedent scaled to 12%. Mid-market and enterprise reactions are not modelled.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 8 ===\n[Title] Recommended plan: raise mid-market and enterprise prices at renewal, hold the SMB list price while we test it, and onboard the promotion cohort\n- RECOMMENDATION \u00b7 THE 2027 PLAN\n- SEGMENT\n- 2027 ACTION\n- 2027 ARR EFFECT\n- WHY\n- Mid-market\n- +10% list price at renewal from January. 85% of mid-market ARR ($34.9M) renews in 2027.\n- +$3.5M\n- NRR 112%. The +10% test showed no significant effect. Break-even needs churn to roughly double.\n- 1,350 customers \u00b7 $41.0M\n- Enterprise\n- Up to the 7% cap on capped contracts; up to +10% on uncapped renewals, under each contract's terms. 40% renews in 2027.\n- +$0.8M\n- NRR 118%, churn 0.2%. Customers stay for integrations and audit trail.\n- 150 customers \u00b7 $24.0M\n- SMB: regular\n- Hold $15 in H1. In Q1, split-test +8% on half of renewals. If the test passes, apply +8% to H2 renewals.\n- $0 in plan;\n- up to +$0.7M\n- Inkwell at $9; win rate down to 38%. Whether customers react like 2023 or twice as strongly decides whether 12% pays.\n- 3,800 customers \u00b7 $16.6M\n- SMB: promo cohort\n- No increase in 2027. Run an onboarding programme for customers sending fewer than five documents a month.\n- Up to ~$1.0M\n- retained (upside)\n- 41% got started properly. Leavers went when the discount ended. Price would accelerate it.\n- 2,100 customers \u00b7 $4.4M\n- Total: +$4.3M of 2027 ARR from price in the plan, with up to +$1.7M of upside if the SMB test passes and onboarding works. We also recommend not repeating untargeted 50%-off promotions for new self-serve customers.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 9 ===\n[Title] The plan keeps NRR near 114% and grows ARR 14.2% from existing customers. About $0.6M of new-customer ARR closes the gap to the 15% target\n- RECOMMENDATION \u00b7 AGAINST THE OBJECTIVES\n- 2027 ARR bridge under the recommended plan, $M\n- Recommended plan vs CFO plan\n- RECOMMENDED\n- CFO: +12% ALL\n- +0.8\n- 98.3\n- +0.6\n- 98.9\n- ARR from price\n- $4.3M\n- (+$0.7M option)\n- $5.0\u20136.3M\n- (after SMB response)\n- +3.5\n- +8.0\n- End-2027 ARR, existing customers\n- $98.3M\n- $99.0\u2013100.3M\n- Overall NRR\n- ~114%\n- ~115\u2013117%\n- 86.0\n- SMB customers repriced\n- None until tested\n- All 5,900, incl. the promo cohort\n- Mid-market increase\n- 10%: tested level\n- 12%: untested on renewals\n- Can we read churn in 2027?\n- Yes: clean test and control\n- No: price mixed with promo exits\n- Start of\n- 2027\n- Existing customers\n- at trailing NRR\n- Mid-market\n- +10%\n- Enterprise\n- to cap / +10%\n- Existing\n- customers,\n- end 2027\n- New-customer\n- ARR needed\n- 15% target\n- The CFO's plan is worth $0.8\u20132.0M more on paper. Both plans clear the NRR objective. The difference is which risk we carry into 2028.\n- Axis starts at $80M. Trailing NRR: SMB 94%, mid-market 112%, enterprise 118%. If 2027 NRR runs 3 points below trailing, the new-customer ARR needed rises to about $3.2M.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 10 ===\n[Title] Onboarding can bring SMB churn back to about 2.1%, not halve it. Plan around the promotion cohort, not the headline claim\n- RECOMMENDATION \u00b7 ONBOARDING\n- SMB monthly logo churn, %\n- What onboarding is worth\n- 2023, before +8%\n- 1.8%\n- The cohort is $4.4M of ARR. At ~4.9% a month it loses about 45% of that over 12 months; at 2.1%, about 22%.\n- Closing that gap retains up to ~$1.0M of ARR. That is a real prize, but not a substitute for price.\n- Caveat: much of the H1 2026 churn was the cliff when the discount ended. The survivors may already churn less, so the gain could be smaller.\n- Target: cohort churn converging on the regular SMB rate (~2.1%) by mid-2027, tracked monthly.\n- 2023, settled after +8%\n- 1.9%\n- H1 2025\n- 2.0%\n- H1 2026\n- 3.1%\n- SCENARIOS FOR 2027\n- Cohort fixed: churns like regular SMB\n- 2.1%  realistic target\n- \"Halve SMB churn\" (CS claim)\n- 1.55%  below any level since 2023\n- Halving 3.1% means 1.55%. That would need regular SMB customers to fall well below the 1.8\u20132.0% range SMB has run at since 2023, not just to fix the promotion cohort.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 11 ===\n[Title] Agreed tripwires let us stop or extend each 2027 increase on evidence, not opinion\n- RECOMMENDATION \u00b7 GUARDRAILS\n- WHAT WE WATCH\n- TRIPWIRE\n- ACTION\n- READ-OUT\n- Mid-market renewals at +10%\n- Monthly churn of customers who renewed at the new price goes above 1.2% (0.8% today; break-even ~1.6%)\n- Pause further increases. Review accounts of 200 seats or fewer first, since that is where Inkwell can compete\n- Monthly from February; decision end of March\n- SMB split test (+8%)\n- Test group's churn exceeds control by 0.6 pts a month or more. That reaction would wipe out the gain\n- Below the line: +8% on H2 SMB renewals (up to +$0.7M). Above it: hold SMB through 2027\n- End of Q1; H2 decision in April\n- Promotion cohort\n- Churn not converging on ~2.1% by mid-2027 despite the onboarding programme\n- Stop extra onboarding spend and plan for the remaining cohort to churn\n- Monthly; review in July\n- SMB win rate vs Inkwell\n- Falls below 38% (H1 2026 level)\n- Revisit SMB packaging against Inkwell before any SMB increase\n- Quarterly\n- Board churn metric\n- Undefined today: \"1.4% \u2192 2.3%\" does not reconcile\n- Report logo churn by segment, with the promotion cohort shown separately\n- Before the December decision\n- The SMB test should cover about half of regular SMB renewals. That is enough to detect a reaction large enough to cancel the gain (~0.6 pts a month), not a smaller one like 2023's (~0.3 pts). See appendix.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 12 ===\n[Title] Five decisions for the leadership team in December\n- DECISIONS FOR DECEMBER\n\n- Approve mid-market +10% and enterprise to-cap increases at renewal from January 2027\n- TIMELINE\n- Replaces the CFO's 12% on every plan. Worth +$4.3M of 2027 ARR.\n- Dec 2026\n\n- Hold the SMB list price at $15 for H1 2027 and approve the Q1 split test\n- Decision; define churn metric\n- Jan 2027\n- Use the decision rule on the previous page to set H2 SMB pricing in April.\n- Mid-market and enterprise renewals at new prices; SMB test and onboarding start\n\n- Fund an onboarding programme for the 2025 promotion cohort, with a realistic target\n- Mar 2027\n- Target: cohort churn converging on ~2.1% by mid-2027, not \"halve SMB churn\".\n- Q1 read-outs: mid-market tripwire, SMB test\n\n- Confirm the 2027 new-customer ARR plan covers at least $0.6M, ideally about $3M\n- The pack has no new-business figures. This is the one input the 15% target still depends on.\n- Apr 2027\n- Decide H2 SMB pricing\n- Jul 2027\n\n- Ask Finance to redefine the board churn metric before the board sees the pricing plan\n- Promotion-cohort review\n- Logo churn by segment, with the promotion cohort shown separately.\n\n=== Slide 13 ===\n[Title] How the main figures were calculated\n- APPENDIX A \u00b7 CALCULATIONS\n- CFO headline\n- 12% \u00d7 $86.0M = $10.3M. This assumes every dollar of ARR reprices in 2027 at the full 12%.\n- CFO before churn response\n- SMB 12% \u00d7 $21.0M = $2.52M; mid-market 12% \u00d7 85% \u00d7 $41.0M = $4.18M; enterprise renewing $9.6M (40% of $24.0M): 60% capped at 7% = $0.40M, plus 40% at 12% = $0.46M. Total $7.57M.\n- SMB churn response\n- 2023: +8% gave +0.5 pts for six months, then +0.1 pts. Scaled linearly to 12%: +0.75 pts \u00d7 6 months + 0.15 pts \u00d7 6 months = 5.4% of customers lost, \u00d7 $23.5M repriced ARR = $1.27M (\u00d72 = $2.54M).\n- Recommended price ARR\n- Mid-market 10% \u00d7 $34.85M = $3.49M. Enterprise: $5.76M capped at 7% = $0.40M, plus $3.84M at 10% = $0.38M. Total $4.27M.\n- SMB H2 option\n- +8% on roughly half of regular SMB ARR (renewing in H2): 8% \u00d7 50% \u00d7 $16.6M \u2248 $0.66M. Regular SMB ARR = $21.0M \u2212 $4.4M cohort.\n- Existing-customer bridge\n- $21.0M \u00d7 94% + $41.0M \u00d7 112% + $24.0M \u00d7 118% = $93.98M (+$7.98M), plus price $4.27M = $98.25M (+14.2%). 15% target = $98.9M, so the gap is $0.65M.\n- Break-evens\n- Gain p is cancelled when the share of customers lost in the year reaches p \u00f7 (1 + p). Mid-market at 10%: 9.1% a year \u2248 +0.8 pts a month. SMB at 8%: 7.4% \u2248 +0.6 pts. SMB at 12%: 10.7%, about twice the 2023 response.\n- Promotion-cohort value\n- 12-month retention at 4.9% a month = 55%; at 2.1% = 78%. Difference \u00d7 $4.4M \u2248 $1.0M.\n- SMB test size\n- About 1,900 customers per arm for three months at a 2.1% base rate gives a standard error of about 0.27 pts on the difference. A 0.6-pt reaction is about 2.2 standard errors (detectable); a 0.3-pt reaction is about 1.1 (not). This assumes most test customers renew within Q1, which needs monthly plans; fewer renewals means a weaker test.\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n\n=== Slide 14 ===\n[Title] The board churn figure cannot be reproduced. This page also lists the choices made where the briefing pack was silent\n- APPENDIX B \u00b7 DATA CAVEATS AND CHOICES\n- Board dashboard \"monthly churn 1.4% \u2192 2.3%\" vs Table 1\n- Choices made where the pack was silent\n- Measure\n- H1 2025\n- H1 2026\n- Mid-market increase set at 10%, the tested level, rather than 12%.\n- SMB test at +8%, the 2023 level, so the 2023 response is a usable benchmark.\n- Enterprise uncapped renewals at up to +10%, matching mid-market. Actual terms vary by contract.\n- 2027 enterprise renewals assumed 60% capped, the same share as the whole enterprise book.\n- 2027 NRR before price assumed equal to trailing 12-month NRR. The SMB figure (94%) includes the promotion cliff, so it is probably conservative.\n- Renewals spread evenly through the year, so about half of SMB ARR renews in H2.\n- Promotion-cohort churn (4.9%) is implied from blended and regular SMB rates, weighted by mid-2026 counts.\n- Not in the pack, so not modelled: new-customer bookings, gross margin, and the cost of the onboarding programme.\n- Board dashboard (undefined)\n- 1.4%\n- 2.3%\n- Customer-weighted logo churn\n- 1.7%\n- 2.6%\n- ARR-weighted logo churn\n- 0.8%\n- 1.2%\n- SMB logo churn\n- 2.0%\n- 3.1%\n- Weighted with mid-2026 customer counts and ARR from Table 1. None of the obvious definitions gives 1.4% \u2192 2.3%. Until Finance defines the figure, it should not be used for this decision.\n- What would change the recommendation\n- SMB test shows little reaction \u2192 extend +8% to H2 SMB renewals (already in the rule).\n- Mid-market renewals react much more than the new-sign-up test suggested \u2192 pause at the tripwire.\n- New-customer bookings fall short of ~$0.6M \u2192 revisit the 12% mid-market option ($0.7M).\n- Source: Palisade briefing pack (2026), synthetic benchmark data.\n"}], "packets": {"c1-market-entry": "# Onsoo Botanicals: US market entry \u2014 briefing pack\n\n> **Synthetic benchmark data.** The company, people, competitors and every figure in this pack are fictional. They were generated for a reasoning benchmark and are internally consistent, but they are not real market data.\n\n## 1. Context\n\nOnsoo Botanicals is a Seoul-based skincare company founded in 2011. FY2025 revenue was KRW 184.0 billion\n(about $133M at KRW 1,380 per dollar) with an operating margin of 11.2%. Sales split: Korea 58%, Japan 24%,\nSoutheast Asia 18%. The best-selling product is the Rice Ferment Barrier Cream (50 ml), 31% of revenue.\nOnsoo has no US entity today; since January 2026 a cross-border seller has listed three Onsoo SKUs on\nAmazon US as a test.\n\n**Decision maker:** CEO Park Ji-won, with the board, at the March 2027 board meeting.\n\n## 2. Decision question\n\n**Should Onsoo enter the US market in 2027, and if so, by which route?**\n\n## 3. Objectives and constraints (set by the board)\n\n- **Ambition:** build a US business \"on the way to $40M revenue by 2030\".\n- **Investment cap:** cumulative US cash outflow (peak negative cumulative cash) of no more than $18M through 2030.\n- **Payback:** cumulative US cash flow back to zero within four years of launch, i.e. by the end of 2030.\n- **Group margin floor:** group operating margin at or above 8% in every year.\n- **Bandwidth:** management can run only one major new-market launch in 2027 (the US, or a Japan scale-up).\n\n## 4. Current views inside the company\n\n- **CEO (initial hypothesis):** \"Launch in the US in 2027 through Amazon, then add specialty beauty retail\n  from 2029 once Amazon sales pass $10M and aided awareness passes 15%.\"\n- **Independent board member (former retail executive):** \"Amazon alone will never get us to $40M. A national\n  specialty-retail launch in 600 doors in 2027 is how every big K-beauty brand built awareness.\"\n- **Head of Japan:** \"Japan is the safer use of 2027: we know the market and the retailers.\"\n\nThe planning team has modeled the Amazon-led route (Option A), the retail-led route (Option B) and a Japan\nscale-up (Option J). Their inputs are below; they did not draw a conclusion.\n\n## 5. Market data\n\n**Table 1. US facial skincare sales, $ billions**\n\n|  | 2021 | 2022 | 2023 | 2024 | 2025 |\n|---|---|---|---|---|---|\n| All facial skincare | 20.1 | 21.3 | 22.6 | 23.5 | 24.5 |\n| of which K-beauty brands | 1.9 | 2.3 | 2.7 | 3.1 | 3.6 |\n\n**Table 2. Where US consumers bought K-beauty skincare, 2025, share of sales**\n\n| Channel | Share |\n|---|---|\n| Amazon | 41% |\n| Specialty beauty retail | 27% |\n| Mass retail | 14% |\n| Brand websites (DTC) | 12% |\n| Other | 6% |\n\n## 6. Amazon pilot (January\u2013June 2026, three SKUs, cross-border seller)\n\n**Table 3. Pilot units sold per month**\n\n| Jan | Feb | Mar | Apr | May | Jun | Total |\n|---|---|---|---|---|---|---|\n| 7,400 | 8,600 | 10,100 | 11,800 | 12,900 | 14,000 | 64,800 |\n\n- Average selling price: $24.00 per unit. Advertising cost of sales (ACoS, Amazon ad spend as a share of\n  Amazon sales) over the pilot: 28%.\n- Ratings: 4.5 stars from 2,140 reviews. The most common complaint (6% of reviews): some units carried\n  Korean-only label text.\n- 90-day repeat purchase rate: 29% of first-time buyers. Benchmarks: 31% for skincare brands in their first\n  year on Amazon US (agency data); 48% for Onsoo in Korea.\n\n## 7. Unit economics inputs (Rice Ferment Barrier Cream, per unit)\n\n**Table 4. Per-unit inputs by channel, US dollars**\n\n| Item | Amazon | Specialty retail |\n|---|---|---|\n| Consumer price | $24.00 | $28.00 (shelf) |\n| Price Onsoo receives | $24.00 | $14.00 (wholesale = 50% of shelf price) |\n| Amazon referral fee | 15% of price | \u2014 |\n| Amazon fulfillment (FBA) fee | $5.10 | \u2014 |\n| Ex-factory product cost | $3.50 | $3.50 |\n| Freight to the US warehouse or retailer DC | $0.55 | $0.75 |\n| US import duty | 15% of ex-factory cost | 15% of ex-factory cost |\n| Retailer co-op marketing allowance | \u2014 | 8% of wholesale |\n| Returns and damages allowance | \u2014 | 4% of wholesale |\n| Advertising | ACoS \u00d7 price | in fixed marketing budget |\n\nThe planning team applies the hero product's per-unit economics to all SKUs. Working capital: the planning team holds four months of landed product cost (ex-factory + freight + duty) as inventory.\n\n## 8. Planning-team forecasts by option\n\n**Table 5. Volume forecasts, units**\n\n| Option | 2027 | 2028 | 2029 | 2030 | Key assumptions |\n|---|---|---|---|---|---|\n| A \u00b7 Amazon-led: Amazon units | 300,000 | 560,000 | 850,000 | 1,100,000 | Four more SKUs from 2027; ACoS 25% (planning team: ACoS falls as the brand matures) |\n| B \u00b7 Retail-led: specialty-retail doors | 600 | 600 | 800 | 1,000 | 4.5 units per door per week (from the retailer's deck on successful newcomer brands) |\n| B \u00b7 Retail-led: Amazon units | 390,000 | 728,000 | 1,105,000 | 1,430,000 | Option A volumes \u00d7 1.3 (awareness halo from retail); ACoS 25% |\n\n**Table 6. Fixed and one-time US costs, $ millions**\n\n| Cost | Option A | Option B |\n|---|---|---|\n| Compliance (MoCRA registration, safety substantiation, labeling), insurance \u2014 per year | 0.5 | 0.5 |\n| US team \u2014 per year | 0.9 | 0.9 |\n| Off-Amazon brand marketing (influencers, social) \u2014 per year | 0.7 | 0.7 |\n| National retail marketing and sampling \u2014 per year | \u2014 | 6.0 |\n| Field sales and merchandising team \u2014 per year | \u2014 | 1.5 |\n| Setup: entity, registration, labels \u2014 one-time, 2027 | 0.8 | 0.8 |\n| Retailer launch fee \u2014 one-time, 2027 | \u2014 | 0.5 |\n| In-store fixtures \u2014 one-time per new door | \u2014 | $1,100 per door |\n\n**Table 7. Option J \u00b7 Japan scale-up instead of the US in 2027**\n\n|  | 2027 | 2028 | 2029 | 2030 |\n|---|---|---|---|---|\n| Incremental revenue, $M | 2.5 | 4.5 | 6.0 | 7.0 |\n| Contribution margin on that revenue | 30% | 30% | 30% | 30% |\n| Added fixed cost, $M per year | 0.8 | 0.8 | 0.8 | 0.8 |\n| One-time cost, $M | 1.0 | \u2014 | \u2014 | \u2014 |\n\nJapan facial skincare grows about 1.5% a year; Onsoo already holds a 3.1% share there.\n\n**Group context.** Excluding the US, the group plans revenue of $140M (2027), $146M (2028), $152M (2029) and\n$158M (2030) at an operating margin of 11.0%.\n\n## 9. Retail evidence\n\n**Table 8. First-year sell-through of newcomer skincare brands in US specialty beauty retail**\n\n| Brand's aided awareness among category buyers | Median units per door per week | Interquartile range |\n|---|---|---|\n| Below 10% | 2.6 | 1.9\u20133.4 |\n| 10\u201320% | 3.5 | 2.8\u20134.3 |\n| Above 20% | 4.6 | 3.9\u20135.5 |\n\nSource: a retail analytics firm, 2025, 46 brands. The leading specialty retailer reviews newcomer brands after\n12 months and removes brands selling below 4.0 units per door per week.\n\n## 10. Customer evidence\n\nSurvey, September 2026, 1,200 US women aged 18\u201344 who bought facial skincare in the last six months:\n\n- Aided awareness of Onsoo: 4% of all respondents; 9% among K-beauty buyers.\n- 61% of K-beauty buyers say they buy K-beauty on Amazon most often; 22% at specialty beauty retail.\n- 38% of K-beauty buyers discovered their last new brand on TikTok; 17% in a store.\n- 52% of respondents who tried a K-beauty product said \"price compared with US brands\" was a reason.\n\n## 11. Competitor evidence\n\n**Table 9. K-beauty brands that entered the US recently (public reporting and interviews)**\n\n| Brand | Entry route | Outcome by 2025 |\n|---|---|---|\n| Mooncrest | Retail-first 2023, 450 doors | Removed from shelves in 2025; estimated cumulative US loss $21M |\n| Saebom | Amazon-first 2022 | About $30M US revenue in 2025; added 300 retail doors in 2025 |\n| Gaon Lab | Amazon-first 2022 | Below $5M US revenue in 2025 |\n| Yeoreum | Amazon-first 2023 | Below $5M US revenue in 2025 |\n\nAgency benchmark: for skincare brands scaling from $5M to $20M a year on Amazon US, median ACoS is 32%\n(range 26%\u201338%); ad costs per click rise as brands bid on broader keywords.\n\n## 12. Other material circulated to the board\n\n- A trade-press article (2026) reports that \"the US K-beauty market reached $5.2 billion in 2025\". The article's\n  figure covers skincare, makeup and hair care sold by Korean brands.\n- The independent board member's memo: \"Across 30 K-beauty brands sold in the US, the number of specialty-retail\n  doors a brand is in correlates with its Amazon sales (correlation 0.71). Retail drives Amazon sales; that is where\n  the 1.3\u00d7 halo in Option B comes from.\"\n\n## 13. Uncertainties\n\n- **Tariff:** the US is reviewing the duty on cosmetics imported from Korea; a rise from 15% to 25% is possible,\n  with a decision expected in mid-2027.\n- **Advertising cost at scale:** the pilot ran at 28% ACoS on a small budget.\n- **Repeat purchase:** US repeat is below Korea's; it is unclear whether it rises with more SKUs.\n- **FX:** product costs are in won; a weaker won lowers dollar costs.\n", "c4-pricing-churn": "# Palisade Docs: raise prices while churn is rising? \u2014 briefing pack\n\n> **Synthetic benchmark data.** The company, people, competitors and every figure in this pack are fictional. They were generated for a reasoning benchmark and are internally consistent, but they are not real market data.\n\n## 1. Context\n\nPalisade Docs sells document-workflow and e-signature software. ARR is $86.0M from 7,400\ncustomers in three segments. Monthly customer churn has risen over the past year, and the CFO wants a price increase.\n\n**Decision maker:** CEO Ravi Menon, deciding on the 2027 pricing plan with the leadership team in December 2026.\n\n## 2. Decision question\n\n**Should Palisade raise prices in 2027 while customer churn is rising, and if so, how?**\n\n## 3. Objectives and constraints\n\n- Grow ARR at least 15% in 2027 (from $86.0M).\n- Keep net revenue retention above 100% overall.\n- Price changes apply at renewal; enterprise contracts follow their own terms.\n\n## 4. Current views inside the company\n\n- **CFO:** \"Raise list prices 12% on every plan at renewal from January 2027. That is $10.3M of ARR. Churn is an\n  onboarding problem, not a price problem.\"\n- **CEO's concern:** \"Churn is going up. A price rise now could push it higher.\"\n- **Head of Customer Success:** \"The 2025 promotion brought in customers who never set the product up.\"\n\n## 5. Segments\n\n**Table 1. Segments, mid-2026**\n\n| Segment | Customers | ARR, $M | Monthly logo churn H1 2025 | Monthly logo churn H1 2026 | Net revenue retention (trailing 12 months) |\n|---|---|---|---|---|---|\n| SMB | 5,900 | 21.0 | 2.0% | 3.1% | 94% |\n| Mid-market | 1,350 | 41.0 | 0.6% | 0.8% | 112% |\n| Enterprise | 150 | 24.0 | 0.2% | 0.2% | 118% |\n\nSMB = 1\u201350 employees, self-serve, monthly or annual plans. Mid-market = 51\u20131,000 employees, annual contracts.\nEnterprise = over 1,000 employees, mostly multi-year contracts.\n\n## 6. The 2025 SMB promotion\n\n- From February to August 2025, new self-serve SMB customers got 50% off for their first six months. The\n  promotion brought in 2,100 SMB customers who are still counted in the base above (about $4.4M of ARR at full price).\n- Share of new customers who sent at least five documents in their first month: 41% for the promotion cohort,\n  72% for other cohorts.\n- Monthly churn in H1 2026 for SMB customers who did **not** come through the promotion: 2.1% (H1 2025 for the\n  same kind of customers: 2.0%).\n\n**Table 2. Main churn reason \"price / found a cheaper option\", share of churned customers who answered the exit survey**\n\n| Group | Share citing price |\n|---|---|\n| all SMB churners H1 2025 | 19% |\n| all SMB churners H1 2026 | 34% |\n| promo-cohort churners H1 2026 | 52% |\n| non-promo SMB churners H1 2026 | 18% |\n\nMost promotion-cohort customers who left did so within two months of the discount ending.\n\n## 7. Competitor\n\n- **Inkwell** launched a Starter plan at $9 per user per month in October 2025. Palisade's SMB plan is $15 per\n  user per month; Business plan $29; Inkwell Pro $24.\n- Palisade's win rate in SMB deals where Inkwell was considered fell from 51% (H1 2025) to 38% (H1 2026).\n  Inkwell has not been seen in mid-market or enterprise deals with more than 200 seats.\n\n## 8. Pricing history and tests\n\n- **2023 SMB price increase:** +8% at renewal. SMB monthly churn rose from 1.8% to 2.3% for six months, then\n  settled at 1.9%.\n- **2024 mid-market test:** +10% list price for new mid-market sign-ups for three months: conversion 23.1%\n  against 23.6% for the control group (difference not statistically significant).\n- **Enterprise:** 60% of enterprise ARR is under contracts that cap annual price increases at 7%. 40% of\n  enterprise ARR renews in 2027, as does 85% of mid-market ARR and all SMB ARR.\n\n## 9. Product and customer evidence\n\n- Mid-market and enterprise customers rate Palisade's integrations and audit trail as the main reasons they stay\n  (customer advisory board, 2026).\n- SMB customers who send fewer than five documents in their first month churn at about three times the rate of\n  those who send more.\n\n## 10. Other material\n\n- **Board dashboard (Q2 2026):** \"Monthly churn: 1.4% \u2192 2.3%.\" The dashboard does not define the measure.\n- **Head of Customer Success:** \"An onboarding programme will halve SMB churn within two quarters.\"\n\n## 11. Uncertainties\n\n- How price-sensitive non-promotion SMB customers are now that Inkwell exists.\n- Whether the promotion cohort can be activated, or will mostly churn regardless.\n- Whether the mid-market test (new sign-ups) predicts how existing customers react at renewal.\n"}, "keys": {"c1-market-entry": "# Answer key \u00b7 Onsoo Botanicals \u2014 US market entry\n\n> **Evaluators only.** Never copy this file into a generation workspace.\n\n**Decision question:** Should Onsoo enter the US market in 2027, and if so, by which route?\n\n## Initial hypothesis in the pack\n\n- Holder: CEO\n- Statement: Enter the US in 2027 through an Amazon-led launch; add specialty retail from 2029 once proven.\n- Expected handling: **keep_with_conditions**\n- Why: The evidence supports the CEO's route over the retail-led route, which breaks the investment cap and the group-margin floor. But Option A meets the four-year payback only if ACoS stays below about 28.6% \u2014 barely above the pilot's 28% and below the 32% scaling benchmark \u2014 and it reaches about $26M, not $40M, by 2030. A good answer keeps the hypothesis but adds gates and resets the $40M ambition; abandoning the US altogether is defensible only if argued from the payback risk, and adopting the retail-led route is not defensible.\n\n## Key analytical insights\n\n- **K1** (critical): Amazon unit contribution before advertising is $10.72 (44.7% of price); after ads at the pilot's 28% ACoS it is $4.00 per unit. Retail contribution is $7.54 per unit before the large fixed retail costs.\n- **K2** (critical): Option B (retail-led) needs peak cumulative investment of about $20.8M even on the planning team's own 4.5 units/door/week (about $25.5M at the 2.6 newcomer median), above the $18M cap, never pays back by 2030, and pushes group operating margin to about 4.5% in 2027, below the 8% floor.\n- **K3** (critical): The 4.5 units/door/week assumption is the 'above 20% awareness' benchmark; Onsoo's awareness is 4% (9% among K-beauty buyers), where the median is 2.6 \u2014 below the retailer's 4.0 delisting threshold. Mooncrest's exit illustrates the risk.\n- **K4** (critical): Option A at the planning ACoS of 25% pays back in 2030 (cumulative $2.40M); at the pilot's 28% it only just pays back ($0.38M); at the 32% scaling benchmark it does not ($-2.32M). Break-even ACoS for payback by 2030 is about 28.6%. A tariff rise to 25% alone turns the pilot case negative ($-0.74M).\n- **K5** (critical): No option meets both the $40M ambition and the constraints: A reaches about $26.4M of 2030 revenue; B reaches about $37.6M but breaks the cap. The board has to trade the ambition against the constraints.\n- **K6**: Peak investment for A is small ($2.4M at 28% ACoS; $3.9M in the combined downside), so the downside of trying A is bounded; group margin stays above 9%.\n- **K7**: Option J (Japan) pays back in 2029 with cumulative $1.8M by 2030 and lower risk, but it is a small, slow-growing market (1.5% a year; Onsoo already holds 3.1%). It is a credible alternative for 2027 given the one-launch bandwidth constraint.\n- **K8**: The pilot is not a novelty spike: monthly units nearly doubled (7,400 to 14,000; June run-rate about 168,000 units a year), 4.5 stars, and repeat of 29% is close to the 31% newcomer benchmark \u2014 but below Korea's 48%, so Korean repeat rates should not be assumed.\n- **K9**: The 1.3\u00d7 Amazon halo in Option B rests on a cross-brand correlation (0.71) that does not show retail causes Amazon sales: brands that are already successful win more doors (reverse causality / confounding). Without the halo, Option B is even worse.\n\n## Required calculations\n\n- **Q1**: Amazon per-unit contribution before and after advertising \u2014 expected: $10.72 before ads; $4.00 after ads at 28% ACoS (tolerance: \u00b1$0.10)\n- **Q2**: Retail per-unit contribution \u2014 expected: $7.54 (tolerance: \u00b1$0.10)\n- **Q3**: Option B cumulative cash / peak investment vs the $18M cap \u2014 expected: peak about $20.8M on plan assumptions (tolerance: any estimate clearly above $18M)\n- **Q4**: Option A payback / cumulative cash by 2030, with sensitivity to ACoS (and ideally tariff) \u2014 expected: 25%: $2.40M; 28%: $0.38M; 32%: $-2.32M (tolerance: \u00b1$0.5M; the qualitative pattern (payback only below ~28\u201329% ACoS) matters more than exact values)\n- **Q5**: Group operating margin check for Option B in 2027 \u2014 expected: 4.5% (tolerance: any calculation showing it is below 8%)\n- **Q6**: K-beauty US market growth \u2014 expected: CAGR 2021\u201325 17.3%, against 5.1% for all facial skincare; K-beauty share 14.7% in 2025 (tolerance: \u00b10.5 pp)\n\n## Decision-relevant evidence\n\n- **E1** (critical): Investment cap $18M, payback by end-2030, group margin \u2265 8%, one launch in 2027\n- **E2** (critical): Onsoo aided awareness 4% (9% among K-beauty buyers) vs sell-through benchmarks by awareness band\n- **E3** (critical): Retailer delists below 4.0 units per door per week after 12 months\n- **E4** (critical): Agency ACoS benchmark for scaling brands: median 32% vs planning assumption 25% and pilot 28%\n- **E5**: Possible tariff increase from 15% to 25%\n- **E6**: 61% of K-beauty buyers buy on Amazon most often; 38% discover on TikTok\n- **E7**: Competitor histories (Mooncrest loss; Saebom success but two Amazon-first brands stalled below $5M)\n- **E8**: Label complaint (Korean-only text) \u2014 a compliance and conversion fix before scaling\n- **E9**: Definition of the $5.2B trade-press figure vs Table 1 skincare-only $3.6B\n\n## Common reasoning traps\n\n- **T1**: Sizing from the market (\"K-beauty is $3.6B growing 17%; 1% share is $36M\") instead of from channel economics\n- **T2**: Accepting the 4.5 units/door/week or the 25% ACoS assumptions without checking them against the benchmarks\n- **T3**: Using Saebom as proof that Amazon-first works (ignoring the two stalled brands) or Mooncrest as proof retail never works\n- **T4**: Assuming Korean repeat rates (48%) or treating the pilot growth rate as permanent\n- **T5**: Recommending retail-led to meet the $40M ambition while ignoring that it breaks the cap and the margin floor\n- **T6**: Accepting the board member's correlation as proof that retail drives Amazon sales (the 1.3\u00d7 halo)\n- **T7**: Using the trade-press $5.2B (skincare + makeup + hair care) as the skincare market\n\n## Key trade-offs\n\n- **X1**: Ambition ($40M by 2030) vs investment cap, payback and margin floor\n- **X2**: Speed/awareness of retail vs capital risk and delisting risk\n- **X3**: US upside vs the safer, smaller Japan scale-up (one launch only in 2027)\n- **X4**: Advertising intensity (growth) vs contribution and payback\n\n## Plausible recommendations\n\n- **R1** (defensible: yes): Enter through Amazon in 2027 with explicit gates (e.g. ACoS \u2264 ~28%, repeat \u2265 ~30%, label fix, tariff watch); add retail only when awareness supports \u2265 4 units/door/week; reset the $40M ambition or accept a later date.\n- **R2** (defensible: conditional): Prioritise the Japan scale-up in 2027 and keep the cross-border Amazon listing as a low-cost US test \u2014 defensible if argued from payback risk and the one-launch constraint, with a clear trigger for a US launch later.\n- **R3** (defensible: conditional): Amazon-led entry with a lower fixed-cost base (smaller team, slower brand spend) to protect payback \u2014 defensible if numbers are shown.\n- **R4** (defensible: no): National specialty-retail launch in 2027 (Option B).\n- **R5** (defensible: no): Enter the US 'because the market is large and growing' without channel economics.\n\n## Contradictory evidence\n\n- The planning team's 25% ACoS vs the 32% scaling benchmark\n- The retailer's 4.5 units/door/week vs the 2.6 median at Onsoo's awareness\n- The $40M ambition vs the investment cap and margin floor\n- Saebom's success vs Gaon Lab and Yeoreum stalling (survivorship bias)\n- Board member's correlation memo vs what a correlation across brands can show\n\n## Criteria for a defensible conclusion\n\n- Compares the options on the board's own constraints (cap, payback, margin floor), not only on revenue\n- Tests the planning assumptions (ACoS, units per door) against the benchmarks in the pack\n- States what has to be true for the chosen route to pay back, and what would trigger a change\n- Acknowledges that the $40M ambition is not reachable within the constraints on the evidence given\n\nAlternative conclusions that meet these criteria are acceptable; the list of plausible recommendations is not exhaustive.\n", "c4-pricing-churn": "# Answer key \u00b7 Palisade Docs \u2014 pricing while churn rises\n\n> **Evaluators only.** Never copy this file into a generation workspace.\n\n**Decision question:** Should Palisade raise prices in 2027 while customer churn is rising, and if so, how?\n\n## Initial hypothesis in the pack\n\n- Holder: CFO (with the CEO holding the opposite view)\n- Statement: Raise list prices 12% on every plan; churn is onboarding, not price ($10.3M).\n- Expected handling: **revise**\n- Why: Both interpretations are partly right. The SMB churn rise is mostly a mix effect from the 2025 promotion cohort (\u22484.9% monthly churn vs 2.1% for other SMB customers; mix effect \u2248 1.0 pp of the 1.1 pp rise) \u2014 supporting the CFO \u2014 but those customers leave over price when the discount ends and Inkwell has made SMB more price-competitive \u2014 supporting the CEO. A good answer differentiates by segment rather than adopting either view wholesale.\n\n## Key analytical insights\n\n- **K1** (critical): Churn rise is concentrated in SMB (2.0% \u2192 3.1%); mid-market rose modestly (0.6% \u2192 0.8%), enterprise flat (0.2%). Revenue-weighted monthly churn rose from 0.83% to 1.19%.\n- **K2** (critical): Mix decomposition: non-promo SMB churn 2.0% \u2192 2.1% (rate effect \u2248 0.1 pp); promotion cohort \u2248 4.9% implied; the promotion explains \u2248 1.0 pp of the 1.1 pp SMB increase.\n- **K3** (critical): Price is a real churn reason, but mainly for the promotion cohort at discount expiry (52% cite price) vs 18% for non-promo SMB; Inkwell's $9 plan and the win-rate fall (51% \u2192 38%) make SMB price-sensitive.\n- **K4** (critical): The $10.3M is overstated: only renewing ARR reprices in 2027 and 60% of enterprise ARR is capped at 7% \u2192 about $7.57M before any churn response (SMB $2.52M, mid-market $4.18M, enterprise $0.86M).\n- **K5** (critical): Mid-market and enterprise look price-inelastic (low churn, NRR 112%/118%, 2024 test showed no conversion effect, no Inkwell presence) \u2014 that is where an increase is safest and worth most.\n- **K6**: A 12% increase is revenue-neutral if it causes about 10.7% extra loss of the repriced base. The 2023 SMB +8% increase lost about 3.6% extra customers and netted about 4.1% \u2014 but that was before Inkwell.\n- **K7**: Activation (\u22655 documents in month one) predicts retention; onboarding fixes for the promotion cohort are a separate lever from pricing.\n- **K8**: The dashboard's 1.4% \u2192 2.3% matches neither blended logo churn (1.71% \u2192 2.62%) nor revenue-weighted churn (0.83% \u2192 1.19%); a good answer works from the segment table and notes the undefined metric.\n\n## Required calculations\n\n- **Q1**: Segment churn comparison and/or revenue-weighted churn \u2014 expected: blended logo churn 1.71% \u2192 2.62%; revenue-weighted 0.83% \u2192 1.19% (tolerance: \u00b10.1 pp)\n- **Q2**: Promotion-cohort churn / mix decomposition \u2014 expected: promo \u2248 4.9%; mix \u2248 1.0 pp, rate \u2248 0.1 pp (tolerance: \u00b10.3 pp)\n- **Q3**: Realistic 2027 uplift of a 12% increase \u2014 expected: $7.57M (tolerance: \u00b1$0.5M; any correction for renewal timing or caps counts)\n- **Q4**: Break-even extra churn / 2023 precedent \u2014 expected: 10.7%; 2023 net \u2248 4.1% (tolerance: \u00b11 pp)\n\n## Decision-relevant evidence\n\n- **E1** (critical): Segment churn table (SMB vs mid-market vs enterprise)\n- **E2** (critical): Promotion cohort size, activation and non-promo SMB churn 2.1%\n- **E3** (critical): Exit reasons by group (52% vs 18% citing price)\n- **E4** (critical): Inkwell $9 plan and SMB win-rate decline\n- **E5** (critical): Renewal timing and the 7% enterprise cap\n- **E6**: 2023 SMB price-increase history and 2024 mid-market test\n- **E7**: NRR by segment\n- **E8**: Undefined dashboard churn metric vs the segment table\n\n## Common reasoning traps\n\n- **T1**: Treating blended churn as one number and concluding price sensitivity everywhere (or nowhere)\n- **T2**: Taking the $10.3M at face value\n- **T3**: Reading exit surveys without splitting by cohort\n- **T4**: Generalising the 2024 new-signup test to renewing customers without caveat\n- **T5**: Accepting 'onboarding will halve SMB churn' without evidence, cost or timing\n\n## Key trade-offs\n\n- **X1**: ARR uplift vs churn risk, by segment\n- **X2**: Competing with Inkwell in SMB (price) vs monetising mid-market/enterprise value\n- **X3**: Short-term revenue vs NRR/brand (customer trust at renewal)\n\n## Plausible recommendations\n\n- **R1** (defensible: yes): Differentiated increase: raise mid-market (and enterprise within caps); hold or restructure SMB (grandfather, a lower-priced tier vs Inkwell, fix activation), with a staged test and churn guardrails.\n- **R2** (defensible: yes): Raise mid-market/enterprise now; delay SMB changes until the promotion cohort has washed out and activation is fixed.\n- **R3** (defensible: conditional): A smaller uniform increase (e.g. 5\u20137%) with SMB grandfathering \u2014 defensible if the segment evidence is addressed.\n- **R4** (defensible: no): 12% across the board as proposed.\n- **R5** (defensible: no): No increase anywhere because 'churn is rising'.\n\n## Contradictory evidence\n\n- Churn rise looks like price sensitivity (exit surveys, Inkwell) and like a cohort mix effect (promotion, activation)\n- 2023 precedent says SMB increases pay off; Inkwell says conditions have changed\n- CFO's $10.3M vs renewal timing and contract caps\n\n## Criteria for a defensible conclusion\n\n- Separates the cohort/mix effect from a rate effect\n- Recognises both interpretations and reconciles them with the evidence\n- Corrects or questions the $10.3M estimate\n- Pricing recommendation differs by segment or explains why it should not\n\nAlternative conclusions that meet these criteria are acceptable; the list of plausible recommendations is not exhaustive.\n"}, "rubric": "# Scoring rubric (frozen before the main benchmark)\n\nScore the **reasoning** of the document, not its look. Do not reward slide count, length, visual polish,\nconsulting vocabulary, frameworks named but not used, or compliance with any template or style guide. A short\ndocument can score 5; a long one can score 1. Alternative conclusions that meet the answer key's criteria for a\ndefensible conclusion are as good as the key's preferred one.\n\nEach dimension is scored 1\u20135. Anchors are given for 1, 3 and 5; use 2 and 4 for documents between anchors.\n\n**Use the whole scale.** A 5 means the document could go to the decision maker as it is: nothing material to fix on\nthat dimension. A 4 is strong work with at least one material flaw (one unsupported claim that matters, one missed\ncritical item, one gap in the logic). Competent work with several such flaws is a 3. In particular, evidence and\nreasoning cannot score 5 if the document contains a material numerical error, a material unsupported claim, or\nmisses a critical evidence item; strategic judgment cannot score 5 if it falls into one of the key's traps or\nignores evidence that cuts against its recommendation; clarity and concision cannot score 5 if the document is\nsubstantially longer than the decision needs.\n\n## Dimensions and weights\n\n| Dimension | Weight |\n|---|---:|\n| Problem framing | 15% |\n| Storyline coherence | 25% |\n| Evidence and reasoning | 25% |\n| Strategic judgment | 25% |\n| Clarity and concision | 10% |\n\nWeighted score = 0.15\u00b7framing + 0.25\u00b7coherence + 0.25\u00b7evidence + 0.25\u00b7judgment + 0.10\u00b7clarity (range 1\u20135).\n\n### 1 \u00b7 Problem framing (15%)\nDoes the document frame the decision the decision maker actually faces?\n- **1** \u2014 Answers a different or vaguer question; ignores the stated objectives and constraints; no sense of what the decision turns on.\n- **3** \u2014 States the question and some objectives or constraints, but uses them only partly as decision criteria, or misses an important one (e.g. treats a \"which route\" decision as yes/no, or ignores a binding constraint).\n- **5** \u2014 Frames the decision exactly as posed; uses the stated objectives and constraints explicitly as criteria; identifies early the few issues the answer turns on.\n\n### 2 \u00b7 Storyline coherence (25%)\nDo the governing thought, executive summary, slide titles and evidence form one consistent logical hierarchy?\n- **1** \u2014 No clear overall answer; slides are a sequence of topics or data dumps; the summary (if any) does not match the body; the argument contradicts itself.\n- **3** \u2014 A clear answer and sensible sections; most titles carry a message; but some slides do not support their parent point, there are gaps or jumps, or redundancy.\n- **5** \u2014 The governing thought answers the question; the summary points are the sections; every title is a claim that its slide's evidence supports; reading the titles alone gives the argument; no gaps, contradictions or redundancy.\n\n### 3 \u00b7 Evidence and reasoning (25%)\nAre numbers right, calculations done, inferences valid and claims supported by the briefing pack?\n- **1** \u2014 Key numbers wrong or misread; important claims not supported by the pack; required calculations missing or wrong; evidence cherry-picked.\n- **3** \u2014 Mostly accurate; some required calculations done; a few unsupported or overstated claims; some critical evidence missed or misread.\n- **5** \u2014 Numbers correct and derivations transparent; the required calculations are done; critical evidence is used, including evidence that cuts against the answer; claims are calibrated to the evidence; causal claims are justified.\n\n### 4 \u00b7 Strategic judgment (25%)\nIs the recommendation defensible and decision-useful?\n- **1** \u2014 Recommendation missing or not defensible given the evidence; no real alternatives; trade-offs ignored; falls into the main reasoning traps.\n- **3** \u2014 Defensible but generic or under-qualified; alternatives named but not genuinely compared; some trade-offs; uncertainty handled only partly.\n- **5** \u2014 A clear recommendation that follows from the analysis; alternatives compared on the decision criteria; the key trade-offs explicit; says what would change the answer (conditions, gates, kill criteria); actionable next steps; avoids the traps.\n\n### 5 \u00b7 Clarity and concision (10%)\nCan the decision maker get the answer and the reasons quickly?\n- **1** \u2014 Answer buried or absent; padded, repetitive or jargon-heavy; far longer than the decision needs, or too thin to act on.\n- **3** \u2014 Answer findable early; some padding, repetition or jargon; length somewhat out of proportion to the decision.\n- **5** \u2014 Answer in the opening pages; every slide earns its place; plain, precise language; length proportional to the decision's complexity.\n\n## Error and coverage measures (counted, not scored)\n\n- **Unsupported claim:** an assertion of fact or a number about the company, market, customers or competitors, presented as true, that is neither in the briefing pack nor validly derived from it. Includes invented figures and facts, overstated certainty (\"will\", \"proves\") without basis, and causal claims the evidence does not support. Excludes clearly labelled assumptions or estimates with a stated basis, and recommendations or opinions presented as such. List each with a short quote.\n- **Numerical error:** a number that contradicts the pack, or a calculation that is wrong beyond rounding (more than about 2% relative, or the wrong sign). List each with the correct value.\n- **Material logical contradiction:** two statements in the document that cannot both be true, or a recommendation that contradicts the document's own analysis.\n- **Critical evidence coverage:** for each answer-key evidence item marked critical, whether the document uses it (yes / partial / no).\n- **Key insights, calculations, trade-offs, traps:** per answer-key item, whether the document reaches it / does it correctly / identifies it / falls into it.\n- **Recommendation defensibility:** yes / partial / no, against the key's defensibility criteria (not against its preferred answer).\n- **Hypothesis handling:** how the document treats the initial hypothesis stated in the pack, and whether that treatment is appropriate given the evidence (the key gives the expected handling and why). Reward updating that the evidence supports; do **not** reward contrarianism: rejecting a hypothesis the evidence supports is as wrong as keeping one it refutes.\n", "orders": {"R1": ["DXFQCQ", "DNWXFQ", "DAAZ9G", "DZ9GNW", "D9GNWX", "DXX43J"], "R2": ["DZ9GNW", "DXFQCQ", "D9GNWX", "DXX43J", "DAAZ9G", "DNWXFQ"], "R3": ["DNWXFQ", "DXX43J", "D9GNWX", "DXFQCQ", "DZ9GNW", "DAAZ9G"]}, "dims": ["problem_framing", "storyline_coherence", "evidence_and_reasoning", "strategic_judgment", "clarity_and_concision"], "counts": ["unsupported_claims", "numerical_errors", "logical_contradictions", "missed_critical_evidence"], "cats": {"recommendation_defensible": ["yes", "partial", "no"], "hypothesis_handling_appropriate": ["yes", "partial", "no"], "key_tradeoffs_identified": ["all", "some", "none"]}, "phase": "pilot2"};
let rev=localStorage.getItem('rev')||'', idx=0;
const $=s=>document.querySelector(s);
function order(){return D.orders[rev]||D.items.map(i=>i.id)}
function store(){return JSON.parse(localStorage.getItem('scores-'+rev)||'{}')}
function save(s){localStorage.setItem('scores-'+rev,JSON.stringify(s))}
function render(){
  $('#rev').value=rev; const ids=order(); const id=ids[idx]; const it=D.items.find(i=>i.id==id);
  $('#pos').textContent=(idx+1)+' / '+ids.length; $('#bid').textContent=id+' · '+it.case+' · '+it.words+' words';
  $('#packet').textContent=D.packets[it.case]; $('#key').textContent=D.keys[it.case]; $('#rubric').textContent=D.rubric; $('#doc').textContent=it.doc;
  const s=store()[id]||{}; let h='<h3>Scores for '+id+'</h3><p class="muted">1 = poor · 3 = adequate · 5 = excellent (anchors in the rubric)</p>';
  for(const d of D.dims){h+='<div class="dim"><b>'+d.replace(/_/g,' ')+'</b><br>';for(let v=1;v<=5;v++)h+='<label><input type="radio" name="'+d+'" value="'+v+'"'+(s[d]==v?' checked':'')+'> '+v+'</label>';h+='</div>'}
  for(const c of D.counts)h+='<div class="dim"><b>'+c.replace(/_/g,' ')+'</b> <input type="number" min="0" name="'+c+'" value="'+(s[c]??'')+'" style="width:5em"></div>';
  for(const [c,opts] of Object.entries(D.cats)){h+='<div class="dim"><b>'+c.replace(/_/g,' ')+'</b><br>';for(const o of opts)h+='<label><input type="radio" name="'+c+'" value="'+o+'"'+(s[c]==o?' checked':'')+'> '+o+'</label>';h+='</div>'}
  h+='<div class="dim"><b>comment</b><br><textarea name="comment" rows="5" style="width:100%">'+(s.comment||'')+'</textarea></div><button id="save">Save</button> <span id="ok"></span>';
  $('#form').innerHTML=h; $('#save').onclick=()=>{const all=store();const r={};
    for(const d of D.dims){const e=document.querySelector('input[name='+d+']:checked');if(e)r[d]=+e.value}
    for(const c of D.counts){const e=document.querySelector('input[name='+c+']');if(e.value!=='')r[c]=+e.value}
    for(const c of Object.keys(D.cats)){const e=document.querySelector('input[name='+c+']:checked');if(e)r[c]=e.value}
    r.comment=document.querySelector('textarea[name=comment]').value; r.saved_at=new Date().toISOString();
    all[id]=r; save(all); $('#ok').innerHTML='<span class="saved">saved</span>'; status()};
  status(); window.scrollTo(0,0)}
function status(){const n=Object.keys(store()).length;$('#status').textContent=n+' scored'}
$('#rev').onchange=e=>{rev=e.target.value.trim();localStorage.setItem('rev',rev);idx=0;render()};
$('#prev').onclick=()=>{idx=Math.max(0,idx-1);render()};
$('#next').onclick=()=>{idx=Math.min(order().length-1,idx+1);render()};
$('#export').onclick=()=>{const b=new Blob([JSON.stringify({reviewer:rev,phase:D.phase,scores:store()},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='human-scores-'+rev+'.json';a.click()};
render();
</script></body></html>
