wer: The recommended plan adds about $3.0M of net ARR in 2027, and up to $0.5M more if the SMB test passes. It gives the same ~$2.0M as the CFO's flat +12% in the downside case and less SMB risk. No pricing option reaches the 15% growth target on its own; new customers must supply the last ~$1.9M.\n2. 1. Churn is rising because of one cohort, not because customers broadly reject the price. Core SMB churn went from 2.0% to only 2.1% a month. The 2,100 customers from the 2025 promotion churn at ~4.9% a month and make up 56% of SMB churners. Better onboarding explains only ~30% of their excess churn; the rest is a reaction to the discount ending.\n3. 2. Mid-market and enterprise can take a price rise; SMB has not shown it can. Mid-market: a +10% test had no significant effect on conversion (23.1% vs 23.6%), churn is 0.8% a month and NRR is 112%. Enterprise: 0.2% churn, NRR 118%. SMB: Inkwell's $9 plan has cut Palisade's win rate from 51% to 38%.\n4. 3. The CFO's $10.3M is really ~$4.2M, and the extra $1.2M over our plan depends on SMB. Contracts not renewing in 2027 and the 7% enterprise cap cut it to $7.6M; churn cuts it to $4.2M. Our plan gives $3.0M. If customers are more price-sensitive than we assume, both give ~$2.0M, so the flat 12% buys upside only if Inkwell has not changed SMB behaviour.\n5. 4. Raise in January, gate SMB on a test, and plan for new customers to close the 15% gap. ARR reaches ~$97.0M (+12.8%) before new customers; NRR stays ~113%. Mid-market and enterprise rises start at January renewals. An SMB test runs in Q1\u2013Q2, with an H2 rise only if it passes. Churn triggers can pause any step.\n\n**Slides (title \u2192 claims \u2192 evidence):**\n\n- Slide 1: Raise prices in 2027 \u2014 but only where Palisade has pricing power\n  - Claim: Recommendation on the 2027 pricing plan: should Palisade raise prices while churn is rising, and if so, how?\n    - Evidence: CEO and leadership team | Pricing decision meeting, December 2026\n    - Evidence: Prepared from the 2026 briefing pack only (synthetic benchmark data); all figures $M ARR unless stated\n- Slide 2: Yes, raise prices in 2027 by segment: +10% for mid-market and enterprise, hold SMB until a test reads out, and retain the promo cohort without a price rise\n  - Claim: The recommended plan adds about $3.0M of net ARR in 2027, and up to $0.5M more if the SMB test passes. It gives the same ~$2.0M as the CFO's flat +12% in the downside case and less SMB risk.\n  - Claim: No pricing option reaches the 15% growth target on its own; new customers must supply the last ~$1.9M.\n  - Claim: Churn is rising because of one cohort, not because customers broadly reject the price\n    - Evidence: Core SMB churn went from 2.0% to only 2.1% a month.\n    - Evidence: The 2,100 customers from the 2025 promotion churn at ~4.9% a month and make up 56% of SMB churners.\n    - Evidence: Better onboarding explains only ~30% of their excess churn; the rest is a reaction to the discount ending.\n  - Claim: Mid-market and enterprise can take a price rise; SMB has not shown it can\n    - Evidence: Mid-market: a +10% test had no significant effect on conversion (23.1% vs 23.6%), churn is 0.8% a month and NRR is 112%.\n    - Evidence: Enterprise: 0.2% churn, NRR 118%.\n    - Evidence: SMB: Inkwell's $9 plan has cut Palisade's win rate from 51% to 38%.\n  - Claim: The CFO's $10.3M is really ~$4.2M, and the extra $1.2M over our plan depends on SMB\n    - Evidence: Contracts not renewing in 2027 and the 7% enterprise cap cut it to $7.6M; churn cuts it to $4.2M.\n    - Evidence: Our plan gives $3.0M.\n    - Evidence: If customers are more price-sensitive than we assume, both give ~$2.0M, so the flat 12% buys upside only if Inkwell has not changed SMB behaviour.\n  - Claim: Raise in January, gate SMB on a test, and plan for new customers to close the 15% gap\n    - Evidence: ARR reaches ~$97.0M (+12.8%) before new customers; NRR stays ~113%.\n    - Evidence: Mid-market and enterprise rises start at January renewals.\n    - Evidence: An SMB test runs in Q1\u2013Q2, with an H2 rise only if it passes.\n    - Evidence: Churn triggers can pause any step.\n- Slide 3: We started with 'raise by segment, including a modest SMB rise'; the evidence supported raising mid-market and enterprise, but not SMB yet\n  - Claim: Initial hypothesis (stated before testing): Raise prices in 2027, but vary the rise by segment: about +10% for mid-market and enterprise and +8% for SMB (the size of the 2023 rise), with no rise for the promo cohort.\n  - Claim: H1. Rising churn does not reflect a general reaction against the price \u2014 Supported\n    - Evidence: Core SMB churn 2.0% \u2192 2.1%; share citing price 19% \u2192 18% for this group.\n    - Evidence: The promo cohort churns at ~4.9%: it is 36% of SMB customers but 56% of SMB churners.\n    - Evidence: Mid-market 0.6% \u2192 0.8%, enterprise flat.\n  - Claim: H2a. Mid-market and enterprise can absorb a rise without churn wiping out the gain \u2014 Supported\n    - Evidence: Mid-market +10% test: conversion 23.1% vs 23.6%, not significant.\n    - Evidence: Churn \u22640.8% a month, NRR 112\u2013118%.\n    - Evidence: Customers stay for integrations and the audit trail.\n    - Evidence: Inkwell not seen in deals over 200 seats.\n    - Evidence: Caveat: the test was on new sign-ups, not renewals.\n  - Claim: H2b. Core SMB can absorb +8% as it did in 2023 \u2014 Not proven: revised to test first\n    - Evidence: In 2023, +8% added 0.5pp to monthly churn for 6 months and the rise still paid off.\n    - Evidence: Since then, Inkwell launched at $9 against our $15 and the SMB win rate fell from 51% to 38%.\n    - Evidence: We have no data on how renewing SMB customers react to price after Inkwell.\n  - Claim: H3. The rise is big enough to matter for the 2027 targets \u2014 Partly: changes the plan\n    - Evidence: It is worth $3.0\u20134.2M net, not $10.3M.\n    - Evidence: NRR stays above 100% in every option.\n    - Evidence: No option reaches +15% without new customers.\n  - Claim: H4. The downside can be seen early and limited \u2014 Supported\n    - Evidence: Prices change only at renewal, so the effect shows up month by month.\n    - Evidence: Break-even churn levels are known for each segment.\n    - Evidence: A test design worked in 2024.\n  - Claim: What changed: The SMB rise moved from 'raise in January' to 'test now, decide by end of Q2'. The value estimate fell from the $10.3M headline to $3\u20134M net.\n- Slide 4: Churn is rising because of the 2025 promotion cohort: core SMB and enterprise churn are flat, and mid-market is up only 0.2pp\n  - Claim: Monthly logo churn, % of customers, H1 2025 vs H1 2026\n    - Evidence: Core SMB (3,800 customers): 2 \u2192 2.1\n    - Evidence: Promo cohort (2,100 customers, joined Feb\u2013Aug 2025): \u2014 \u2192 4.9\n    - Evidence: All SMB (5,900): 2 \u2192 3.1\n    - Evidence: Mid-market (1,350): 0.6 \u2192 0.8\n    - Evidence: Enterprise (150): 0.2 \u2192 0.2\n  - Claim: Core SMB churn has barely moved: 2.0% \u2192 2.1%. The share of these churners citing price fell from 19% to 18%, so Inkwell has not yet hurt retention.\n  - Claim: The promo cohort drives the rise: 36% of SMB customers but 56% of SMB churners.\n    - Evidence: 103 of the 183 SMB customers lost each month come from it.\n  - Claim: The rise should fade as this cohort leaves the base.\n    - Evidence: If they churned like other SMB customers, SMB churn would be 2.1%, not 3.1%.\n  - Claim: Mid-market churn is slightly up (0.6% \u2192 0.8%) and the pack does not explain it. We watch it as a guardrail metric.\n  - Claim: Promo-cohort churn is derived; treat it as approximate.\n    - Evidence: (5,900 \u00d7 3.1% \u2212 3,800 \u00d7 2.1%) \u00f7 2,100 = 4.9% a month. This uses mid-2026 customer counts for H1 rates\n- Slide 5: Better onboarding explains only ~30% of the promo cohort's excess churn; the rest is a reaction to the discount ending, so a further rise would make it worse\n  - Claim: Monthly churn, H1 2026, decomposition\n    - Evidence: Core SMB: 2.1 core level\n    - Evidence: Promo cohort: 2.1 core level + 0.8 explained by low activation + 2 not explained: discount ending / bargain hunters\n  - Claim: Evidence table: Core SMB vs Promo cohort\n    - Evidence: Sent \u22655 docs in month 1: 72% vs 41%\n    - Evidence: Churners citing price, H1 2026: 18% vs 52%\n    - Evidence: When they leave: Steady vs Mostly within 2 months of the discount ending\n    - Evidence: Monthly churn, H1 2026: 2.1% vs ~4.9%\n  - Claim: CFO, 'onboarding, not price': half right. Core customers are not leaving over price, but the promo cohort is: they left when their price doubled.\n  - Claim: Customer Success, 'halve SMB churn in two quarters': not credible.\n    - Evidence: Halving it means 1.55%, below the 2.1% of customers who were onboarded normally.\n    - Evidence: Full activation is worth ~$0.3M of ARR in 2027.\n    - Evidence: Even churn at the core rate would save only ~$1.0M.\n  - Claim: So: no rise for the promo cohort, retention work for it, and no more 50%-off acquisition offers.\n  - Claim: Method: customers who send <5 documents in month 1 churn ~3\u00d7 as often as those who send more.\n    - Evidence: Fitting the core mix (72% activated) to 2.1% gives activated churn of 1.35%.\n    - Evidence: The promo mix (41% activated) then predicts 2.9%; the actual is 4.9%.\n- Slide 6: Every signal of pricing power points the same way: mid-market and enterprise can absorb a rise, SMB is exposed to Inkwell, and the promo cohort cannot take one\n  - Claim: Mid-market ($41.0M): Strong pricing power\n    - Evidence: Monthly churn trend 0.6% \u2192 0.8%\n    - Evidence: NRR 112%\n    - Evidence: Churners citing price n/a\n    - Evidence: +10% test: conversion \u22120.5pp, not significant\n    - Evidence: Inkwell not seen above 200 seats\n    - Evidence: Why customers stay: Integrations, audit trail\n    - Evidence: Share of ARR that can reprice in 2027: 85%\n  - Claim: Enterprise ($24.0M): Pricing power, limited by contracts\n    - Evidence: Monthly churn trend 0.2% \u2192 0.2%\n    - Evidence: NRR 118%\n    - Evidence: 60% of ARR capped at +7%\n    - Evidence: Inkwell not seen\n    - Evidence: Why customers stay: Integrations, audit trail\n    - Evidence: Share of ARR that can reprice in 2027: 40% (contract terms)\n  - Claim: Core SMB ($16.6M): Unproven since Inkwell\n    - Evidence: Monthly churn trend 2.0% \u2192 2.1%\n    - Evidence: NRR 94% (whole SMB segment)\n    - Evidence: Churners citing price 18% (19% in 2025)\n    - Evidence: 2023: +8% \u2192 +0.5pp churn for 6 months, then net gain\n    - Evidence: Inkwell at $9 vs $15; win rate 51% \u2192 38%\n    - Evidence: Why customers stay: Not reported\n    - Evidence: Share of ARR that can reprice in 2027: 100%\n  - Claim: Promo cohort ($4.4M): No pricing power\n    - Evidence: ~4.9% (new cohort)\n    - Evidence: NRR 94% (whole SMB segment)\n    - Evidence: Churners citing price 52%\n    - Evidence: Left when the discount ended\n    - Evidence: Same as core SMB, and more price-driven\n    - Evidence: Low activation (41%)\n    - Evidence: Share of ARR that can reprice in 2027: 100%\n  - Claim: Caveat: the mid-market test covered new sign-ups over three months; how existing customers react at renewal is untested. Hence the guardrails on slide 13.\n- Slide 7: Inkwell is hurting SMB customer acquisition, not yet retention; a 12% SMB rise would widen the price gap just when new customers are most needed\n  - Claim: Palisade win rate in SMB deals where Inkwell was considered\n    - Evidence: H1 2025: 51\n    - Evidence: H1 2026: 38\n  - Claim: Entry-plan list price, $ per user per month\n    - Evidence: Inkwell Starter: 9\n    - Evidence: Palisade SMB today: 15\n    - Evidence: Palisade SMB +8%: 16.2\n    - Evidence: Palisade SMB +12%: 16.8\n    - Evidence: Palisade costs 1.67\u00d7 Inkwell today, 1.80\u00d7 after +8% and 1.87\u00d7 after +12%. Business plan $29 vs Inkwell Pro $24.\n  - Claim: Existing customers are staying.\n    - Evidence: Inkwell launched in October 2025, yet core SMB churn in H1 2026 was flat and price was cited by only 18% of churners.\n  - Claim: The pressure is on winning new customers\n    - Evidence: Palisade lost 13 points of win rate in Inkwell deals.\n  - Claim: The 15% target needs $0.7\u20131.9M of net new-customer ARR under either price-rise option, and SMB is where Inkwell competes.\n  - Claim: How price-sensitive SMB customers now are is the main uncertainty in the pack. Test it before rolling it out.\n- Slide 8: The CFO's $10.3M headline shrinks to $7.6M once renewal timing and contract caps apply, and to ~$4.2M after churn\n  - Claim: 2027 ARR gain from +12% on all plans at renewal, $M (waterfall)\n    - Evidence: CFO headline (12% \u00d7 $86M): 10.32\n    - Evidence: ARR not renewing in 2027: \u22122.466\n    - Evidence: Enterprise 7% cap: \u22120.288\n    - Evidence: Eligible to reprice in 2027: 7.566\n    - Evidence: Customers who churn anyway: \u22121.09207\n    - Evidence: Churn caused by the rise: \u22122.29556\n    - Evidence: Net ARR gain (base case): 4.17837\n  - Claim: Not renewing in 2027\n    - Evidence: 12% \u00d7 (15% of mid-market $41.0M + 60% of enterprise $24.0M) = $2.47M\n  - Claim: Enterprise cap\n    - Evidence: Capped 60% of the $9.6M renewing: (12% \u2212 7%) \u00d7 $5.76M = $0.29M\n  - Claim: Churn anyway: Customers who leave at their usual rate never pay the higher price.\n    - Evidence: Retained: core SMB 77.5%, promo 54.7%, mid-market 90.8%, enterprise 97.6% (12-month survival at the H1 2026 rate)\n  - Claim: Churn caused by the rise\n    - Evidence: Extra ARR lost per point of price: SMB 0.45% (2023), mid-market and enterprise 0.21% (2024 test), promo cohort 2.9\u00d7 SMB (52% vs 18% cite price)\n- Slide 9: A rise pays while the churn it causes stays below p/(1+p): mid-market and enterprise clear this easily, core SMB narrowly, the promo cohort not at all\n  - Claim: Extra ARR lost to the rise, % of renewing ARR (base / downside / break-even p/(1+p))\n    - Evidence: Mid-market +10%: 2.1 / 4.5 / 9.1\n    - Evidence: Enterprise +7% (capped): 1.5 / 3.1 / 6.5\n    - Evidence: Enterprise +10% (uncapped): 2.1 / 4.5 / 9.1\n    - Evidence: Core SMB +8%: 3.6 / 7.2 / 7.4\n    - Evidence: Core SMB +12%: 5.4 / 10.8 / 10.7\n    - Evidence: Promo cohort +12%: 15.6 / 23.4 / 10.7\n  - Claim: Break-even: a rise of p gains p on customers who stay and loses (1+p) on each extra one who leaves. It pays while extra churn < p/(1+p)\n    - Evidence: 9.1% at +10%, 10.7% at +12%\n  - Claim: Mid-market and enterprise: the estimate is 2.1% at +10%, a quarter of break-even. Even at SMB-level sensitivity (4.5%) the rise pays.\n  - Claim: Core SMB: fine at 2023 sensitivity. At twice that, the downside if Inkwell has changed behaviour, +12% loses money and +8% roughly breaks even.\n  - Claim: Promo cohort: loses money even in the base case.\n- Slide 10: Our plan gives up ~$1.2M of base-case upside against the CFO's flat 12%, but does as well in the downside and keeps SMB risk off the table\n  - Claim: A. Hold all prices\n    - Evidence: Nothing; fix onboarding only\n    - Evidence: Net ARR gain base 0.0, downside 0.0\n    - Evidence: Exit ARR 94.0 (+9.3%)\n    - Evidence: Main risk: Leaves $3M+ of low-risk value unused; $4.9M gap to 15%\n  - Claim: B. CFO: +12% on every plan\n    - Evidence: All renewals from January\n    - Evidence: Net ARR gain base +4.2, downside +2.0\n    - Evidence: Exit ARR 98.2 (+14.1%)\n    - Evidence: Main risk: SMB part is ~0 to negative in the downside; widens the Inkwell gap (1.87\u00d7); speeds promo churn; mid-market rise above the tested 10%\n  - Claim: C. Recommended: mid-market and enterprise +10% (within caps), hold SMB\n    - Evidence: Mid-market and enterprise renewals from January\n    - Evidence: Net ARR gain base +3.0, downside +2.0\n    - Evidence: Exit ARR 97.0 (+12.8%)\n    - Evidence: Main risk: Mid-market renewal reaction is untested; needs ~$1.9M from new customers\n  - Claim: C + gate: core SMB +8% from July if the test passes\n    - Evidence: Adds an SMB rise in H2 if the test passes\n    - Evidence: Net ARR gain base +3.3 to +3.5, downside +2.0\n    - Evidence: Exit ARR 97.3\u201397.5\n    - Evidence: Main risk: Only goes ahead if renewal churn and Inkwell win rate hold\n  - Claim: Why C over B: B's extra $1.2M is SMB rises (+$0.6M net) and mid-market at 12% instead of 10% (+$0.5M). The SMB part pays only if Inkwell has not changed SMB price sensitivity, and both downside cases come to ~$2.0M.\n    - Evidence: Upside at risk is only ~$0.6M once the SMB gate recovers up to $0.5M.\n  - Claim: Downside case: mid-market and enterprise as price-sensitive as SMB was in 2023, core SMB twice as sensitive, promo cohort 1.5\u00d7 its base.\n    - Evidence: Exit ARR = $86.0M + trailing-NRR movement ($8.0M) + net price gain; NRR is 112\u2013114% in every option.\n- Slide 11: No pricing option reaches 15% on its own: the recommended plan takes ARR to ~$97.0M, and new customers must supply the last ~$1.9M\n  - Claim: ARR bridge to December 2027, $M\n    - Evidence: ARR mid-2026: 86\n    - Evidence: SMB at 94% NRR: \u22121.26\n    - Evidence: Mid-market at 112% NRR: +4.92\n    - Evidence: Enterprise at 118% NRR: +4.32\n    - Evidence: Mid-market +10%: +2.42722\n    - Evidence: Enterprise +10% / 7% cap: +0.591913\n    - Evidence: 2027 exit ARR before new customers: 96.9991\n    - Evidence: Needed from new customers: +1.90087\n    - Evidence: 15% target: 98.9\n  - Claim: Trailing NRR holds in 2027 (SMB 94%, mid-market 112%, enterprise 118%), giving +$8.0M. This is the biggest assumption in the bridge.\n  - Claim: Price adds $3.0M net (downside $2.0M); the SMB gate could add up to $0.5M.\n  - Claim: New-customer ARR of \u2265$1.9M net of churn by December. The pack has no pipeline data, so Sales must confirm this.\n  - Claim: For comparison: the CFO's plan reaches $98.2M and still needs $0.7M from new customers.\n- Slide 12: The 2027 pricing plan: raise where customers value the product most, hold where Inkwell competes, and use retention work for the promo cohort\n  - Claim: Mid-market ($41.0M, 85% renews in 2027): +10% list price at renewal; Customer Success leads renewal conversations, focused on integrations and the audit trail; January renewals onwards\n    - Evidence: The tested level (no significant conversion effect); churn \u22640.8%; NRR 112%. We stop at 10% because 12% is untested\n    - Evidence: Net ARR +2.4 / +1.6\n  - Claim: Enterprise ($24.0M, 40% renews in 2027): Capped contracts (60%): +7%. Uncapped: +10%. Multi-year contracts keep their own terms; at each 2027 renewal\n    - Evidence: Churn 0.2%, NRR 118%, high switching costs; contracts set the ceiling\n    - Evidence: Net ARR +0.6 / +0.4\n  - Claim: Core SMB ($16.6M, 3,800 customers): Hold $15 / $29 in H1. Test +8% on new sign-ups and on a group of renewing customers. Roll out from July only if the test passes; test Q1\u2013Q2, decide end of Q2\n    - Evidence: Retention is stable but sensitivity since Inkwell is unknown; the win rate is already down 13 points\n    - Evidence: 0 now; +0.3\u20130.5 if rolled out\n  - Claim: Promo cohort ($4.4M, 2,100 customers): No rise. Activation outreach to the ~59% who are not using the product; offer an annual plan at the standard price; Q1\n    - Evidence: Price-driven churn (52% cite price); a rise loses money even in the base case\n    - Evidence: Protects ~$0.3M; not counted\n  - Claim: New SMB customers: No more 50%-off introductory offers; compete with Inkwell on product and packaging, not discounts; from now\n    - Evidence: The promo cohort activated at 41% vs 72% and churns 2.3\u00d7 as often\n    - Evidence: Supports the new-customer ARR needed\n- Slide 13: Run the plan in stages with set decision points and churn triggers, so a bad reaction shows up in weeks, not at year-end\n  - Claim: Timeline: Dec 2026 Decide; Q1 2027 Launch; Q2 2027 Read out; H2 2027 Scale or stop\n    - Evidence: Dec 2026: Approve the segmented plan; Fix the board churn metric (appendix); Sales confirms new-customer ARR plan\n    - Evidence: Q1 2027: Mid-market and enterprise rises from Jan renewals; SMB +8% test starts (new sign-ups + renewal test group); Promo activation outreach\n    - Evidence: Q2 2027: SMB test results after 3 months; Review mid-market renewal churn; Gate: SMB rise from July, or hold\n    - Evidence: H2 2027: SMB +8% from July if gate passed; Plan the 2028 rise using actual renewal data\n  - Claim: Guardrails\n    - Evidence: Mid-market monthly logo churn: baseline 0.8%; trigger > 1.2% two months in a row (downside case; break-even \u2248 1.55%); pause further mid-market rises; offer multi-year price locks to at-risk accounts\n    - Evidence: Mid-market accounts \u2264200 seats: churn and Inkwell mentions: not tracked; any sustained rise in Inkwell mentions; consider a lower rise for small mid-market accounts at renewal\n    - Evidence: SMB test: churn in the renewal test group vs control: 2.1%; extra churn > 0.5pp a month (the 2023 level); do not roll out the SMB rise in H2\n    - Evidence: SMB win rate vs Inkwell: 38%; falls further in the test group; do not roll out; review packaging\n    - Evidence: Promo cohort activation (\u22655 docs a month): 41% at month 1; no improvement by end of Q1; stop CS spend on this cohort; accept the expected ~$2.0M churn\n- Slide 14: The recommendation holds under the main uncertainties; the biggest open risks are whether NRR holds and whether new customers arrive, not the price rise\n  - Claim: Mid-market renewals react like the +10% new sign-up test\n    - Evidence: Basis: 2024 test; NRR 112%; integrations make the product sticky\n    - Evidence: If wrong: At 2\u00d7 (SMB-level) sensitivity, gain falls from $2.4M to $1.6M\n    - Evidence: Effect: Still positive; break-even needs 4\u00d7 the estimate. Guardrail on slide 13\n  - Claim: Core SMB price sensitivity since Inkwell\n    - Evidence: Basis: Retention flat; win rate down; no post-Inkwell price data\n    - Evidence: If wrong: A rise could cost money and new customers\n    - Evidence: Effect: This is why SMB is tested, not rolled out\n  - Claim: Promo cohort cannot be won back with activation alone\n    - Evidence: Basis: Activation explains ~30% of its excess churn\n    - Evidence: If wrong: If activation works better, more of the $4.4M survives\n    - Evidence: Effect: Upside only; not counted in the plan\n  - Claim: Trailing NRR by segment repeats in 2027\n    - Evidence: Basis: Trailing 12-month NRR\n    - Evidence: If wrong: Each point of overall NRR \u2248 $0.9M of exit ARR\n    - Evidence: Effect: Affects every option equally; does not change the ranking\n  - Claim: New-customer ARR of \u2265$1.9M net by Dec 2027\n    - Evidence: Basis: Not in the pack\n    - Evidence: If wrong: Growth falls short of 15%\n    - Evidence: Effect: Confirm with Sales in December; another reason to protect SMB win rate\n  - Claim: Capped share of enterprise ARR is the same in the 2027 renewals\n    - Evidence: Basis: The 60% applies to all enterprise ARR\n    - Evidence: If wrong: \u00b1$0.1M\n    - Evidence: Effect: Immaterial\n  - Claim: Board metric '1.4% \u2192 2.3%' cannot be reconciled\n    - Evidence: Basis: Undefined; segment data gives 1.7% \u2192 2.6% (by customers)\n    - Evidence: If wrong: The board may be misreading the trend\n    - Evidence: Effect: Restate the metric (appendix)\n- Slide 15: Four decisions in December secure ~$3.0M of low-risk ARR now and keep the option of an SMB rise from July\n  - Claim: 1. Approve +10% for mid-market and enterprise from January 2027 renewals\n    - Evidence: Enterprise capped contracts at +7%; multi-year contracts on their own terms. Worth ~$3.0M net ARR ($2.0M downside).\n  - Claim: 2. Hold SMB list prices in H1 and approve the +8% test\n    - Evidence: New sign-ups plus a renewal test group, run Q1\u2013Q2. Leadership decides on a July rollout at the end of Q2 against the slide 13 gates.\n  - Claim: 3. Exclude the promo cohort from any rise and stop 50%-off offers\n    - Evidence: Fund activation outreach to the ~59% of the cohort who are not using the product; review at end of Q1.\n  - Claim: 4. Close the 15% gap and fix the metrics\n    - Evidence: Sales to commit a plan for \u2265$1.9M of net new-customer ARR; Finance to restate the board churn metric by segment and cohort.\n- Slide 16: Appendix A1: Net gain = renewing ARR \u00d7 retention \u00d7 (price rise \u2212 churn caused by the rise), calibrated on the 2023 and 2024 price evidence\n  - Claim: Net gain per segment = R \u00d7 g \u00d7 [p \u2212 c \u00d7 (1 + p)]\n    - Evidence: R = ARR renewing in 2027: SMB 100% of $21.0M; mid-market 85% of $41.0M = $34.85M; enterprise 40% of $24.0M = $9.6M\n    - Evidence: g = share retained over 12 months at the H1 2026 monthly churn rate, (1 \u2212 m)^12\n    - Evidence: p = price rise; enterprise capped portion (60%) limited to 7%\n    - Evidence: c = extra share of retained ARR lost because of the rise; break-even when c = p/(1+p)\n  - Claim: Sensitivity (c per point of price)\n    - Evidence: SMB 0.45%: 2023 +8% added 0.5pp churn for 6 months and 0.1pp for the next 6 = 3.6% \u00f7 8\n    - Evidence: Mid-market and enterprise 0.21%: 2024 test conversion 23.1% vs 23.6% = 2.1% relative \u00f7 10\n    - Evidence: Promo cohort: SMB \u00d7 2.9 (52% \u00f7 18% citing price)\n    - Evidence: Downside: mid-market and enterprise at SMB sensitivity; core SMB \u00d72; promo \u00d71.5\n  - Claim: Simplifications\n    - Evidence: All repricing measured as a December 2027 run-rate, regardless of renewal month; this overstates revenue booked within 2027\n    - Evidence: Effect of the price rise on new-customer conversion not modelled (no SMB data)\n  - Claim: Base net by segment, $M (plan B / plan C)\n    - Evidence: Core SMB: R 16.6, g 77.5%, +0.77 / 0\n    - Evidence: Promo cohort: R 4.4, g 54.7%, -0.13 / 0\n    - Evidence: Mid-market: R 34.85, g 90.8%, +2.90 / +2.43\n    - Evidence: Enterprise: R 9.6, g 97.6%, +0.65 / +0.59\n    - Evidence: Total: +4.18 / +3.02\n  - Claim: Other derived figures\n    - Evidence: Promo cohort monthly churn: 4.9%\n    - Evidence: Promo share of SMB churners: 56%\n    - Evidence: Price-cited share implied by mix (reported 34%): 37% (survey response mix differs)\n    - Evidence: Promo ARR lost in 2027 at current churn: $2.0M\n    - Evidence: Overall trailing NRR (ARR-weighted): 109.3%\n- Slide 17: Appendix A2: The board dashboard's 'monthly churn 1.4% \u2192 2.3%' does not match any weighting of the segment data; restate it\n  - Claim: Ways of measuring churn (H1 2025 / H1 2026)\n    - Evidence: Board dashboard (undefined): 1.4% / 2.3%; calculation not stated\n    - Evidence: Logo churn, weighted by customers: 1.7% / 2.6%; \u03a3 customers \u00d7 churn \u00f7 7,400 (mid-2026 counts)\n    - Evidence: Logo churn, weighted by customers, excluding promo cohort: 1.6% / \u2014; base without the 2,100 promo customers\n    - Evidence: Churn weighted by ARR: 0.8% / 1.2%; \u03a3 ARR \u00d7 churn \u00f7 $86.0M\n  - Claim: Report churn separately by segment and by cohort (promo vs core), as both logo churn and gross revenue churn, each with a written definition.\n  - Claim: Weighted by customers, SMB dominates the blended figure. Weighted by ARR, churn is about 1.2% a month, a much less alarming picture for the board.\n    - Evidence: 80% of customers but 24% of ARR\n  - Claim: Until the metric is restated, the board's '2.3%' should not be used to judge the price decision.\n\n**Recommendation:** Raise prices in 2027 by segment: +10% for mid-market and enterprise from January 2027 renewals (enterprise capped contracts at +7%; multi-year contracts on their own terms), hold SMB list prices in H1 and approve the +8% test (July rollout decided at end of Q2 against the slide 13 gates), exclude the promo cohort from any rise and stop 50%-off offers (fund activation outreach), and close the 15% gap and fix the metrics (Sales to commit a plan for \u2265$1.9M of net new-customer ARR; Finance to restate the board churn metric by segment and cohort).\n\n**Alternatives considered:**\n- A. Hold all prices (fix onboarding only): Net ARR gain 0.0 base and downside; exit ARR 94.0 (+9.3%). Main risk: Leaves $3M+ of low-risk value unused; $4.9M gap to 15%.\n- B. CFO: +12% on every plan, all renewals from January: Rejected in favour of C. Net gain +4.2 base, +2.0 downside; exit ARR 98.2 (+14.1%). SMB part is ~0 to negative in the downside; widens the Inkwell gap (1.87\u00d7); speeds promo churn; mid-market rise above the tested 10%. B's extra $1.2M is SMB rises (+$0.6M net) and mid-market at 12% instead of 10% (+$0.5M); the SMB part pays only if Inkwell has not changed SMB price sensitivity, and both downside cases come to ~$2.0M.\n- C. Mid-market and enterprise +10% (within caps), hold SMB: Recommended. Net gain +3.0 base, +2.0 downside; exit ARR 97.0 (+12.8%). Risk: mid-market renewal reaction is untested; needs ~$1.9M from new customers.\n- C + gate: core SMB +8% from July if the test passes: Adds +0.3 to +0.5 base (total +3.3 to +3.5), +2.0 downside; exit ARR 97.3\u201397.5. Only goes ahead if renewal churn and Inkwell win rate hold.\n- Initial hypothesis: +8% SMB rise in January (size of the 2023 rise): Not proven: revised to 'test now, decide by end of Q2' because Inkwell launched at $9 and SMB win rate fell from 51% to 38%, with no data on renewing SMB price reaction since.\n- Mid-market at +12% rather than +10%: Rejected: 'We stop at 10% because 12% is untested'.\n- Price rise for the promo cohort: Rejected: price-driven churn (52% cite price); a rise loses money even in the base case.\n- CFO claim 'onboarding, not price' / Customer Success claim 'halve SMB churn in two quarters': CFO claim 'half right'; CS claim 'not credible': halving means 1.55%, below the 2.1% of normally onboarded customers; full activation worth ~$0.3M ARR in 2027.\n\n**Assumptions and uncertainties:**\n- Mid-market renewals react like the +10% new sign-up test; the test covered new sign-ups over three months and renewal reaction is untested. At 2\u00d7 (SMB-level) sensitivity, gain falls from $2.4M to $1.6M.\n- Core SMB price sensitivity since Inkwell is unknown \u2014 the main uncertainty in the pack; a rise could cost money and new customers.\n- Promo cohort cannot be won back with activation alone (activation explains ~30% of its excess churn); upside only, not counted.\n- Trailing NRR by segment repeats in 2027 (SMB 94%, mid-market 112%, enterprise 118%), giving +$8.0M \u2014 the biggest assumption in the bridge; each point of overall NRR \u2248 $0.9M of exit ARR.\n- New-customer ARR of \u2265$1.9M net by Dec 2027 is not in the pack; the pack has no pipeline data, so Sales must confirm.\n- Capped share of enterprise ARR (60%) assumed the same in the 2027 renewals; \u00b1$0.1M, immaterial.\n- Board metric '1.4% \u2192 2.3%' cannot be reconciled; the board may be misreading the trend.\n- Promo-cohort churn is derived using mid-2026 customer counts for H1 rates, so treat it as approximate.\n- Mid-market churn is slightly up (0.6% \u2192 0.8%) and the pack does not explain it.\n- All repricing measured as a December 2027 run-rate, regardless of renewal month; this overstates revenue booked within 2027.\n- Effect of the price rise on new-customer conversion not modelled (no SMB data).\n- Downside case: mid-market and enterprise as price-sensitive as SMB was in 2023, core SMB twice as sensitive, promo cohort 1.5\u00d7 its base.\n- Prepared from the 2026 briefing pack only (synthetic benchmark data).\n\n**Next steps:**\n- Dec 2026: Approve the segmented plan\n- Dec 2026: Fix the board churn metric (Finance to restate by segment and cohort)\n- Dec 2026: Sales confirms/commits a plan for \u2265$1.9M of net new-customer ARR\n- Q1 2027: Mid-market and enterprise rises from Jan renewals\n- Q1 2027: SMB +8% test starts (new sign-ups + renewal test group)\n- Q1 2027: Promo activation outreach; review at end of Q1\n- Q2 2027: SMB test results after 3 months; review mid-market renewal churn\n- Q2 2027: Gate: SMB rise from July, or hold\n- H2 2027: SMB +8% from July if gate passed\n- H2 2027: Plan the 2028 rise using actual renewal data\n- Monitor guardrails: mid-market churn >1.2% two months in a row; Inkwell mentions in \u2264200-seat accounts; SMB test extra churn >0.5pp; SMB win rate vs Inkwell; promo activation by end of Q1\n\n## Part 2 \u00b7 Full slide text (mechanical extraction)\n\n=== Slide 1 ===\n[Title] Raise prices in 2027 \u2014 but only where Palisade has pricing power\n- Recommendation on the 2027 pricing plan: should Palisade raise prices while churn is rising, and if so, how?\n- CEO and leadership team  |  Pricing decision meeting, December 2026\n- Prepared from the 2026 briefing pack only (synthetic benchmark data); all figures $M ARR unless stated\n\n=== Slide 2 ===\n[Title] Yes, raise prices in 2027 by segment: +10% for mid-market and enterprise, hold SMB until a test reads out, and retain the promo cohort without a price rise\n- Answer: The recommended plan adds about $3.0M of net ARR in 2027, and up to $0.5M more if the SMB test passes. It gives the same ~$2.0M as the CFO's flat +12% in the downside case and less SMB risk. No pricing option reaches the 15% growth target on its own; new customers must supply the last ~$1.9M.\n\n- Churn is rising because of one cohort, not because customers broadly reject the price\n- Core SMB churn went from 2.0% to only 2.1% a month. The 2,100 customers from the 2025 promotion churn at ~4.9% a month and make up 56% of SMB churners. Better onboarding explains only ~30% of their excess churn; the rest is a reaction to the discount ending.\n\n- Mid-market and enterprise can take a price rise; SMB has not shown it can\n- Mid-market: a +10% test had no significant effect on conversion (23.1% vs 23.6%), churn is 0.8% a month and NRR is 112%. Enterprise: 0.2% churn, NRR 118%. SMB: Inkwell's $9 plan has cut Palisade's win rate from 51% to 38%.\n\n- The CFO's $10.3M is really ~$4.2M, and the extra $1.2M over our plan depends on SMB\n- Contracts not renewing in 2027 and the 7% enterprise cap cut it to $7.6M; churn cuts it to $4.2M. Our plan gives $3.0M. If customers are more price-sensitive than we assume, both give ~$2.0M, so the flat 12% buys upside only if Inkwell has not changed SMB behaviour.\n- Raise in January, gate SMB on a test, and plan for new customers to close the 15% gap\n\n- ARR reaches ~$97.0M (+12.8%) before new customers; NRR stays ~113%. Mid-market and enterprise rises start at January renewals. An SMB test runs in Q1\u2013Q2, with an H2 rise only if it passes. Churn triggers can pause any step.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 3 ===\n[Title] We started with 'raise by segment, including a modest SMB rise'; the evidence supported raising mid-market and enterprise, but not SMB yet\n- Initial hypothesis (stated before testing): Raise prices in 2027, but vary the rise by segment: about +10% for mid-market and enterprise and +8% for SMB (the size of the 2023 rise), with no rise for the promo cohort.\n[Table]\n  | What would have to be true | Test against the evidence | Verdict |\n  | H1. Rising churn does not reflect a general reaction against the price | Core SMB churn 2.0% \u2192 2.1%; share citing price 19% \u2192 18% for this group. The promo cohort churns at ~4.9%: it is 36% of SMB customers but 56% of SMB churners. Mid-market 0.6% \u2192 0.8%, enterprise flat. | Supported |\n  | H2a. Mid-market and enterprise can absorb a rise without churn wiping out the gain | Mid-market +10% test: conversion 23.1% vs 23.6%, not significant. Churn \u22640.8% a month, NRR 112\u2013118%. Customers stay for integrations and the audit trail. Inkwell not seen in deals over 200 seats. Caveat: the test was on new sign-ups, not renewals. | Supported |\n  | H2b. Core SMB can absorb +8% as it did in 2023 | In 2023, +8% added 0.5pp to monthly churn for 6 months and the rise still paid off. Since then, Inkwell launched at $9 against our $15 and the SMB win rate fell from 51% to 38%. We have no data on how renewing SMB customers react to price after Inkwell. | Not proven: revised to test first |\n  | H3. The rise is big enough to matter for the 2027 targets | It is worth $3.0\u20134.2M net, not $10.3M. NRR stays above 100% in every option. No option reaches +15% without new customers. | Partly: changes the plan |\n  | H4. The downside can be seen early and limited | Prices change only at renewal, so the effect shows up month by month. Break-even churn levels are known for each segment. A test design worked in 2024. | Supported |\n- What changed: The SMB rise moved from 'raise in January' to 'test now, decide by end of Q2'. The value estimate fell from the $10.3M headline to $3\u20134M net.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 4 ===\n[Title] Churn is rising because of the 2025 promotion cohort: core SMB and enterprise churn are flat, and mid-market is up only 0.2pp\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n- Monthly logo churn, % of customers\n[Chart: COLUMN_CLUSTERED]\n  categories: Core SMB\n(3,800 customers); Promo cohort\n(2,100 customers); All SMB\n(5,900); Mid-market\n(1,350); Enterprise\n(150)\n  series 'H1 2025': 2; ; 2; 0.6; 0.2\n  series 'H1 2026': 2.1; 4.9; 3.1; 0.8; 0.2\n- What this means\n- \u2022  Core SMB churn has barely moved: 2.0% \u2192 2.1%. The share of these churners citing price fell from 19% to 18%, so Inkwell has not yet hurt retention.\n- \u2022  The promo cohort drives the rise: 36% of SMB customers but 56% of SMB churners. 103 of the 183 SMB customers lost each month come from it.\n- \u2022  The rise should fade as this cohort leaves the base. If they churned like other SMB customers, SMB churn would be 2.1%, not 3.1%.\n- \u2022  Mid-market churn is slightly up (0.6% \u2192 0.8%) and the pack does not explain it. We watch it as a guardrail metric.\n- joined Feb\u2013Aug 2025\n- Promo-cohort churn is derived: (5,900 \u00d7 3.1% \u2212 3,800 \u00d7 2.1%) \u00f7 2,100 = 4.9% a month. This uses mid-2026 customer counts for H1 rates, so treat it as approximate.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 5 ===\n[Title] Better onboarding explains only ~30% of the promo cohort's excess churn; the rest is a reaction to the discount ending, so a further rise would make it worse\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n- Monthly churn, H1 2026, % of customers\n[Chart: COLUMN_STACKED]\n  categories: Core SMB; Promo cohort\n  series 'Core SMB churn level': 2.1; 2.1\n  series 'Explained by low activation': ; 0.8\n  series 'Not explained: discount ending / bargain hunters': ; 2\n[Table]\n  | Evidence | Core SMB | Promo cohort |\n  | Sent \u22655 docs in month 1 | 72% | 41% |\n  | Churners citing price, H1 2026 | 18% | 52% |\n  | When they leave | Steady | Mostly within 2 months of the discount ending |\n  | Monthly churn, H1 2026 | 2.1% | ~4.9% |\n- Implications for the two internal claims\n- \u2022  CFO, 'onboarding, not price': half right. Core customers are not leaving over price, but the promo cohort is: they left when their price doubled.\n- \u2022  Customer Success, 'halve SMB churn in two quarters': not credible. Halving it means 1.55%, below the 2.1% of customers who were onboarded normally. Full activation is worth ~$0.3M of ARR in 2027. Even churn at the core rate would save only ~$1.0M.\n- \u2022  So: no rise for the promo cohort, retention work for it, and no more 50%-off acquisition offers.\n- Method: customers who send <5 documents in month 1 churn ~3\u00d7 as often as those who send more. Fitting the core mix (72% activated) to 2.1% gives activated churn of 1.35%. The promo mix (41% activated) then predicts 2.9%; the actual is 4.9%.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 6 ===\n[Title] Every signal of pricing power points the same way: mid-market and enterprise can absorb a rise, SMB is exposed to Inkwell, and the promo cohort cannot take one\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n[Table]\n  | Signal | Mid-market ($41.0M) | Enterprise ($24.0M) | Core SMB ($16.6M) | Promo cohort ($4.4M) |\n  | Monthly churn trend | 0.6% \u2192 0.8% | 0.2% \u2192 0.2% | 2.0% \u2192 2.1% | ~4.9% (new cohort) |\n  | Net revenue retention | 112% | 118% | 94% (whole SMB segment) | 94% (whole SMB segment) |\n  | Churners citing price | n/a | n/a | 18% (19% in 2025) | 52% |\n  | Direct price evidence | +10% test: conversion \u22120.5pp, not significant | 60% of ARR capped at +7% | 2023: +8% \u2192 +0.5pp churn for 6 months, then net gain | Left when the discount ended |\n  | Competitive pressure | Inkwell not seen above 200 seats | Inkwell not seen | Inkwell at $9 vs $15; win rate 51% \u2192 38% | Same as core SMB, and more price-driven |\n  | Why customers stay | Integrations, audit trail | Integrations, audit trail | Not reported | Low activation (41%) |\n  | Share of ARR that can reprice in 2027 | 85% | 40% (contract terms) | 100% | 100% |\n  | Assessment | Strong pricing power | Pricing power, limited by contracts | Unproven since Inkwell | No pricing power |\n- Caveat: the mid-market test covered new sign-ups over three months; how existing customers react at renewal is untested. Hence the guardrails on slide 13.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 7 ===\n[Title] Inkwell is hurting SMB customer acquisition, not yet retention; a 12% SMB rise would widen the price gap just when new customers are most needed\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n- Palisade win rate in SMB deals where Inkwell was considered\n- Entry-plan list price, $ per user per month\n- Why this matters\n[Chart: COLUMN_CLUSTERED]\n  categories: H1 2025; H1 2026\n  series 'Win rate': 51; 38\n[Chart: BAR_CLUSTERED]\n  categories: Inkwell Starter; Palisade SMB today; Palisade SMB +8%; Palisade SMB +12%\n  series '$ per user per month': 9; 15; 16.2; 16.8\n- \u2022  Inkwell launched in October 2025, yet core SMB churn in H1 2026 was flat and price was cited by only 18% of churners. Existing customers are staying.\n- \u2022  The pressure is on winning new customers: Palisade lost 13 points of win rate in Inkwell deals.\n- \u2022  The 15% target needs $0.7\u20131.9M of net new-customer ARR under either price-rise option, and SMB is where Inkwell competes.\n- \u2022  How price-sensitive SMB customers now are is the main uncertainty in the pack. Test it before rolling it out.\n- Palisade costs 1.67\u00d7 Inkwell today, 1.80\u00d7 after +8% and 1.87\u00d7 after +12%. Business plan $29 vs Inkwell Pro $24.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 8 ===\n[Title] The CFO's $10.3M headline shrinks to $7.6M once renewal timing and contract caps apply, and to ~$4.2M after churn\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n- 2027 ARR gain from +12% on all plans at renewal, $M\n[Chart: COLUMN_STACKED]\n  categories: CFO headline\n(12% \u00d7 $86M); ARR not renewing\nin 2027; Enterprise 7% cap; Eligible to\nreprice in 2027; Customers who\nchurn anyway; Churn caused\nby the rise; Net ARR gain\n(base case)\n  series 'base': 0; 7.854; 7.566; 0; 6.47393; 4.17837; 0\n  series 'Total': 10.32; 0; 0; 7.566; 0; 0; 4.17837\n  series 'Reduction': 0; 2.466; 0.288; 0; 1.09207; 2.29556; 0\n  series 'Increase': 0; 0; 0; 0; 0; 0; 0\n[Table]\n  | Step | Calculation |\n  | Not renewing in 2027 | 12% \u00d7 (15% of mid-market $41.0M + 60% of enterprise $24.0M) = $2.47M |\n  | Enterprise cap | Capped 60% of the $9.6M renewing: (12% \u2212 7%) \u00d7 $5.76M = $0.29M |\n  | Churn anyway | Customers who leave at their usual rate never pay the higher price. Retained: core SMB 77.5%, promo 54.7%, mid-market 90.8%, enterprise 97.6% (12-month survival at the H1 2026 rate) |\n  | Churn caused by the rise | Extra ARR lost per point of price: SMB 0.45% (2023), mid-market and enterprise 0.21% (2024 test), promo cohort 2.9\u00d7 SMB (52% vs 18% cite price) |\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 9 ===\n[Title] A rise pays while the churn it causes stays below p/(1+p): mid-market and enterprise clear this easily, core SMB narrowly, the promo cohort not at all\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n- Extra ARR lost to the rise, % of renewing ARR, compared with break-even\n[Chart: BAR_CLUSTERED]\n  categories: Mid-market +10%; Enterprise +7% (capped); Enterprise +10% (uncapped); Core SMB +8%; Core SMB +12%; Promo cohort +12%\n  series 'Base estimate': 2.1; 1.5; 2.1; 3.6; 5.4; 15.6\n  series 'Downside estimate': 4.5; 3.1; 4.5; 7.2; 10.8; 23.4\n  series 'Break-even, p/(1+p)': 9.1; 6.5; 9.1; 7.4; 10.7; 10.7\n- Reading the chart\n- \u2022  Break-even: a rise of p gains p on customers who stay and loses (1+p) on each extra one who leaves. It pays while extra churn < p/(1+p): 9.1% at +10%, 10.7% at +12%.\n- \u2022  Mid-market and enterprise: the estimate is 2.1% at +10%, a quarter of break-even. Even at SMB-level sensitivity (4.5%) the rise pays.\n- \u2022  Core SMB: fine at 2023 sensitivity. At twice that, the downside if Inkwell has changed behaviour, +12% loses money and +8% roughly breaks even.\n- \u2022  Promo cohort: loses money even in the base case.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 10 ===\n[Title] Our plan gives up ~$1.2M of base-case upside against the CFO's flat 12%, but does as well in the downside and keeps SMB risk off the table\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n[Table]\n  | Option | What changes in 2027 | Net ARR gain, base | Net ARR gain, downside | Exit ARR, base (growth) | Main risk |\n  | A. Hold all prices | Nothing; fix onboarding only | 0.0 | 0.0 | 94.0 (+9.3%) | Leaves $3M+ of low-risk value unused; $4.9M gap to 15% |\n  | B. CFO: +12% on every plan | All renewals from January | +4.2 | +2.0 | 98.2 (+14.1%) | SMB part is ~0 to negative in the downside; widens the Inkwell gap (1.87\u00d7); speeds promo churn; mid-market rise above the tested 10% |\n  | C. Recommended: mid-market and enterprise +10% (within caps), hold SMB | Mid-market and enterprise renewals from January | +3.0 | +2.0 | 97.0 (+12.8%) | Mid-market renewal reaction is untested; needs ~$1.9M from new customers |\n  | C + gate: core SMB +8% from July if the test passes | Adds an SMB rise in H2 if the test passes | +3.3 to +3.5 | +2.0 | 97.3\u201397.5 | Only goes ahead if renewal churn and Inkwell win rate hold |\n- \u2022  Why C over B: B's extra $1.2M is SMB rises (+$0.6M net) and mid-market at 12% instead of 10% (+$0.5M). The SMB part pays only if Inkwell has not changed SMB price sensitivity, and both downside cases come to ~$2.0M. Upside at risk is only ~$0.6M once the SMB gate recovers up to $0.5M.\n- \u2022  Downside case: mid-market and enterprise as price-sensitive as SMB was in 2023, core SMB twice as sensitive, promo cohort 1.5\u00d7 its base. Exit ARR = $86.0M + trailing-NRR movement ($8.0M) + net price gain; NRR is 112\u2013114% in every option.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 11 ===\n[Title] No pricing option reaches 15% on its own: the recommended plan takes ARR to ~$97.0M, and new customers must supply the last ~$1.9M\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n- ARR bridge to December 2027, $M (axis starts at $70M)\n[Chart: COLUMN_STACKED]\n  categories: ARR mid-2026; SMB at\n94% NRR; Mid-market at\n112% NRR; Enterprise at\n118% NRR; Mid-market\n+10%; Enterprise\n+10% / 7% cap; 2027 exit ARR\nbefore new customers; Needed from\nnew customers; 15% target\n  series 'base': 0; 84.74; 84.74; 89.66; 93.98; 96.4072; 0; 96.9991; 0\n  series 'Total': 86; 0; 0; 0; 0; 0; 96.9991; 0; 98.9\n  series 'Reduction': 0; 1.26; 0; 0; 0; 0; 0; 0; 0\n  series 'Increase': 0; 0; 4.92; 4.32; 2.42722; 0.591913; 0; 1.90087; 0\n- What has to be true\n- \u2022  Trailing NRR holds in 2027 (SMB 94%, mid-market 112%, enterprise 118%), giving +$8.0M. This is the biggest assumption in the bridge.\n- \u2022  Price adds $3.0M net (downside $2.0M); the SMB gate could add up to $0.5M.\n- \u2022  New-customer ARR of \u2265$1.9M net of churn by December. The pack has no pipeline data, so Sales must confirm this.\n- \u2022  For comparison: the CFO's plan reaches $98.2M and still needs $0.7M from new customers.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 12 ===\n[Title] The 2027 pricing plan: raise where customers value the product most, hold where Inkwell competes, and use retention work for the promo cohort\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n[Table]\n  | Segment | 2027 price action | When | Why | Net ARR, base / downside |\n  | Mid-market / $41.0M, 85% renews in 2027 | +10% list price at renewal; Customer Success leads renewal conversations, focused on integrations and the audit trail | January renewals onwards | The tested level (no significant conversion effect); churn \u22640.8%; NRR 112%. We stop at 10% because 12% is untested | +2.4 / +1.6 |\n  | Enterprise / $24.0M, 40% renews in 2027 | Capped contracts (60%): +7%. Uncapped: +10%. Multi-year contracts keep their own terms | At each 2027 renewal | Churn 0.2%, NRR 118%, high switching costs; contracts set the ceiling | +0.6 / +0.4 |\n  | Core SMB / $16.6M, 3,800 customers | Hold $15 / $29 in H1. Test +8% on new sign-ups and on a group of renewing customers. Roll out from July only if the test passes | Test Q1\u2013Q2; decide end of Q2 | Retention is stable but sensitivity since Inkwell is unknown; the win rate is already down 13 points | 0 now; +0.3\u20130.5 if rolled out |\n  | Promo cohort / $4.4M, 2,100 customers | No rise. Activation outreach to the ~59% who are not using the product; offer an annual plan at the standard price | Q1 | Price-driven churn (52% cite price); a rise loses money even in the base case | Protects ~$0.3M; not counted |\n  | New SMB customers | No more 50%-off introductory offers; compete with Inkwell on product and packaging, not discounts | From now | The promo cohort activated at 41% vs 72% and churns 2.3\u00d7 as often | Supports the new-customer ARR needed |\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 13 ===\n[Title] Run the plan in stages with set decision points and churn triggers, so a bad reaction shows up in weeks, not at year-end\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n- Dec 2026  Decide\n- Q1 2027  Launch\n- Q2 2027  Read out\n- H2 2027  Scale or stop\n- \u2022  Approve the segmented plan\n- \u2022  Fix the board churn metric (appendix)\n- \u2022  Sales confirms new-customer ARR plan\n- \u2022  Mid-market and enterprise rises from Jan renewals\n- \u2022  SMB +8% test starts (new sign-ups + renewal test group)\n- \u2022  Promo activation outreach\n- \u2022  SMB test results after 3 months\n- \u2022  Review mid-market renewal churn\n- \u2022  Gate: SMB rise from July, or hold\n- \u2022  SMB +8% from July if gate passed\n- \u2022  Plan the 2028 rise using actual renewal data\n[Table]\n  | Guardrail | Baseline | Trigger | Action if triggered |\n  | Mid-market monthly logo churn | 0.8% | > 1.2% two months in a row (downside case; break-even \u2248 1.55%) | Pause further mid-market rises; offer multi-year price locks to at-risk accounts |\n  | Mid-market accounts \u2264200 seats: churn and Inkwell mentions | Not tracked | Any sustained rise in Inkwell mentions | Consider a lower rise for small mid-market accounts at renewal |\n  | SMB test: churn in the renewal test group vs control | 2.1% | Extra churn > 0.5pp a month (the 2023 level) | Do not roll out the SMB rise in H2 |\n  | SMB win rate vs Inkwell | 38% | Falls further in the test group | Do not roll out; review packaging |\n  | Promo cohort activation (\u22655 docs a month) | 41% at month 1 | No improvement by end of Q1 | Stop CS spend on this cohort; accept the expected ~$2.0M churn |\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 14 ===\n[Title] The recommendation holds under the main uncertainties; the biggest open risks are whether NRR holds and whether new customers arrive, not the price rise\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n[Table]\n  | Key assumption or uncertainty | Basis in the evidence | If wrong | Effect on the recommendation |\n  | Mid-market renewals react like the +10% new sign-up test | 2024 test; NRR 112%; integrations make the product sticky | At 2\u00d7 (SMB-level) sensitivity, gain falls from $2.4M to $1.6M | Still positive; break-even needs 4\u00d7 the estimate. Guardrail on slide 13 |\n  | Core SMB price sensitivity since Inkwell | Retention flat; win rate down; no post-Inkwell price data | A rise could cost money and new customers | This is why SMB is tested, not rolled out |\n  | Promo cohort cannot be won back with activation alone | Activation explains ~30% of its excess churn | If activation works better, more of the $4.4M survives | Upside only; not counted in the plan |\n  | Trailing NRR by segment repeats in 2027 | Trailing 12-month NRR | Each point of overall NRR \u2248 $0.9M of exit ARR | Affects every option equally; does not change the ranking |\n  | New-customer ARR of \u2265$1.9M net by Dec 2027 | Not in the pack | Growth falls short of 15% | Confirm with Sales in December; another reason to protect SMB win rate |\n  | Capped share of enterprise ARR is the same in the 2027 renewals | The 60% applies to all enterprise ARR | \u00b1$0.1M | Immaterial |\n  | Board metric '1.4% \u2192 2.3%' cannot be reconciled | Undefined; segment data gives 1.7% \u2192 2.6% (by customers) | The board may be misreading the trend | Restate the metric (appendix) |\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 15 ===\n[Title] Four decisions in December secure ~$3.0M of low-risk ARR now and keep the option of an SMB rise from July\n- 1  Diagnosis\n- 2  Pricing power\n- 3  Value\n- 4  Plan\n- Approve +10% for mid-market and enterprise from January 2027 renewals\n\n- Enterprise capped contracts at +7%; multi-year contracts on their own terms. Worth ~$3.0M net ARR ($2.0M downside).\n- Hold SMB list prices in H1 and approve the +8% test\n\n- New sign-ups plus a renewal test group, run Q1\u2013Q2. Leadership decides on a July rollout at the end of Q2 against the slide 13 gates.\n- Exclude the promo cohort from any rise and stop 50%-off offers\n\n- Fund activation outreach to the ~59% of the cohort who are not using the product; review at end of Q1.\n- Close the 15% gap and fix the metrics\n\n- Sales to commit a plan for \u2265$1.9M of net new-customer ARR; Finance to restate the board churn metric by segment and cohort.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 16 ===\n[Title] Appendix A1: Net gain = renewing ARR \u00d7 retention \u00d7 (price rise \u2212 churn caused by the rise), calibrated on the 2023 and 2024 price evidence\n- \u2022  Net gain per segment = R \u00d7 g \u00d7 [p \u2212 c \u00d7 (1 + p)]\n- \u2013  R = ARR renewing in 2027: SMB 100% of $21.0M; mid-market 85% of $41.0M = $34.85M; enterprise 40% of $24.0M = $9.6M\n- \u2013  g = share retained over 12 months at the H1 2026 monthly churn rate, (1 \u2212 m)^12\n- \u2013  p = price rise; enterprise capped portion (60%) limited to 7%\n- \u2013  c = extra share of retained ARR lost because of the rise; break-even when c = p/(1+p)\n- \u2022  Sensitivity (c per point of price)\n- \u2013  SMB 0.45%: 2023 +8% added 0.5pp churn for 6 months and 0.1pp for the next 6 = 3.6% \u00f7 8\n- \u2013  Mid-market and enterprise 0.21%: 2024 test conversion 23.1% vs 23.6% = 2.1% relative \u00f7 10\n- \u2013  Promo cohort: SMB \u00d7 2.9 (52% \u00f7 18% citing price)\n- \u2013  Downside: mid-market and enterprise at SMB sensitivity; core SMB \u00d72; promo \u00d71.5\n- \u2022  Simplifications\n- \u2013  All repricing measured as a December 2027 run-rate, regardless of renewal month; this overstates revenue booked within 2027\n- \u2013  Effect of the price rise on new-customer conversion not modelled (no SMB data)\n[Table]\n  | Segment | R, $M | g | Base net, $M (plan B / plan C) |\n  | Core SMB | 16.6 | 77.5% | +0.77 / 0 |\n  | Promo cohort | 4.4 | 54.7% | -0.13 / 0 |\n  | Mid-market | 34.85 | 90.8% | +2.90 / +2.43 |\n  | Enterprise | 9.6 | 97.6% | +0.65 / +0.59 |\n  | Total |  |  | +4.18 / +3.02 |\n[Table]\n  | Other derived figures | Value |\n  | Promo cohort monthly churn | 4.9% |\n  | Promo share of SMB churners | 56% |\n  | Price-cited share implied by mix (reported 34%) | 37% (survey response mix differs) |\n  | Promo ARR lost in 2027 at current churn | $2.0M |\n  | Overall trailing NRR (ARR-weighted) | 109.3% |\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n\n=== Slide 17 ===\n[Title] Appendix A2: The board dashboard's 'monthly churn 1.4% \u2192 2.3%' does not match any weighting of the segment data; restate it\n[Table]\n  | Way of measuring | H1 2025 | H1 2026 | Calculation |\n  | Board dashboard (undefined) | 1.4% | 2.3% | Not stated |\n  | Logo churn, weighted by customers | 1.7% | 2.6% | \u03a3 customers \u00d7 churn \u00f7 7,400 (mid-2026 counts) |\n  | Logo churn, weighted by customers, excluding promo cohort | 1.6% | \u2014 | Base without the 2,100 promo customers |\n  | Churn weighted by ARR | 0.8% | 1.2% | \u03a3 ARR \u00d7 churn \u00f7 $86.0M |\n- Recommendation\n- \u2022  Report churn separately by segment and by cohort (promo vs core), as both logo churn and gross revenue churn, each with a written definition.\n- \u2022  Weighted by customers, SMB dominates the blended figure (80% of customers but 24% of ARR). Weighted by ARR, churn is about 1.2% a month, a much less alarming picture for the board.\n- \u2022  Until the metric is restated, the board's '2.3%' should not be used to judge the price decision.\n- Source: Palisade Docs briefing pack (synthetic data); team analysis.\n"}, {"id": "DXX43J", "case": "c4-pricing-churn", "words": 6201, "doc": "## Part 1 \u00b7 Normalised storyline\n\n**Governing thought:** Raise prices in 2027 where customers stay for the product, and test SMB before touching it\n\n**Executive summary:**\n1. Rising churn comes from the 2025 promotion, not from core customers leaving over price\n2. Mid-market and enterprise are the safer place for a 10% rise at renewal\n3. An SMB rise is a bet on Inkwell: it breaks even at twice the 2023 reaction\n4. The targeted rise adds about $4.3M and keeps the 15% target in reach\n5. Reprice where customers stay in January, and test SMB in Q1\n\n**Slides (title \u2192 claims \u2192 evidence):**\n\n- Slide 1: Pricing in 2027 while churn is rising\n- Slide 2: Key questions\n  - Claim: Should Palisade raise prices in 2027 while churn is rising and, if so, where and by how much, to grow ARR at least 15% with net revenue retention above 100%?\n    - Evidence: Decision maker: CEO, deciding the 2027 pricing plan with the leadership team\n    - Evidence: Success criteria: ARR up at least 15% in 2027, from $86.0M; Net revenue retention above 100% overall; Price changes only at renewal, and within enterprise contract terms\n    - Evidence: Timing: Leadership meeting on the 2027 pricing plan, December 2026\n    - Evidence: Out of scope: New plans or packaging to answer Inkwell; Renegotiating enterprise price caps; The 2027 new-customer sales plan\n    - Evidence: Sub-questions: 1 Is rising churn a sign that customers reject our price? 2 Will mid-market and enterprise customers accept a rise at renewal? 3 Can SMB take a rise now that Inkwell sells at $9? 4 What does each option add to ARR, and does it reach 15%? 5 How should we roll out the rise in 2027?\n- Slide 3: Executive summary\n  - Claim: Raise prices in 2027 where customers stay for the product, and test SMB before touching it\n  - Claim: Rising churn comes from the 2025 promotion, not from core customers leaving over price\n    - Evidence: Other SMB churn is 2.1% a month, from 2.0% a year earlier\n    - Evidence: Better onboarding of the cohort cuts SMB churn by a tenth, not half\n  - Claim: Mid-market and enterprise are the safer place for a 10% rise at renewal\n    - Evidence: A 10% higher price did not slow 2024 mid-market sign-ups\n    - Evidence: Enterprise adds only about $0.8M, as 40% of its ARR renews in 2027\n  - Claim: An SMB rise is a bet on Inkwell: it breaks even at twice the 2023 reaction\n    - Evidence: Our win rate against Inkwell fell from 51% to 38%\n    - Evidence: An 8% rise on non-promotion SMB nets about $0.7M\n  - Claim: The targeted rise adds about $4.3M and keeps the 15% target in reach\n    - Evidence: The 12% plan yields about $7.6M, not $10.3M\n    - Evidence: New customers need to add only about $0.6M of ARR\n  - Claim: Reprice where customers stay in January, and test SMB in Q1\n    - Evidence: The promotion cohort keeps today's price and gets an activation push\n- Slide 4: Churn is a promotion problem\n- Slide 5: Churn is rising because of the 2025 promotion, not because core customers reject our price\n  - Claim: The rise sits in SMB; mid-market moved a little and enterprise not at all\n    - Evidence: 1.1 pp rise in SMB monthly logo churn, H1 2025 to H1 2026\n  - Claim: Inside SMB, the 2025 promotion cohort accounts for the rise\n    - Evidence: 2.1% monthly churn of SMB customers outside the promotion, against 2.0% a year earlier\n  - Claim: Price complaints rose only among promotion customers who lost their discount\n    - Evidence: 18% of non-promotion SMB churners cite price, against 19% of all SMB churners in 2025\n  - Claim: Onboarding helps, but it cannot halve SMB churn as Customer Success expects\n    - Evidence: 41% of promotion customers sent five documents in month one, against 72% of others\n- Slide 6: The churn rise sits in SMB, a segment with 80% of our customers but only 24% of ARR\n  - Claim: SMB: Churn up 1.1 pp; the only real rise\n    - Evidence: SMB: 80% of customers, 24% of ARR, churn H1 2025 2%, H1 2026 3.1%, NRR 94%\n  - Claim: Mid-market: Up 0.2 pp from a low base; cause not yet known\n    - Evidence: Mid-market: 18% of customers, 48% of ARR, churn 0.6% \u2192 0.8%, NRR 112%\n  - Claim: Enterprise: Flat churn and the highest retention\n    - Evidence: Enterprise: 2% of customers, 28% of ARR, churn 0.2% \u2192 0.2%, NRR 118%\n  - Claim: Board figure \"1.4% \u2192 2.3%\": see backup\n- Slide 7: Inside SMB, the rise comes from the promotion cohort, while churn among other SMB customers barely moved\n  - Claim: A third of SMB customers, over half of those who leave\n    - Evidence: Monthly churn: Other SMB H1 2025 2.0%; Other SMB H1 2026 2.1%; Promotion cohort H1 2026 4.9%\n    - Evidence: All SMB, H1 2026 3.1%\n    - Evidence: the cohort is 36% of SMB customers but about 56% of those lost each month\n  - Claim: Promotion cohort: 2,100 customers who joined at 50% off in February\u2013August 2025; most who left did so within two months of the discount ending\n  - Claim: Other SMB: up only 0.1 percentage point in a year, even after Inkwell's $9 plan arrived in October 2025\n  - Claim: estimated monthly churn of the cohort 4.9%; the brief does not report it\n    - Evidence: 103 promotion customers lost a month (183 \u2212 80) \u00f7 2,100 promotion customers still in the base = 4.9%\n    - Evidence: Cohort churn compared with other SMB 2.3x (4.9% \u00f7 2.1%)\n    - Evidence: 183 = 5,900 SMB customers \u00d7 3.1%; 80 = 3,800 other SMB customers \u00d7 2.1%. H1 2026 average rates applied to mid-2026 customer counts\n- Slide 8: The jump in price as an exit reason comes from promotion customers, not from the core SMB base\n  - Claim: Losing the discount, not our list price, drives these exits\n    - Evidence: Share citing price: Promotion churners H1 2026 52%; All SMB churners H1 2026 34%; All SMB churners H1 2025 19%; Other SMB churners H1 2026 18%\n  - Claim: Promotion churners: most left within two months of the 50% discount ending, so \"price\" means paying full price for the first time\n  - Claim: All SMB: the rise is a mix effect, because promotion customers are now about 56% of those who leave (1b)\n  - Claim: Other SMB churners: the share naming price is flat, even with Inkwell's cheaper plan on the market\n    - Evidence: Exit survey: share of churned customers who answered; response rates are not given in the briefing pack\n- Slide 9: Weak activation explains only about 30% of the promotion cohort's extra churn\n  - Claim: Weak activation explains only about 30% of the promotion cohort's extra churn\n    - Evidence: 0.8 pp extra churn weak activation predicts: 2.9% at 41% active, with inactive customers churning 3 times as often, less 2.1%\n    - Evidence: 2.8 pp extra churn the cohort shows: about 4.9% (1b) less 2.1% for other SMB customers\n    - Evidence: 0.8 pp \u00f7 2.8 pp = 30% share of the cohort's extra churn that onboarding could reach\n  - Claim: The estimate is generous to onboarding\n    - Evidence: Customers sending fewer than five documents in month one churn about three times as often as the rest, in both cohorts\n    - Evidence: Other SMB customers' 2.1% churn, with 72% active, sets the churn of each activation group\n    - Evidence: Activating promotion customers now works as well as in their first month, which flatters the programme\n  - Claim: The remaining 2 percentage points most likely reflect the end of the discount\n    - Evidence: 52% of promotion churners name price (1c)\n- Slide 10: Lifting the promotion cohort to other customers' activation would cut SMB churn by a re of those lost \u00d7 18% of other SMB churners who name price = 37%\n  - Claim: A cross-check, not a second estimate\n    - Evidence: The exit survey reports 34% for all SMB churners in H1 2026; the implied share is within a few percentage points\n    - Evidence: The gap can come from different response rates in the two groups, which the brief does not give\n  - Claim: A cohort churning far less than about 4.9% a month could not produce the jump from 19% to 34%\n- Slide 38: Backup: Contract terms, not list prices, decide when a 2027 price change can land in each segment\n  - Claim: Contract terms, not list prices, decide when a 2027 price change can land in each segment\n    - Evidence: SMB: 1\u201350 employees, self-serve; Monthly or annual plans; All of it renews in 2027; At renewal; list price $15 per user a month\n    - Evidence: Mid-market: 51\u20131,000 employees; Annual contracts; 85%; At renewal; 10% tested on new sign-ups in 2024\n    - Evidence: Enterprise: Over 1,000 employees; Mostly multi-year; 40%; Own terms; 60% of ARR capped at 7% a year\n    - Evidence: Segment definitions and renewal shares from the briefing pack, \u00a75 and \u00a78\n- Slide 39: Backup: The SMB rise stays positive up to about twice the 2023 reaction and loses ARR beyond it\n  - Claim: The SMB rise stays positive up to about twice the 2023 reaction and loses ARR beyond it\n    - Evidence: Same as 2023: lost $0.6M, net $0.7M; Base case (3c)\n    - Evidence: 1.5 times 2023: lost $0.97M, net $0.4M; Still positive\n    - Evidence: Twice 2023: lost $1.3M, net $0.04M; About break-even\n    - Evidence: Three times 2023: lost $1.9M, net \u2212$0.6M; Loses ARR\n    - Evidence: $1.3M price gain: 8% on $16.6M, the same in every row \u2212 $0.6M loss at the 2023 reaction, times the row's multiple = $0.7M\n- Slide 40: Backup: The path to the 15% target rests on assumptions the CFO should confirm before December\n  - Claim: The path to the 15% target rests on assumptions the CFO should confirm before December\n    - Evidence: Growth objective 15%: Brief: at least 15% in 2027, from $86.0M\n    - Evidence: SMB retention 94%: Trailing 12 months; the brief does not say how much promotion churn it holds\n    - Evidence: Mid-market retention 112%: Trailing 12 months; each point is worth $0.41M\n    - Evidence: Enterprise retention 118%: Trailing 12 months; may already hold contract escalators\n    - Evidence: Mid-market renewing in 2027 85%: Brief; all price changes apply at renewal\n  - Claim: If enterprise retention already includes annual escalators, the enterprise price gain of about $0.8M is partly counted twice\n- Slide 41: Backup: Net of the SMB reaction seen in 2023, the 12% plan would add about $6.3M of ARR in 2027\n  - Claim: Net of the SMB reaction seen in 2023, the 12% plan would add about $6.3M of ARR in 2027\n    - Evidence: $7.6M ARR gain at renewal before churn (4a) \u2212 $1.3M SMB ARR lost: the 2023 reaction scaled to 12%, 5.4% more customers lost on $23.5M = $6.3M net gain at the 2023 reaction\n  - Claim: The 12% plan beats the targeted rise only while SMB reactions stay mild\n    - Evidence: SMB's reaction scales with the size of the rise: 12% against 8% in 2023\n    - Evidence: At 2.6 times the 2023 reaction, the 12% plan falls below the targeted $4.3M\n    - Evidence: The promotion cohort is repriced too, though it already churns at about 4.9% a month\n    - Evidence: Lost SMB deals to Inkwell from a higher list price are not counted\n- Slide 42: Next steps\n\n**Recommendation:** Targeted rise (Recommended): approve 10% at mid-market and enterprise renewals, 7% where capped; hold SMB at $15 and test 8% on a random half of non-promotion SMB renewals in Q1 2027, extending to all non-promotion SMB if extra churn stays under about 1 pp a month (otherwise hold at $15 and study packaging); keep the promotion cohort at today's price with an activation push; put churn by segment and cohort on the board dashboard.\n\n**Alternatives considered:**\n- 12% on every plan (the CFO's plan): Not chosen. Yields about $7.6M of ARR in 2027, not the $10.3M quoted; nets about $6.3M at the 2023 reaction, less than $4.3M beyond 2.6 times it; reprices $21M of SMB ARR before we know how SMB reacts; would put SMB plan at 1.9 times Inkwell's price. 'The 12% plan nets more only if SMB reacts mildly; the targeted rise avoids that bet.'\n- Targeted rise: Recommended: $4.3M ARR gain, $0.6M left to new customers; 'Prices where customers stay; tests SMB before betting on it'.\n- No price rise: Not chosen: 'Leaves the whole gap to new sales'; $4.9M new ARR needed.\n- 8% SMB rise on non-promotion SMB: Not in base plan; to be tested in Q1 2027. Nets about $0.7M at the 2023 reaction and breaks even at about twice that; extend if test passes.\n- 12% instead of 10% in mid-market: Noted: about $0.7M more, beyond the level tested.\n- Onboarding programme to halve SMB churn (Customer Success expectation): Onboarding is worth doing, but it is not the fix: lifting the cohort to other customers' activation cuts SMB churn by about a tenth, not half.\n- Cheaper SMB entry plan: Left out on purpose: packaging is out of scope and the brief has no plan economics; it is the fallback if the SMB test fails.\n- Renegotiating enterprise 7% caps: Left out: contracts follow their own terms; changing them is outside the 2027 pricing plan.\n- New-customer sales closing the 15% gap without a price rise: Left out: the 2027 sales plan is not in the brief; the bridge shows what it must deliver.\n\n**Assumptions and uncertainties:**\n- Synthetic benchmark data: the company and all figures are fictional\n- Cohort churn of 4.9% is a team estimate; the brief does not report it. H1 2026 average rates applied to mid-2026 customer counts\n- Exit survey response rates are not given in the briefing pack\n- Activation estimate is generous to onboarding: assumes activating promotion customers now works as well as in their first month\n- Mid-market renewals are untested; the 2024 test covered new sign-ups only and the \u22122.1% conversion change was not statistically significant\n- Mid-market churn rose from 0.6% to 0.8%; cause not yet known\n- Mid-market deals at 200 seats or fewer are not covered by the Inkwell-absent finding\n- Share of enterprise ARR under 7% caps assumed the same among renewals\n- No price test covered enterprise; the case rests on 118% retention, 0.2% monthly churn and the advisory board finding\n- 2023 SMB reaction is a floor for 2027, not a forecast, since no rival sold a $9 plan in 2023\n- SMB case: each extra lost customer counts at a full year of ARR, which overstates the loss; effects on new-customer win rates left out\n- How Inkwell changed existing customers' reaction is unknown\n- Assumes 2027 retention equals the trailing 12 months and that trailing retention holds no list-price rise (none recorded since 2023)\n- If retention slips a point, new customers would need to bring about $1.5M; the 2027 sales plan is not in the briefing\n- SMB retention of 94%: the brief does not say how much promotion churn it holds\n- Enterprise retention may already hold contract escalators; if so the ~$0.8M enterprise gain is partly counted twice\n- Net retention headroom holds if mid-market and enterprise keep today's rates\n- Risks: mid-market renewals react more than 2024's new sign-ups; Inkwell reaches accounts of 200 seats or fewer; SMB test misread due to too few renewals; promotion cohort keeps leaving at about 4.9% a month\n- Board dashboard churn figure '1.4% \u2192 2.3%' is undefined and matches neither segment-weighted average\n\n**Next steps:**\n- Approve 10% at mid-market and enterprise renewals, 7% where capped \u2014 CEO and leadership team \u2014 Dec 2026\n- Launch the SMB renewal test on half of non-promotion renewals \u2014 CFO with SMB product lead \u2014 Jan 2027\n- Hold the promotion cohort's price and start its activation push \u2014 Head of Customer Success \u2014 Jan 2027\n- Put churn by segment and cohort on the board dashboard \u2014 CFO \u2014 Q1 2027 board\n- Decide the SMB rollout on the test read \u2014 CEO and CFO \u2014 Apr 2027\n- Confirm a 2027 new-business plan of at least $1.5M of ARR, so the target survives a weaker year\n- CFO to confirm the assumptions behind the path to the 15% target before December\n\n## Part 2 \u00b7 Full slide text (mechanical extraction)\n\n=== Slide 1 ===\n[Title] Pricing in 2027 while churn is rising\n- Discussion document for the CEO and leadership team\n- Palisade Docs\n- CEO and leadership team\n- 2026-11-15\n- Synthetic benchmark data: the company and all figures are fictional\n\n=== Slide 2 ===\n[Title] Key questions\n- Should Palisade raise prices in 2027 while churn is rising and, if so, where and by how much, to grow ARR at least 15% with net revenue retention above 100%?\n\n- Is rising churn a sign that customers reject our price?\n\n- Will mid-market and enterprise customers accept a rise at renewal?\n\n- Can SMB take a rise now that Inkwell sells at $9?\n\n- What does each option add to ARR, and does it reach 15%?\n\n- How should we roll out the rise in 2027?\n- Decision maker\n- Success criteria\n- Timing\n- Out of scope\n- CEO, deciding the 2027 pricing plan with the leadership team\n- ARR up at least 15% in 2027, from $86.0M; Net revenue retention above 100% overall; Price changes only at renewal, and within enterprise contract terms\n- Leadership meeting on the 2027 pricing plan, December 2026\n- New plans or packaging to answer Inkwell; Renegotiating enterprise price caps; The 2027 new-customer sales plan\n\n=== Slide 3 ===\n[Title] Executive summary\n- Raise prices in 2027 where customers stay for the product, and test SMB before touching it\n\n- Rising churn comes from the 2025 promotion, not from core customers leaving over price\n- \u2013\tOther SMB churn is 2.1% a month, from 2.0% a year earlier\n- \u2013\tBetter onboarding of the cohort cuts SMB churn by a tenth, not half\n\n- Mid-market and enterp ter the SMB churn reaction, $ millions, team estimate\n- \u2212\n- =\n- $7.6M\n- $1.3M\n- $6.3M\n- ARR gain at renewal before churn (4a)\n- SMB ARR lost: the 2023 reaction scaled to 12%, 5.4% more customers lost on $23.5M\n- net gain at the 2023 reaction\n- The 12% plan beats the targeted rise only while SMB reactions stay mild\n- \u25aa\tSMB's reaction scales with the size of the rise: 12% against 8% in 2023\n- \u25aa\tAt 2.6 times the 2023 reaction, the 12% plan falls below the targeted $4.3M\n- \u25aa\tThe promotion cohort is repriced too, though it already churns at about 4.9% a month\n- \u25aa\tLost SMB deals to Inkwell from a higher list price are not counted\n- Sources: Palisade Docs briefing pack (synthetic data); team analysis\n\n=== Slide 42 ===\n[Title] Next steps\n- Action\n- Owner\n- Timing\n- Approve 10% at mid-market and enterprise renewals, 7% where capped\n- CEO and leadership team\n- Dec 2026\n\n- Launch the SMB renewal test on half of non-promotion renewals\n- CFO with SMB product lead\n- Jan 2027\n\n- Hold the promotion cohort's price and start its activation push\n- Head of Customer Success\n- Jan 2027\n\n- Put churn by segment and cohort on the board dashboard\n- CFO\n- Q1 2027 board\n\n- Decide the SMB rollout on the test read\n- CEO and CFO\n- Apr 2027\n\n"}, {"id": "DZ9GNW", "case": "c4-pricing-churn", "words": 3008, "doc": "## Part 1 \u00b7 Normalised storyline\n\n**Governing thought:** Yes, raise prices in 2027, but only for mid-market and enterprise. Hold SMB, test it, and fix the promotion cohort with onboarding, not price\n\n**Executive summary:**\n1. Churn is rising in one place. About 90% of the SMB rise (2.0% \u2192 3.1% a month) comes from the 2,100 customers who joined on the 2025 half-price promotion. Other SMB customers moved from 2.0% to 2.1%.\n2. The promotion cohort is an onboarding problem. Only 41% got started properly (72% for other cohorts), and most leavers went within two months of the discount ending.\n3. Mid-market and enterprise can take an increase. Their NRR is 112% and 118%, a +10% list test had no significant effect on conversion, and Inkwell is absent above 200 seats.\n4. SMB is the open question. Inkwell sells at $9 against our $15. A 12% SMB increase adds about $1.2M if customers react as they did in 2023, and nothing if they react twice as strongly.\n5. The CFO's $10.3M is $7.6M before any churn response, because only part of the ARR renews in 2027 and enterprise increases are capped.\n6. Mid-market: +10% list price at renewal (the tested level).\n7. Enterprise: up to the 7% cap where contracts cap increases; up to +10% elsewhere.\n8. SMB: hold $15 in H1 and split-test +8% in Q1. Extend it to H2 renewals only if churn holds.\n9. Promotion cohort: no increase. Run an onboarding programme aimed at returning it to normal SMB churn.\n10. $4.3M ARR from price, plus up to $0.7M if the SMB test passes; ~114% overall NRR (target above 100%); +14.2% growth from existing customers. About $0.6M of new-customer ARR reaches 15%\n11. Trade-off: on paper this is $0.8\u20132.0M less 2027 ARR than the CFO's plan. In return, we avoid betting the 5,900-customer SMB base on a reaction we have not measured.\n\n**Slides (title \u2192 claims \u2192 evidence):**\n\n- Slide 1: Raise prices in 2027 where we have pricing power, and hold SMB until we have tested it\n  - Claim: Recommendation to the CEO and leadership team for the December 2026 pricing decision\n    - Evidence: Prepared November 2026 from the internal briefing pack only. No outside research was used.\n    - Evidence: All company figures are synthetic benchmark data. ARR figures are $M; churn is monthly logo churn unless stated.\n- Slide 2: Yes, raise prices in 2027, but only for mid-market and enterprise. Hold SMB, test it, and fix the promotion cohort with onboarding, not price\n  - Claim: Churn is rising in one place. About 90% of the SMB rise comes from the 2,100 customers who joined on the 2025 half-price promotion.\n    - Evide
