re in the last six months, September 2026\n- Slide 13: Mooncrest, the one recent retail-first K-beauty entrant, was off the shelves within two years at a $21M loss\n  - Claim: Mooncrest launched retail-first in 450 doors\n    - Evidence: Entered the US in 2023 on a retail-first route\n    - Evidence: Launched in 450 specialty-retail doors at once\n    - Evidence: Removed from shelves in 2025\n    - Evidence: Estimated cumulative US loss of $21M, more than the board's $18M cap\n  - Claim: Option B would repeat the pattern at a larger scale\n    - Evidence: 600 doors in 2027, a third more than Mooncrest's launch\n    - Evidence: 1.3x Option B's 2027 doors compared with Mooncrest's\n    - Evidence: Onsoo would start at 4% awareness, where newcomers sell a median 2.6 units per door per week\n    - Evidence: The leading retailer reviews after 12 months and removes brands below 4.0\n    - Evidence: $7.5M a year of retail marketing and field sales is spent before that review\n- Slide 14: The 1.3 times Amazon halo rests on a correlation that cannot show retail causes Amazon sales\n  - Claim: Option B lifts every year's Amazon units by the halo\n    - Evidence: Applied to every year, 2027\u201330\n    - Evidence: Adds 843,000 Amazon units over four years\n    - Evidence: Worth $4.0M of contribution in the cash case (2c)\n    - Evidence: 1.3x Amazon volume multiple in Option B\n  - Claim: Its only evidence is a 0.71 correlation across 30 brands\n    - Evidence: The board member's memo links doors to Amazon sales, brand by brand\n    - Evidence: Compares brands at one moment, not before and after a retail launch\n    - Evidence: Larger, older brands have both more doors and more Amazon sales\n    - Evidence: Cause can run the other way: retailers take brands that already sell\n  - Claim: The one Amazon-first success added doors after it scaled\n    - Evidence: Saebom added 300 doors only in 2025, after scaling online\n    - Evidence: $30M Saebom US revenue, 2025\n    - Evidence: Its doors followed its Amazon sales, not the reverse\n  - Claim: Onsoo can test a halo later by tracking Amazon sales around a small retail test\n- Slide 15: Retail's extra costs are 3.5 times its extra contribution, turning Option A's $2.4M surplus into a $20.8M cash need\n  - Claim: The national marketing budget sinks the case\n    - Evidence: Waterfall, $M: Retail marketing and field sales 30; Launch fee and fixtures 1.6; Extra inventory 0.875; Retail contribution 5.297; Amazon halo 3.983; Option A surplus 2.398; Option B cash need 20.796\n    - Evidence: 3.5x dollars of extra cost for every dollar of extra contribution, 2027\u201330\n    - Evidence: Marketing and field sales: $7.5M a year; at 600 doors they need 31.9 units per door per week to pay for themselves, 7.1 times the plan\n  - Claim: Amazon halo: counted in full at 1.3 times, though its only basis is a correlation (2b)\n- Slide 16: Option B would hold group margin below the 8% floor for three years, with a low of 4.5% in 2027\n  - Claim: Option B's first-year loss is far beyond what the floor absorbs\n    - Evidence: Group operating margin 2027\u201330: Option A 0.0945; 0.1042; 0.1081; 0.111; Option B 0.0446; 0.0662; 0.0747; 0.0822; Board floor 8.0%\n    - Evidence: 2027: Option B's US operating loss of $8.7M is 2.6 times the $3.3M the floor can absorb\n    - Evidence: 2027\u201330: Option B loses $18.2M of operating profit over four years and never breaks even\n  - Claim: Option A: costs the group 1.55 percentage points of margin in 2027 and stays well clear of the floor\n    - Evidence: Group excluding the US: $140M\u2013$158M of planned revenue at an 11.0% operating margin\n- Slide 17: The US prize\n- Slide 18: The Amazon-led route meets the cash, payback and margin tests on plan, and gets two-thirds of the way to the ambition\n  - Claim: US K-beauty buyers shop on Amazon most, though they find new brands on TikTok\n    - Evidence: 61% of K-beauty buyers buy K-beauty on Amazon most often\n  - Claim: Every Amazon unit earns a contribution after fees, product cost and ads\n    - Evidence: $4.7 contribution per unit at the plan's 25% ACoS\n  - Claim: Cash need peaks at $1.9M and is repaid within 2030, with group margin above 9% every year\n    - Evidence: 66% of the $40M ambition reached by 2030 US revenue\n- Slide 19: Amazon is where US K-beauty buyers shop, but TikTok is where they find new brands\n  - Claim: Amazon takes 41% of US K-beauty skincare sales\n    - Evidence: Share of sales 2025: Amazon 0.41; Specialty beauty 0.27; Mass retail 0.14; Brand websites 0.12; Other 0.06\n  - Claim: 61% of K-beauty buyers buy it on Amazon most often\n    - Evidence: Share of buyers 2026: Amazon 0.61; Specialty beauty 0.22\n  - Claim: TikTok leads discovery, at more than twice the rate of stores\n    - Evidence: Where they found their last new brand: TikTok 0.38; In a store 0.17\n  - Claim: Lead with Amazon for sales, and keep the $0.7M a year off-Amazon budget for TikTok and influencers, where discovery happens\n- Slide 20: Each Amazon unit keeps about $4.7 after fees, product cost and ads, roughly a fifth of its $24 price\n  - Claim: Advertising is the cost Onsoo controls\n    - Evidence: $ per unit: Price 24; Referral fee 3.6; FBA fee 5.1; Advertising 6; Product cost 3.5; Freight 0.55; Duty 0.525; Contribution 4.725\n    - Evidence: Advertising: the largest single cost; each percentage point of ACoS costs 24 cents a unit\n  - Claim: Amazon fees: referral and FBA fees take 36% of the price, and Onsoo cannot change them\n  - Claim: Break-even: a unit still contributes up to 44.7% ACoS, but repaying the fixed costs needs far less (4a)\n    - Evidence: Duty at 15% of the $3.50 ex-factory cost. The planning team applies the hero product's per-unit economics to all SKUs\n- Slide 21: Only Option A stays inside the $18M cash cap and pays back by 2030, with a peak cash need of $1.9M\n  - Claim: Option A's downside is small; Option B's keeps growing\n    - Evidence: Cumulative ive cash end-2030 $M by ACoS: 25%, plan 2.398; 28%, pilot 0.376; 32%, benchmark median -2.322; 38%, benchmark high -6.368\n    - Evidence: $0.7M of cumulative cash by 2030 for each percentage point of ACoS\n  - Claim: Plan, 25%: assumes ACoS falls as the brand matures, but costs per click rise as brands bid on broader keywords\n  - Claim: Benchmark, 32%: the median for skincare brands growing from $5M to $20M a year, the band Option A crosses in 2027\u201329\n    - Evidence: ACoS benchmark: agency data for skincare brands scaling from $5M to $20M a year on Amazon US (median 32%, range 26%\u201338%)\n- Slide 26: Payback by 2030 holds only while ACoS stays at or below 28.6%, barely above what the small pilot achieved\n  - Claim: Break-even ACoS for payback by end-2030 is 28.6%\n    - Evidence: ($30.1M contribution before ads, 2027\u201330: 2,810,000 units at about $10.7 \u2212 $10.9M fixed costs, setup and inventory to repay by end-2030) \u00f7 $67.4M Amazon sales, 2027\u201330, at $24 a unit = 28.6%\n  - Claim: The ceiling holds the plan's volumes and costs fixed\n    - Evidence: Volumes as planned: 300,000 Amazon units in 2027 rising to 1,100,000 in 2030\n    - Evidence: Fixed US costs of $2.1M a year plus $0.8M of setup in 2027\n    - Evidence: Inventory at four months of landed product cost\n    - Evidence: Duty at today's 15%; at 25% the ceiling falls to 26.9% (4b)\n    - Evidence: The pilot ran at 28% ACoS on a small budget; the agency median for brands at this scale is 32%\n- Slide 27: Even with a higher tariff and benchmark ad costs, peak cash need would stay at $3.9M, a fifth of the cap\n  - Claim: Decision expected in mid-2027\n    - Evidence: 35 cents less contribution per Amazon unit if duty rises from 15% to 25%\n    - Evidence: Charged on the $3.50 ex-factory cost only\n    - Evidence: Lowers the ACoS ceiling from 28.6% to 26.9%\n    - Evidence: $3.5 ex-factory cost \u00d7 10 pp extra duty = 35 cents less contribution per unit\n  - Claim: Payback narrowl ional retail, and cap ad costs at 28.6% of sales so the launch pays back by 2030. The board is asked to approve three decisions at its March 2027 meeting: (1) Approve the Amazon-led US entry for 2027; (2) Hold the launch to four gates (ad cost ACoS ceiling, sales pace, tariff, retail trigger); (3) Restate the $40M ambition as a goal beyond 2030. Open retail only above 20% awareness, raising the CEO's retail trigger from 15%.\n\n**Alternatives considered:**\n- Option A \u00b7 Amazon-led US entry: Recommended: passes on plan; payback needs ACoS at or below 28.6%. Peak cash need $1.9M; 2030 US revenue $26.4M (66% of $40M ambition).\n- Option B \u00b7 Retail-led (national specialty-retail launch, 600 doors): Reject: breaks the cap and the floor even on its own plan. Peak cash need $20.8M; group margin 4.5% in 2027; sell-through at 4% awareness 2.6 units/door/week vs 4.0 cut-off; 1.3x Amazon halo rests on a correlation.\n- Option J \u00b7 Japan scale-up: Safe, but builds no US business; adds $7.0M of revenue by 2030 and $1.8M of operating profit at low risk. Held back under the one-launch rule.\n- CEO's initial hypothesis (retail trigger at 15% awareness, ACoS falling to 25%, cross-border seller, $40M by 2030, duty fixed at 15%): Plan keeps the CEO's Amazon-first idea but raises the retail trigger to 20%, sets a 28.6% ACoS ceiling, moves to own US entity, adds a stall case and end-2027 review, restates ambition to $26.4M by 2030 / $40M after retail, re-runs case after tariff decision.\n- DTC-led or mass-retail entry: Left out on purpose: not modeled by the planning team; DTC is 12% and mass retail 14% of K-beauty skincare sales.\n- Small specialty-retail test in 2027: Left out: no cost or door data for a small test; it returns at the 20% awareness trigger.\n- Exchange-rate (weaker won) scenario: Left out: outside management's control and only an upside; the pack gives no FX path.\n\n**Assumptions and uncertainties:**\n- Payback hinges on ad cost: ACoS must stay at or below 28.6%; at the 32% benchmark, cumulative cash ends 2030 at \u2212$2.3M; each percentage point of ACoS moves cumulative cash by $0.7M\n- Plan's 25% ACoS assumes ACoS falls as the brand matures, but costs per click rise as brands bid on broader keywords; agency median at this scale is 32% (range 26%\u201338%)\n- US tariff decision expected mid-2027; a rise from 15% to 25% duty cuts 35 cents per unit and lowers the ACoS ceiling to 26.9%; duty applied at 25% from 2027 as the harsher case\n- Sales could stall, as for two of three Amazon-first peers; stall case at the June 2026 pace would cost $6.8M by 2030 (our estimate, sales flat at 12 \u00d7 the June 2026 pilot month)\n- The ACoS ceiling holds the plan's volumes and costs fixed\n- The planning team applies the hero product's per-unit economics to all SKUs\n- Only inventory counts as working capital: the pack gives no Amazon payout lag or receivables; one-time costs run through operating profit; inventory is not released in 2030\n- The briefing pack gives no working capital for Japan; Option J peak cash need is its 2027 operating loss\n- Amazon halo of 1.3x rests on a cross-brand correlation (0.71 across 30 brands); no cause shown\n- Repeat rate: unclear whether more SKUs raise it; track it from the first 2027 cohort\n- The four SKUs added in 2027 will need to match the 4.5-star rating\n- 2027 plan of 300,000 units needs 1.8 times the June pilot pace, with seven SKUs instead of three\n- Out of scope: markets other than the US and Japan; routes not modeled (DTC-led, mass retail); exchange-rate scenarios\n- Five figures in the board material need correcting before the board relies on them ($5.2B market, 4.5 sell-through, 1.3x halo, 25% ACoS, 15% awareness trigger)\n\n**Next steps:**\n- Approve the Amazon-led US entry and a cash envelope sized to the $3.9M worst-case peak \u2014 CEO and board \u2014 March 2027\n- Set up the US entity, MoCRA registration and English labels; take over the pilot listings \u2014 US lead (to be appointed) and COO \u2014 Q2 2027\n- Rebuild the 2027 ad plan around a 28.6% ACoS ceiling and report ACoS every quarter \u2014 US lead and CFO \u2014 From Q3 2027\n- Re-run the case on the US tariff decision \u2014 CFO \u2014 Mid-2027\n- Survey aided awareness every year; bring a retail case only above 20% \u2014 CMO \u2014 From 2028\n\n## Part 2 \u00b7 Full slide text (mechanical extraction)\n\n=== Slide 1 ===\n[Title] Entering the US market\n- Should Onsoo enter the US in 2027, and by which route? Discussion document for the CEO and board\n- Onsoo Botanicals\n- CEO and board\n- 2026-11-15\n- Synthetic benchmark data: company and figures are fictional\n\n=== Slide 2 ===\n[Title] Key questions\n- Should Onsoo enter the US market in 2027, and if so, by which route, within $18M of peak cash and with payback by 2030?\n\n- Is the US a better use of the one 2027 launch than a Japan scale-up?\n\n- Does a national specialty-retail launch in 2027 meet the board's tests?\n\n- Does an Amazon-led launch meet the board's tests?\n\n- Does the Amazon case hold if ad costs, tariffs or sales growth go against plan?\n\n- How should Onsoo launch, and what would make it change course?\n- Decision maker\n- Success criteria\n- Timing\n- Out of scope\n- CEO and board of Onsoo Botanicals, choosing the 2027 new-market launch\n- A US business on the way to $40M of revenue by 2030; Peak negative cumulative US cash of no more than $18M through 2030; Cumulative US cash back to zero by the end of 2030; Group operating margin at or above 8% in every year; Only one major new-market launch in 2027\n- Board meeting, March 2027\n- Markets other than the US and Japan; Routes the planning team did not model (DTC-led, mass retail); Exchange-rate scenarios\n\n=== Slide 3 ===\n[Title] Executive summary\n- Enter the US in 2027 through Amazon, not national retail, and cap ad costs at 28.6% of sales so the launch pays back by 2030\n\n- The US is the better use of the one 2027 launch, and Onsoo products ng cost of sales (ACoS) at or below 28.6% (plan 25%, pilot 28%, median brand at this scale 32%) and volumes near plan (at 80% of plan it only just pays back). At 32% ACoS A misses payback (\u2013$2.3M at end-2030), but the worst combined case we modelled peaks at $4.6M and the margin floor always holds.\n9. No route reaches $40M by 2030.\n10. A reaches $26M in 2030. B's $38M rests on the inflated inputs; corrected it is about $28M. $40M should be the goal of a gated second phase in specialty retail, which comes back to the board as its own investment case.\n11. Decisions requested in March 2027: (1) approve Option A as Onsoo's single 2027 launch; (2) approve a US cash envelope of $5M through 2030, enough for 80% of plan volume with 32% ACoS and a 25% duty (\u2013$4.6M peak), with anything beyond returning to the board; (3) decline the 600-door retail launch; (4) adopt tighter gates for specialty retail, including aided awareness above 20%, not 15%; (5) re-base the plan at 30\u201332% ACoS rather than 25%.\n\n**Slides (title \u2192 claims \u2192 evidence):**\n\n- Slide 1: US market entry in 2027: launch Amazon-led, and earn the right to specialty retail\n  - Claim: Should Onsoo enter the US market in 2027, and if so, by which route? Recommendation for CEO Park Ji-won and the Board, for decision at the March 2027 board meeting.\n  - Claim: Built only from the planning team's briefing pack (synthetic data). All figures in US dollars at KRW 1,380 per dollar; years are calendar years; \"cash\" means cumulative US cash flow.\n- Slide 2: Enter the US in 2027 through Amazon, reject the 600-door retail launch, and hold Japan for later\n  - Claim: The opportunity is real and it is on Amazon.\n    - Evidence: US K-beauty facial skincare reached $3.6B in 2025, growing 17% a year against 5% for the category; 41% of it sells on Amazon\n    - Evidence: Onsoo's cross-border pilot was running at about $4M a year by June 2026 on three SKUs, rated 4.5 stars\n  - Claim: Amazon-led (A) e cash and margin tests; no option reaches $40M by 2030\n  - Claim: Revenue by 2030 (ambition $40M): A \u25d0, B \u25d0, J \u2717\n    - Evidence: A $26.4M / Short of $40M; growing 29% in 2030\n    - Evidence: B $37.6M / Depends on optimistic inputs; ~$28M corrected\n    - Evidence: J $7.0M / Japan revenue; builds no US business\n  - Claim: Peak cash need (cap $18M): A \u2713, B \u2717, J \u2713\n    - Evidence: A $1.9M in 2027\n    - Evidence: B $20.8M / Cap breached in 2029; still rising in 2030\n    - Evidence: J $1.1M in 2027\n  - Claim: Payback by end-2030: A \u25d0, B \u2717, J \u2713\n    - Evidence: A +$2.4M in 2030 / Needs ACoS \u2264 28.6% and volume near plan\n    - Evidence: B \u2013$20.8M / 2030 cash flow still \u2013$1.9M\n    - Evidence: J +$1.8M by 2030 / Cumulative cash positive from 2029\n  - Claim: Group margin \u2265 8% every year: A \u2713, B \u2717, J \u2713\n    - Evidence: A lowest 9.5% (2027)\n    - Evidence: B 4.5% / 6.6% / 7.5%; below the floor in 2027, 2028 and 2029\n    - Evidence: J lowest 10.1% (2027)\n  - Claim: One major launch in 2027: all use the slot\n    - Evidence: J: US entry slips to 2028 or later\n  - Claim: A passes three tests and is at risk on two (ambition, payback). B fails three tests even on its own inputs. J passes the financial tests but builds no US business.\n  - Claim: We read the ambition as $40M of revenue in 2030; on a looser \"trajectory\" reading, A and B would be closer to passing.\n- Slide 7: On the planning team's own numbers, retail-led entry breaches the $18M cap in 2029 and never pays back\n  - Claim: Cumulative cash flow by option at end-2030\n    - Evidence: A +$2.4M\n    - Evidence: J +$1.8M\n    - Evidence: B \u2013$18.9M in 2029; \u2013$20.8M in 2030\n    - Evidence: Board cap: \u2013$18M\n  - Claim: Fixed cost is $9.6M a year for B against $2.1M for A\n    - Evidence: $6.0M of national retail marketing and $1.5M of field sales\n  - Claim: B's retail doors add about $1.1M of contribution a year at chmark median: 32% -2.3 ($3.2M; 9.1%)\n    - Evidence: Benchmark high: 38% -6.4 ($6.4M; 8.8%)\n    - Evidence: 80% of plan volume +0.1 ($2.4M; 9.4%)\n    - Evidence: 70% of plan volume -1.1 ($2.8M; 9.3%)\n    - Evidence: 32% ACoS + 25% duty -3.4 ($3.9M; 9.0%)\n    - Evidence: 80% volume + 32% + duty -4.6 ($4.6M; 9.0%)\n  - Claim: Ad cost: the plan's 25% runs against the evidence.\n    - Evidence: Cost per click rises as brands bid on broader keywords; the median brand scaling from $5M to $20M runs at 32%\n    - Evidence: Payback needs \u2264 28.6% (26.9% with a 25% duty)\n    - Evidence: agency benchmark median ACoS 32%, range 26\u201338%\n  - Claim: Volume: the plan is a stretch.\n    - Evidence: 2027 is 1.8\u00d7 the June pilot run-rate and pilot growth slowed to ~9% a month\n    - Evidence: At 80% of plan volume A only just pays back (+$0.1M); at 70% it misses\n  - Claim: The downside is bounded.\n    - Evidence: The worst combination shown peaks at $4.6M; 38% ACoS peaks at $6.4M, about a third of the cap\n    - Evidence: Group margin stays at 8.8% or above in every case\n  - Claim: Tariff cases apply a 25% duty from 2027 although the decision is due in mid-2027, so they are slightly conservative.\n- Slide 11: No option reaches $40M by 2030; Amazon-led gets two-thirds of the way for under a tenth of B's cash\n  - Claim: Revenue in 2030 vs $40M ambition\n    - Evidence: A $26.4M\n    - Evidence: B plan inputs $37.6M\n    - Evidence: B corrected $28.3M\n    - Evidence: J $7.0M\n  - Claim: Peak cash need, 2027\u201330 vs $18M cap\n    - Evidence: A $1.9M\n    - Evidence: B plan inputs $20.8M\n    - Evidence: B corrected $26.4M\n    - Evidence: J $1.1M\n  - Claim: B's extra revenue over A comes mostly from the 1.3\u00d7 halo; corrected, B adds $1.9M of 2030 revenue over A.\n  - Claim: A's peak need is $1.9M on plan and $3.2M at 32% ACoS; B needs $20.8\u201326.4M.\n- Slide 12: A Japan scale-up is the safe option but a small one: $7M of revenue by 2030 in a market growing 1.5% a year\n  - Claim: A vs J, 2027\u201330\n    - Evidence: Revenue in 2030: A $26.4M, up 29% on 2029; J $7.0M, up 17% on 2029\n    - Evidence: Operating profit in 2030: A $3.1M ($1.2M at 32% ACoS); J $1.3M\n    - Evidence: Cumulative cash, end-2030: A +$2.4M (\u2013$2.3M at 32% ACoS); J +$1.8M\n    - Evidence: Peak cash need: A $1.9M ($3.2M at 32% ACoS); J $1.1M\n    - Evidence: Market growth: US K-beauty skincare +17% a year; Japan facial skincare ~1.5% a year\n    - Evidence: Starting position: A new entrant, ~$4M pilot run-rate; J known market and retailers, 3.1% share\n    - Evidence: Strategic value: A starts the US business the $40M ambition needs; J extends an existing position, no progress on the US\n  - Claim: J is lower-risk, and at 32% ACoS it beats A on cash to 2030\n    - Evidence: +$1.8M vs \u2013$2.3M\n  - Claim: But it caps Onsoo at $7M of new revenue in a slow-growing market, while A builds a business nearly four times larger in a market growing 17% a year.\n    - Evidence: 1.5% a year\n  - Claim: The bandwidth limit applies to 2027, so Japan can return as a 2028 decision.\n  - Claim: Amazon-first is no guarantee.\n    - Evidence: Of three K-beauty brands that entered Amazon-first, one (Saebom) reached ~$30M by 2025; two stayed below $5M\n    - Evidence: Onsoo's pilot is already near $4M a year, so the gates and triggers on slides 13\u201314 are what protect the board against a Gaon Lab or Yeoreum outcome\n- Slide 13: Launch Amazon-led in 2027, scale in 2028, and open specialty retail only when the evidence clears tighter gates\n  - Claim: 2027 \u00b7 Launch\n    - Evidence: Set up the US entity, MoCRA registration and English labels (fixes the 6% label complaint)\n    - Evidence: Move from the cross-border seller to Onsoo's own Amazon business with seven SKUs\n    - Evidence: Put the $0.7M off-Amazon budget into TikTok and influencers, where 38% of K-beauty buyers find new brands\n    - Evidence: Run to an ACoS target of 28% or less\n  - Claim: 2028 \u00b7 Scale\n    - Evidence: Grow to ~560k units ($13.4M) and pass $10M of Amazon sales\n    - Evidence: Track aided awareness among category buyers every quarter\n    - Evidence: Design a small retail test with the leading specialty retailer, and cost it\n  - Claim: 2029+ \u00b7 Retail, if gates clear\n    - Evidence: Retail returns to the board as a separate investment case once the gates below are met\n    - Evidence: Sized to hold the 8% margin floor\n    - Evidence: Any retail loss before 2030 larger than A's ~$2.4M cushion moves payback past 2030; the board weighs that trade-off then\n  - Claim: Retail gates: all four should be met before any national retail commitment\n    - Evidence: Amazon scale: Amazon sales above $10M a year \u2014 CEO's gate; the plan reaches $13.4M in 2028\n    - Evidence: Brand awareness: Aided awareness above 20% (not 15%) \u2014 At 10\u201320%, newcomers' median is 3.5 units, still below the 4.0 bar; above 20% it is 4.6\n    - Evidence: Proven sell-through: A door test sells \u2265 4.0 units per door per week \u2014 That is the retailer's 12-month keep-or-remove line\n    - Evidence: Affordability: Retail loss fits within ~$4.7M in 2029 (8% floor) \u2014 B's $7.5M programme added in 2029 would cut group margin to 6.3% and take cash to \u2013$11.8M\n- Slide 14: Five indicators will show early whether the US plan is on track; we propose agreeing the responses now\n  - Claim: Blended ACoS (quarterly)\n    - Evidence: Plan 25%; pilot 28%\n    - Evidence: Trigger: Above 28% for two quarters running (payback needs \u2264 28.6%)\n    - Evidence: Response: Cut unprofitable keywords, slow SKU roll-out, re-forecast payback for the board\n  - Claim: US duty on Korean cosmetics (decision mid-2027)\n    - Evidence: Plan 15%\n    - Evidence: Trigger: Rises to 25%: \u2013$0.35 per unit; breakeven ACoS falls to 26.9%\n    - Evidence: Response: Re-forecast; review price and pack mix; weaker won is a partial offset\n  - Claim: 90-day repeat purchase\n    - Evidence: Plan 29% in pilot\n    - Evidence: Trigger: Stays below the 31% benchmark once seven SKUs are live\n    - Evidence: Response: Review range and product fit before adding ad spend\n  - Claim: Units against plan\n    - Evidence: Plan 300k in 2027\n    - Evidence: Trigger: Below 80% of the year-to-date plan by Q3 2027\n    - Evidence: Response: Hold fixed-cost growth; reset 2028 volumes\n  - Claim: Aided awareness, category buyers\n    - Evidence: 4% today\n    - Evidence: Trigger: Off the path to 20% by end-2028\n    - Evidence: Response: Defer the retail test; rebalance spend toward social\n  - Claim: Cash envelope: we suggest the board approve $5M of cumulative US cash need through 2030.\n    - Evidence: That covers 80% of plan volume combined with 32% ACoS and a 25% duty (\u2013$4.6M peak) and is well inside the $18M cap\n    - Evidence: The 38% ACoS case (\u2013$6.4M) would exceed it\n    - Evidence: Any draw beyond $5M, or any retail commitment, comes back to the board\n  - Claim: Trigger levels are our proposals for management to confirm; they are not in the pack.\n- Slide 15: We ask the board to approve Amazon-led US entry in 2027 and to set the terms for any later retail move\n  - Claim: Approve: Option A, Amazon-led US entry in 2027, as Onsoo's single major launch for the year.\n  - Claim: Approve: A cumulative US cash envelope of $5M through 2030, reported quarterly against the guardrails on slide 14.\n  - Claim: Decline: The 600-door national specialty-retail launch in 2027: it breaches the cap, misses payback and breaks the margin floor even on its own inputs.\n  - Claim: Four retail gates: Amazon above $10M, aided awareness above 20%, a door test at 4.0 or more units per week, and a retail loss that fits within the 8% margin floor.\n  - Claim: The planning team to re-base Option A at 30\u201332% ACoS and bring a 2028 Japan scale-up case to the board in late 2027.\n  - Claim: Note: Payback by end-2030 needs ACoS at or below 28.6% and volumes near plan; at the 32% benchmark it slips past 2030, with peak cash still about $3.2M.\n- Slide 16: Option A and Option B on the planning team's inputs, $M\n  - Claim: A \u00b7 Amazon-led (25% ACoS), 2027\u20132030\n    - Evidence: Revenue 7.2 / 13.4 / 20.4 / 26.4\n    - Evidence: Contribution 1.4 / 2.6 / 4.0 / 5.2\n    - Evidence: Fixed + one-time costs \u20132.9 / \u20132.1 / \u20132.1 / \u20132.1\n    - Evidence: Operating profit \u20131.5 / 0.5 / 1.9 / 3.1\n    - Evidence: Inventory build \u20130.5 / \u20130.4 / \u20130.4 / \u20130.4\n    - Evidence: Cumulative cash \u20131.9 / \u20131.8 / \u20130.3 / 2.4\n    - Evidence: Group operating margin 9.5% / 10.4% / 10.8% / 11.1%\n    - Evidence: Units: 300k / 560k / 850k / 1.1M on Amazon at $24.00\n    - Evidence: Contribution $4.73 a unit\n    - Evidence: Fixed: compliance $0.5M + US team $0.9M + off-Amazon marketing $0.7M a year; setup $0.8M in 2027\n  - Claim: B \u00b7 Retail-led (plan inputs), 2027\u20132030\n    - Evidence: Revenue 11.3 / 19.4 / 29.1 / 37.6\n    - Evidence: Contribution 2.9 / 4.5 / 6.6 / 8.5\n    - Evidence: Fixed + one-time costs \u201311.6 / \u20139.6 / \u20139.8 / \u20139.8\n    - Evidence: Operating profit \u20138.7 / \u20135.1 / \u20133.2 / \u20131.3\n    - Evidence: Inventory build \u20130.8 / \u20130.5 / \u20130.6 / \u20130.6\n    - Evidence: Cumulative cash \u20139.5 / \u201315.1 / \u201318.9 / \u201320.8\n    - Evidence: Group operating margin 4.5% / 6.6% / 7.5% / 8.2%\n    - Evidence: Doors 600 / 600 / 800 / 1,000 \u00d7 4.5 units \u00d7 52 weeks at $14.00 wholesale; contribution $7.55 a unit\n    - Evidence: Amazon units 1.3\u00d7 Option A\n    - Evidence: Fixed $9.6M a year (A's $2.1M + $6.0M retail marketing + $1.5M field team); one-time $0.8M setup + $0.5M launch fee + $1,100 per new door\n- Slide 17: Sensitivity cases: Option B under corrected inputs, the CEO's 2029 retail add-on, and Option J\n  - Claim: Sensitivity cases (2030 revenue; peak cash need; cash end-2030; lowest group margin)\n    - Evidence: A \u00b7 plan (25% ACoS): $26.4M; $1.9M; +$2.4M; 9.5%\n    - Evidence: A \u00b7 28% ACoS: $26.4M; $2.4M; +$0.4M; 9.3%\n    - Evidence: A \u00b7 32% ACoS: $26.4M; $3.2M; \u2013$2.3M; 9.1%\n    - Evidence: A \u00b7 38% ACoS: $26.4M; $6.4M; \u2013$6.4M; 8.8%\n    - Evidence: A \u00b7 25% duty: $26.4M; $2.2M; +$1.3M; 9.4%\n    - Evidence: A \u00b7 32% ACoS + 25% duty: $26.4M; $3.9M; \u2013$3.4M; 9.0%\n    - Evidence: A \u00b7 80% volume: $21.1M; $2.4M; +$0.1M; 9.4%\n    - Evidence: A \u00b7 70% volume: $18.5M; $2.8M; \u2013$1.1M; 9.3%\n    - Evidence: A \u00b7 80% volume + 32% ACoS + 25% duty: $21.1M; $4.6M; \u2013$4.6M; 9.0%\n    - Evidence: B \u00b7 plan inputs: $37.6M; $20.8M; \u2013$20.8M; 4.5%\n    - Evidence: B \u00b7 no halo: $29.7M; $24.3M; \u2013$24.3M; 4.2%\n    - Evidence: B \u00b7 2.6 units per door, with halo: $36.2M; $22.9M; \u2013$22.9M; 4.2%\n    - Evidence: B \u00b7 corrected (2.6 units, no halo): $28.3M; $26.4M; \u2013$26.4M; 4.0%\n    - Evidence: B \u00b7 corrected + 32% ACoS: $28.3M; $31.1M; \u2013$31.1M; 3.6%\n    - Evidence: CEO plan + B-scale retail in 2029: $28.4M; $11.8M; \u2013$11.8M; 6.3%\n    - Evidence: J \u00b7 Japan scale-up: $7.0M; $1.1M; +$1.8M; 10.1%\n  - Claim: \"CEO plan + B-scale retail in 2029\" = Option A plus 600 doors from 2029 at B's cost structure, at 4.6 units per door per week (the median for brands above 20% awareness) and no halo.\n- Slide 18: How we built the numbers, and the choices we made where the pack was silent\n  - Claim: Method\n    - Evidence: All inputs are the planning team's, as given in the briefing pack; no outside data is used.\n    - Evidence: Per-unit economics of the hero product (Rice Ferment Barrier Cream) are applied to all SKUs, as the planning team does.\n    - Evidence: Cash = operating profit minus the change in inventory, which is held at four months of landed cost. No tax, receivables or payables.\n    - Evidence: Group margin adds each option's operating profit and revenue to the ex-US plan (revenue $140\u2013158M at an 11.0% margin).\n    - Evidence: ACoS breakeven: the ACoS at which A's cumulative cash is exactly zero at end-2030, holding plan volumes.\n    - Evidence: Exchange rate held at KRW 1,380 per dollar; a weaker won would lower dollar product costs.\n  - Claim: Judgement calls\n    - Evidence: Ambition read as $40M of US revenue in 2030 (Onsoo's own revenue, with retail at wholesale).\n    - Evidence: 2027 volumes treated as full-year, as in the planning team's tables.\n    - Evidence: One-time costs and door fixtures expensed in the year incurred (this makes the margin test conservative).\n    - Evidence: Onsoo placed in the \"below 10%\" awareness band (4% of all buyers, 9% of K-beauty buyers).\n    - Evidence: The bandwidth limit read as applying to 2027 only, so a Japan scale-up can be considered for 2028.\n    - Evidence: Proposed trigger levels and the $5M cash envelope are our recommendations, not board-set figures.\n    - Evidence: Japan figures used as given (the pack has no Japan working capital).\n  - Claim: Choices marked here were made without the CEO's input and should be confirmed before the board meeting.\n\n**Recommendation:** Launch Amazon-led in 2027, scale in 2028, and open specialty retail only when the evidence clears tighter gates. Approve Option A, Amazon-led US entry in 2027, as Onsoo's single major launch for the year; approve a cumulative US cash envelope of $5M through 2030, reported quarterly against the guardrails; decline the 600-door national specialty-retail launch in 2027; adopt four retail gates (Amazon above $10M, aided awareness above 20%, a door test at 4.0 or more units per week, and a retail loss that fits within the 8% margin floor); direct the planning team to re-base Option A at 30\u201332% ACoS and bring a 2028 Japan scale-up case to the board in late 2027.\n\n**Alternatives considered:**\n- A \u00b7 Amazon-led (advocate: CEO, initial hypothesis): Chosen. The only US route that passes the board's cash and margin tests; peak cash $1.9M, pays back in 2030 (+$2.4M), lowest group margin 9.5%. At risk on ambition ($26.4M in 2030) and payback (needs ACoS \u2264 28.6% and volume near plan).\n- B \u00b7 Retail-led national specialty-retail launch in 600 doors (advocate: independent board member): Rejected/declined: it breaches the cap, misses payback and breaks the margin floor even on its own inputs (\u2013$20.8M cumulative cash by 2030, group margin 4.5% in 2027). Its inputs are optimistic (2.6 units per door per week at Onsoo's awareness vs 4.5 assumed; halo not causal); corrected it needs about $26M of cash for ~$28M revenue.\n- J \u00b7 Japan scale-up (advocate: Head of Japan): Not chosen for 2027: the safe option but a small one ($7M revenue by 2030 in a market growing 1.5% a year) and builds no US business. Lower-risk and beats A on cash at 32% ACoS. Held for later: can return as a 2028 decision; planning team to bring a 2028 Japan scale-up case in late 2027.\n- CEO's plan: add specialty retail from 2029 once Amazon passes $10M and awareness passes 15%: Modified: retail returns as a separate investment case only if four tighter gates clear, including aided awareness above 20% (not 15%); B's $7.5M programme added in 2029 would cut group margin to 6.3% and take cash to \u2013$11.8M.\n\n**Assumptions and uncertainties:**\n- Built only from the planning team's briefing pack (synthetic data); no outside data is used.\n- All figures in US dollars at KRW 1,380 per dollar; a weaker won would lower dollar product costs.\n- A's payback is fragile: needs ACoS at or below 28.6% (26.9% with a 25% duty) and volumes near plan; the plan's 25% ACoS runs against the evidence (pilot 28%, benchmark median 32%).\n- Volume plan is a stretch: 2027 is 1.8\u00d7 the June pilot run-rate and pilot growth slowed to ~9% a month; at 80% of plan A only just pays back, at 70% it misses.\n- US duty on Korean cosmetics decision due mid-2027 (15% plan; 25% case); tariff cases apply 25% from 2027 so are slightly conservative.\n- Ambition read as $40M of US revenue in 2030; on a looser \"trajectory\" reading, A and B would be closer to passing.\n- Per-unit economics of the hero product (Rice Ferment Barrier Cream) are applied to all SKUs.\n- Cash = operating profit minus change in inventory (four months of landed cost); no tax, receivables or payables.\n- 2027 volumes treated as full-year.\n- One-time costs and door fixtures expensed in the year incurred (makes the margin test conservative).\n- Onsoo placed in the \"below 10%\" awareness band.\n- Bandwidth limit read as applying to 2027 only.\n- \"B corrected\" is illustrative only as it assumes retail is kept running.\n- Japan figures used as given (the pack has no Japan working capital).\n- Proposed trigger levels and the $5M cash envelope are recommendations, not board-set figures; trigger levels are for management to confirm.\n- Choices were made without the CEO's input and should be confirmed before the board meeting.\n- Amazon-first is no guarantee: of three K-beauty brands that entered Amazon-first, one reached ~$30M by 2025; two stayed below $5M.\n\n**Next steps:**\n- Board decision at the March 2027 board meeting.\n- 2027: Set up the US entity, MoCRA registration and English labels; move to Onsoo's own Amazon business with seven SKUs; put the $0.7M off-Amazon budget into TikTok and influencers; run to an ACoS target of 28% or less.\n- 2028: Grow to ~560k units ($13.4M) and pass $10M of Amazon sales; track aided awareness quarterly; design and cost a small retail test with the leading specialty retailer.\n- 2029+: Retail returns to the board as a separate investment case once the gates are met.\n- Report quarterly against the five guardrail indicators (ACoS, duty, repeat purchase, units vs plan, aided awareness) with agreed responses.\n- Planning team to re-base Option A at 30\u201332% ACoS and bring a 2028 Japan scale-up case to the board in late 2027.\n- Confirm judgement calls with the CEO before the board meeting.\n\n## Part 2 \u00b7 Full slide text (mechanical extraction)\n\n=== Slide 1 ===\n[Title] US market entry in 2027: launch Amazon-led, and earn the right to specialty retail\n- ONSOO BOTANICALS \u00b7 BOARD PRE-READ\n- Should Onsoo enter the US market in 2027, and if so, by which route? Recommendation for CEO Park Ji-won and the Board, for decision at the March 2027 board meeting.\n- Draft for review \u00b7 November 2026\n- Built only from the planning team's briefing pack (synthetic data). All figures in US dollars at KRW 1,380 per dollar; years are calendar years; \"cash\" means cumulative US cash flow.\n\n=== Slide 2 ===\n[Title] Enter the US in 2027 through Amazon, reject the 600-door retail launch, and hold Japan for later\n- EXECUTIVE SUMMARY\n- The opportunity is real and it is on Amazon.\n- US K-beauty facial skincare reached $3.6B in 2025, growing 17% a year against 5% for the category; 41% of it sells on Amazon. Onsoo's cross-border pilot was running at about $4M a year by June 2026 on three SKUs, rated 4.5 stars.\n- Amazon-led (A) is the only US route that passes the board's cash and margin tests.\n- On planning inputs, A needs at most $1.9M of cash (the cap is $18M), pays back in 2030 (+$2.4M cumulative) and keeps group margin above 9% every year.\n- Retail-led (B) fails on its own numbers, and its inputs are optimistic.\n- Cumulative cash reaches \u2013$18.9M in 2029 and \u2013$20.8M in 2030 with no payback; group margin falls to 4.5% in 2027. At Onsoo's under-10% awareness, newcomers sell 2.6 units per door per week, not the 4.5 assumed and below the 4.0 delisting line. Corrected, B needs about $26M of cash.\n- A's payback is fragile, but its downside is small.\n- Payback by 2030 needs advertising cost of sales (ACoS) at or below 28.6% (plan 25%, pilot 28%, median brand at this scale 32%) and volumes near plan (at 80% of plan it only just pays back). At 32% ACoS A misses payback (\u2013$2.3M at end-2030), but the worst combined case we modelled peaks at $4.6M and the margin floor always holds.\n- No route reaches $40M by 2030.\n- A reaches $26M in 2030. B's $38M rests on the inflated inputs; corrected it is about $28M. $40M should be the goal of a gated second phase in specialty retail, which comes back to the board as its own investment case.\n- Decisions requested in March 2027: (1) approve Option A as Onsoo's single 2027 launch; (2) approve a US cash envelope of $5M through 2030, enough for 80% of plan volume with 32% ACoS and a 25% duty (\u2013$4.6M peak), with anything beyond returning to the board; (3) decline the 600-door retail launch; (4) adopt tighter gates for specialty retail, including aided awareness above 20%, not 15%; (5) re-base the plan at 30\u201332% ACoS rather than 25%.\n- Source: Onsoo planning-team briefing pack (synthetic benchmark data); team analysis.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 3 ===\n[Title] The planning team modelled three uses of 2027's single launch slot; we test each against the board's five objectives\n- THE DECISION\n- A \u00b7 Amazon-led\n- B \u00b7 Retail-led\n- J \u00b7 Japan scale-up\n- Advocate: CEO (initial hypothesis)\n- Advocate: independent board member\n- Advocate: Head of Japan\n- Own Amazon US business with seven SKUs from 2027 (three today)\n- Units 300k (2027) \u2192 1.1M (2030); ACoS 25%\n- Fixed cost $2.1M a year; setup $0.8M in 2027\n- CEO's plan adds specialty retail from 2029 once Amazon passes $10M and awareness passes 15%\n- National specialty-retail launch in 600 doors in 2027, 1,000 by 2030\n- 4.5 units per door per week (retailer's deck)\n- Amazon at 1.3\u00d7 Option A volumes (\"halo\")\n- Fixed cost $9.6M a year; one-time $1.96M in 2027\n- Use 2027 to scale the existing Japan business instead of the US\n- Extra revenue $2.5M (2027) \u2192 $7.0M (2030) at a 30% contribution margin\n- Fixed cost $0.8M a year; one-time $1.0M\n- Market grows ~1.5% a year; Onsoo holds a ut $4M a year by June 2026 on three SKUs, with no US team and a fixable label issue\n- AMAZON PILOT\n- Pilot units sold per month, 2026 (thousand)\n- 4.5\u2605\n- 29%\n- 14.0\n- rating from 2,140 reviews\n- 90-day repeat purchase\n- 12.9\n- 11.8\n- Strong product acceptance\n- In line with the 31% first-year Amazon benchmark, but well below Onsoo's 48% in Korea\n- 10.1\n- 8.6\n- 7.4\n- 28%\n- 6%\n- ACoS over the pilot\n- of reviews cite Korean-only labels\n- Jan\n- Feb\n- Mar\n- Apr\n- May\n- Jun\n- Achieved on a small ad budget; ad cost per click rises as brands scale (slide 10)\n- The most common complaint; fixed by the US labels in A's $0.8M setup budget\n- +16%\n- +17%\n- +17%\n- +9%\n- +9%\n- Month-on-month growth (row above) slowed from ~17% to ~9%. 64,800 units ($1.56M) in six months; June run-rate 168k units a year, about $4.0M. The 2027 plan of 300k units is 1.8\u00d7 that run-rate, from seven SKUs instead of three.\n- Source: briefing pack \u00a76 (pilot Jan\u2013Jun 2026, cross-border seller, three SKUs, $24.00 average selling price). Run-rate = June units \u00d7 12 \u00d7 $24. Repeat benchmark from agency data.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 6 ===\n[Title] Of the two US routes, only Amazon-led passes the cash and margin tests; no option reaches $40M by 2030\n- OPTIONS AGAINST THE BOARD'S TESTS\n[Table]\n  | Board test | A \u00b7 Amazon-led | B \u00b7 Retail-led | J \u00b7 Japan scale-up |\n  | 1 \u00b7 Revenue by 2030 (ambition: $40M) | \u25d0 $26.4M / Short of $40M; growing 29% in 2030 | \u25d0 $37.6M / Depends on optimistic inputs; ~$28M corrected | \u2717 $7.0M / Japan revenue; builds no US business |\n  | 2 \u00b7 Peak cash need (cap: $18M) | \u2713 $1.9M / In 2027 | \u2717 $20.8M / Cap breached in 2029; still rising in 2030 | \u2713 $1.1M / In 2027 |\n  | 3 \u00b7 Payback by end-2030 | \u25d0 +$2.4M in 2030 / Needs ACoS \u2264 28.6% and volume near plan | \u2717 \u2013$20.8M / 2030 cash flow still \u2013$1.9M | \u2713 +$1.8M by 2030 / Cumulative cash positive from 2029 |\n  | 4 \u00b7 Group margin \u2265 8% every year | \u2713 Lowest 9.5% (2027) | \u2717 4.5% / 6.6% / 7.5% / Below the floor in 2027, 2028 and 2029 | \u2713 Lowest 10.1% (2027) |\n  | 5 \u00b7 One major launch in 2027 | \u2713 Uses the slot | \u2713 Uses the slot | \u2713 Uses the slot / US entry slips to 2028 or later |\n- Reading: \u2713 passes  \u2717 fails  \u25d0 partly met or at risk. A passes three tests and is at risk on two (ambition, payback; slide 10). B fails three tests even on its own inputs. J passes the financial tests but builds no US business. We read the ambition as $40M of revenue in 2030; on a looser \"trajectory\" reading, A and B would be closer to passing.\n- Source: Onsoo planning-team briefing pack (synthetic benchmark data); team analysis. Planning-team inputs used as given. Peak cash = most negative cumulative US (or Japan) cash flow 2027\u201330. Group margin = (ex-US operating profit at 11% + option operating profit) \u00f7 (ex-US revenue + option revenue).\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 7 ===\n[Title] On the planning team's own numbers, retail-led entry breaches the $18M cap in 2029 and never pays back\n- CASH\n- Cumulative cash flow by option, $M (end of year)\n- Why B cannot pay back\n- A \u00b7 Amazon-led\n- B \u00b7 Retail-led\n- J \u00b7 Japan scale-up\n- Fixed cost is $9.6M a year for B against $2.1M for A: $6.0M of national retail marketing and $1.5M of field sales.\n- B's retail doors add about $1.1M of contribution a year at 600 doors (600 \u00d7 4.5 units \u00d7 52 weeks \u00d7 $7.55), rising to $1.8M at 1,000 doors in 2030, and the assumed halo adds about $0.4\u20131.6M on Amazon.\n- B's annual cash flow is still \u2013$1.9M in 2030, so the cumulative loss is still growing when the payback deadline arrives.\n- Mooncrest, which launched retail-first in 450 doors in 2023, ran up a $21M cumulative US loss and was removed from shelves in 2025.\n- +5\n- A  +$2.4M\n- J  +$1.8M\n\n- -5\n- -10\n- -15\n- -20\n- Board cap: \u2013$18M\n- \u2013$18.9M in 2029\n- B  \u2013$20.8M\n- Launch\n- 2027\n- 2028\n- 2029\n- 2030\n- Source: Onsoo planning-team briefing pack (synthetic benchmark data); team analysis. Cumulative cash = operating cash flow after fixed, one-time and fixture costs and the inventory build (four months of landed cost). Before tax; constant exchange rate.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 8 ===\n[Title] Retail earns more per unit than Amazon, but at 600 doors the $7.5M retail programme would need ~32 units per door per week to break even\n- WHY RETAIL-LED LOSES MONEY\n- Contribution per unit, $\n- What the retail route adds in 2027 compared with A, $M\n[Table]\n  | $ per unit | Amazon | Specialty retail |\n  | Price Onsoo receives | 24.00 | 14.00 |\n  | Amazon referral (15%) + FBA | \u20138.70 | \u2013 |\n  | Product, freight, duty | \u20134.58 | \u20134.78 |\n  | Advertising (25% ACoS) | \u20136.00 | in fixed budget |\n  | Co-op (8%) + returns (4%) | \u2013 | \u20131.68 |\n  | Contribution per unit | 4.73 | 7.55 |\n- Retail doors' contribution\n- +1.06\n- Amazon halo (+90k units)\n- +0.43\n- National marketing and sampling\n- -6.00\n- Field sales and merchandising\n- -1.50\n- Launch fee and 600 door fixtures\n- -1.16\n- Retail looks better per unit, but its marketing is fixed. Each retail unit earns $2.82 more than an Amazon unit at 25% ACoS, but the $6.0M marketing and sampling budget and the $1.5M field team are paid whether or not the units sell.\n- Breakeven: $7.5M \u00f7 ($7.55 \u00d7 52 weeks \u00d7 600 doors) = 31.9 units per door per week, against 4.5 in the plan and 2.6 for brands with Onsoo's awareness.\n- Net: \u2013$7.2M of operating profit in 2027 (B \u2013$8.66M vs A \u2013$1.48M), so group margin falls from 9.5% to 4.5%.\n- Grey bars are retail-specific costs; blue bars are the contribution retail adds, including the planning team's 1.3\u00d7 Amazon halo (90k extra units \u00d7 $4.73).\n- Source: briefing pack Tables 4\u20136; team analysis. Per-unit figures for Rice Ferment Barrier Cream, applied to all SKUs as the planning team does. Amazon at 25% ACoS; duty 15% of ex-factory cost. Rows are rounded; exact contributions are $4.725 and $7.545.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 9 ===\n[Title] B's two key inputs are optimistic: brands with Onsoo's awareness sell 2.6 units per door per week, below the 4.0 delisting bar\n- TESTING THE RETAIL-LED INPUTS\n- First-year sell-through by awareness, units per door per week\n- Two inputs drive B, and both are overstated\n- Onsoo today: 4\u20139% \u25bc\n\n- 4.5 units per door per week comes from the retailer's deck on successful newcomers, a sample of survivors. Onsoo's aided awareness is 4% (all buyers) to 9% (K-beauty buyers). Three-quarters of brands below 10% awareness sell under 3.4 units, short of the 4.0 bar, so the likely outcome is removal after year one.\n- The 1.3\u00d7 Amazon halo rests on a 0.71 correlation between doors and Amazon sales across 30 brands. That does not show which drives which: retailers stock brands that already sell well online (Saebom, Amazon-first since 2022, added 300 doors in 2025, the year it reached ~$30M of US revenue), and larger brands are larger everywhere.\n- Corrected, B is worse: if retail were kept running at 2.6 units with no halo, cumulative cash would reach \u2013$26.4M by 2030, and 2030 revenue would be $28.3M, only $1.9M more than A. If Onsoo were delisted after year one instead, the launch fee and fixtures would be written off.\n\n- 4.5 B's plan\n\n- 4.0 delisting bar\n\n- Below 10%\n- 10\u201320%\n- Above 20%\n- median 2.6\n- median 3.5\n- median 4.6\n- range 1.9\u20133.4\n- range 2.8\u20134.3\n- range 3.9\u20135.5\n- Bars show the median, whiskers the interquartile range. The leading specialty retailer reviews newcomers after 12 months.\n- Source: briefing pack Table 8 (retail analytics firm, 2025, 46 newcomer brands; median and interquartile range of first-year sell-through), \u00a710 survey, \u00a711 competitors, \u00a712 board memo.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 10 ===\n[Title] Amazon-led payback is fragile, needing ACoS at or below 28.6% and volumes near plan, but its downside stays far inside the cap\n- RISKS TO AMAZON-LED\n- Option A: cumulative cash at end-2030 by scenario, $M\n- What this means\n- Misses payback \u25c0\n- \u25b6 Pays back\n- Peak cash need\n- Lowest margin\n- Plan: 25% ACoS\n- +2.4\n- $1.9M\n- 9.5%\n- Ad cost: the plan's 25% runs against the evidence. Cost per click rises as brands bid on broader keywords; the median brand scaling from $5M to $20M runs at 32%. Payback needs \u2264 28.6% (26.9% with a 25% duty).\n- Volume: the plan is a stretch. 2027 is 1.8\u00d7 the June pilot run-rate and pilot growth slowed to ~9% a month. At 80% of plan volume A only just pays back (+$0.1M); at 70% it misses.\n- The downside is bounded. The worst combination shown peaks at $4.6M; 38% ACoS peaks at $6.4M, about a third of the cap. Group margin stays at 8.8% or above in every case.\n- Pilot: 28% ACoS\n- +0.4\n- $2.4M\n- 9.3%\n- Benchmark median: 32%\n- -2.3\n- $3.2M\n- 9.1%\n- Benchmark high: 38%\n- -6.4\n- $6.4M\n- 8.8%\n- 80% of plan volume\n- +0.1\n- $2.4M\n- 9.4%\n- 70% of plan volume\n- -1.1\n- $2.8M\n- 9.3%\n- 32% ACoS + 25% duty\n- -3.4\n- $3.9M\n- 9.0%\n- 80% volume + 32% + duty\n- -4.6\n- $4.6M\n- 9.0%\n- Dark bars pay back by end-2030; light bars miss. Peak cash is against the $18M cap; lowest margin is group operating margin against the 8% floor.\n- Source: briefing pack Table 5 volumes, Table 4 unit costs, \u00a711 agency benchmark (median ACoS 32%, range 26\u201338%, brands scaling $5M\u2192$20M on Amazon US), \u00a713 tariff review. Tariff cases apply a 25% duty from 2027 although the decision is due in mid-2027, so they are slightly conservative.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 11 ===\n[Title] No option reaches $40M by 2030; Amazon-led gets two-thirds of the way for under a tenth of B's cash\n- THE $40M AMBITION\n- Revenue in 2030, $M\n- Peak cash need, 2027\u201330, $M\n- Ambition: $40M\n- $26.4M\n- $37.6M\n- $28.3M\n- Board cap: $18M\n- $20.8M\n- $26.4M\n- $7.0M\n- $1.9M\n- $1.1M\n- A \u00b7 Amazon-led\n- B \u00b7 plan inputs\n- B \u00b7 corrected\n- J \u00b7 Japan\n- A \u00b7 Amazon-led\n- B \u00b7 plan inputs\n- B \u00b7 corrected\n- J \u00b7 Japan\n- B's extra revenue over A comes mostly from the 1.3\u00d7 halo; corrected, B adds $1.9M of 2030 revenue over A.\n- A's peak need is $1.9M on plan and $3.2M at 32% ACoS; B needs $20.8\u201326.4M.\n- Source: Onsoo planning-team briefing pack (synthetic benchmark data); team analysis. Revenue is what Onsoo receives (retail at wholesale, $14 a unit). \"B corrected\" = 2.6 units per door per week and no Amazon halo, illustrative only as it assumes retail is kept running (slide 9). We read the ambition as $40M of US revenue in 2030.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 12 ===\n[Title] A Japan scale-up is the safe option but a small one: $7M of revenue by 2030 in a market growing 1.5% a year\n- JAPAN ALTERNATIVE\n[Table]\n  | 2027\u201330, $M | A \u00b7 Amazon-led (US) | J \u00b7 Japan scale-up |\n  | Revenue in 2030 | $26.4M, up 29% on 2029 | $7.0M, up 17% on 2029 |\n  | Operating profit in 2030 | $3.1M ($1.2M at 32% ACoS) | $1.3M |\n  | Cumulative cash, end-2030 | +$2.4M (\u2013$2.3M at 32% ACoS) | +$1.8M |\n  | Peak cash need | $1.9M ($3.2M at 32% ACoS) | $1.1M |\n  | Market growth | US K-beauty skincare +17% a year | Japan facial skincare ~1.5% a year |\n  | Starting position | New entrant; ~$4M pilot run-rate | Known market and retailers; 3.1% share |\n  | Strategic value | Starts the US business the $40M ambition needs | Extends an existing position; no progress on the US |\n- Our view\n- J is lower-risk, and at 32% ACoS it beats A on cash to 2030 (+$1.8M vs \u2013$2.3M).\n- But it caps Onsoo at $7M of new revenue in a slow-growing market (1.5% a year), while A builds a business nearly four times larger in a market growing 17% a year.\n- The bandwidth limit applies to 2027, so Japan can return as a 2028 decision.\n- Amazon-first is no guarantee. Of three K-beauty brands that entered Amazon-first, one (Saebom) reached ~$30M by 2025; two stayed below $5M. Onsoo's pilot is already near $4M a year, so the gates and triggers on slides 13\u201314 are what protect the board against a Gaon Lab or Yeoreum outcome.\n- Source: Onsoo planning-team briefing pack (synthetic benchmark data); team analysis. Japan figures from Table 7 (no working capital given). US K-beauty growth is 2021\u201325 compound annual (Table 1).\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 13 ===\n[Title] Launch Amazon-led in 2027, scale in 2028, and open specialty retail only when the evidence clears tighter gates\n- RECOMMENDATION\n- 2027 \u00b7 Launch\n- 2028 \u00b7 Scale\n- 2029+ \u00b7 Retail, if gates clear\n- Set up the US entity, MoCRA registration and English labels (fixes the 6% label complaint)\n- Move from the cross-border seller to Onsoo's own Amazon business with seven SKUs\n- Put the $0.7M off-Amazon budget into TikTok and influencers, where 38% of K-beauty buyers find new brands\n- Run to an ACoS target of 28% or less\n- Grow to ~560k units ($13.4M) and pass $10M of Amazon sales\n- Track aided awareness among category buyers every quarter\n- Design a small retail test with the leading specialty retailer, and cost it\n- Retail returns to the board as a separate investment case once the gates below are met\n- Sized to hold the 8% margin floor\n- Any retail loss before 2030 larger than A's ~$2.4M cushion moves payback past 2030; the board weighs that trade-off then\n- Retail gates: all four should be met before any national retail commitment\n[Table]\n  | Gate | Threshold | Why |\n  | Amazon scale | Amazon sales above $10M a year | CEO's gate; the plan reaches $13.4M in 2028 |\n  | Brand awareness | Aided awareness above 20% (not 15%) | At 10\u201320%, newcomers' median is 3.5 units, still below the 4.0 bar; above 20% it is 4.6 |\n  | Proven sell-through | A door test sells \u2265 4.0 units per door per week | That is the retailer's 12-month keep-or-remove line |\n  | Affordability | Retail loss fits within ~$4.7M in 2029 (8% floor) | B's $7.5M programme added in 2029 would cut group margin to 6.3% and take cash to \u2013$11.8M |\n- Source: Onsoo planning-team briefing pack (synthetic benchmark data); team analysis. Retail gate rationale from Table 8 (10\u201320% awareness: median 3.5 units per door per week, below the 4.0 bar). Margin headroom = 2029 group operating profit with A, minus 8% of group revenue including the new retail sales.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 14 ===\n[Title] Five indicators will show early whether the US plan is on track; we propose agreeing the responses now\n- GUARDRAILS\n[Table]\n  | Indicator | Plan | Proposed trigger for review | Response |\n  | Blended ACoS (quarterly) | 25%; pilot 28% | Above 28% for two quarters running (payback needs \u2264 28.6%) | Cut unprofitable keywords, slow SKU roll-out, re-forecast payback for the board |\n  | US duty on Korean cosmetics (decision mid-2027) | 15% | Rises to 25%: \u2013$0.35 per unit; breakeven ACoS falls to 26.9% | Re-forecast; review price and pack mix; weaker won is a partial offset |\n  | 90-day repeat purchase | 29% in pilot | Stays below the 31% benchmark once seven SKUs are live | Review range and product fit before adding ad spend |\n  | Units against plan | 300k in 2027 | Below 80% of the year-to-date plan by Q3 2027 | Hold fixed-cost growth; reset 2028 volumes |\n  | Aided awareness, category buyers | 4% today | Off the path to 20% by end-2028 | Defer the retail test; rebalance spend toward social |\n- Cash envelope: we suggest the board approve $5M of cumulative US cash need through 2030. That covers 80% of plan volume combined with 32% ACoS and a 25% duty (\u2013$4.6M peak) and is well inside the $18M cap. The 38% ACoS case (\u2013$6.4M) would exceed it. Any draw beyond $5M, or any retail commitment, comes back to the board.\n- Source: briefing pack \u00a76, \u00a711, \u00a713; team analysis. Trigger levels are our proposals for management to confirm; they are not in the pack.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 15 ===\n[Title] We ask the board to approve Amazon-led US entry in 2027 and to set the terms for any later retail move\n- DECISIONS FOR MARCH 2027\n- Approve\n- Option A, Amazon-led US entry in 2027, as Onsoo's single major launch for the year.\n- Approve\n- A cumulative US cash envelope of $5M through 2030, reported quarterly against the guardrails on slide 14.\n- Decline\n- The 600-door national specialty-retail launch in 2027: it breaches the cap, misses payback and breaks the margin floor even on its own inputs.\n- Four retail gates: Amazon above $10M, aided awareness above 20%, a door test at 4.0 or more units per week, and a retail loss that fits within the 8% margin floor.\n- Adopt\n- The planning team to re-base Option A at 30\u201332% ACoS and bring a 2028 Japan scale-up case to the board in late 2027.\n- Direct\n- Note\n- Payback by end-2030 needs ACoS at or below 28.6% and volumes near plan; at the 32% benchmark it slips past 2030, with peak cash still about $3.2M.\n- Source: Onsoo planning-team briefing pack (synthetic benchmark data); team analysis.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 16 ===\n[Title] Option A and Option B on the planning team's inputs, $M\n- APPENDIX 1 \u00b7 OPTION MODEL\n[Table]\n  | A \u00b7 Amazon-led (25% ACoS) | 2027 | 2028 | 2029 | 2030 |\n  | Revenue | 7.2 | 13.4 | 20.4 | 26.4 |\n  | Contribution | 1.4 | 2.6 | 4.0 | 5.2 |\n  | Fixed + one-time costs | \u20132.9 | \u20132.1 | \u20132.1 | \u20132.1 |\n  | Operating profit | \u20131.5 | 0.5 | 1.9 | 3.1 |\n  | Inventory build | \u20130.5 | \u20130.4 | \u20130.4 | \u20130.4 |\n  | Cumulative cash | \u20131.9 | \u20131.8 | \u20130.3 | 2.4 |\n  | Group operating margin | 9.5% | 10.4% | 10.8% | 11.1% |\n[Table]\n  | B \u00b7 Retail-led (plan inputs) | 2027 | 2028 | 2029 | 2030 |\n  | Revenue | 11.3 | 19.4 | 29.1 | 37.6 |\n  | Contribution | 2.9 | 4.5 | 6.6 | 8.5 |\n  | Fixed + one-time costs | \u201311.6 | \u20139.6 | \u20139.8 | \u20139.8 |\n  | Operating profit | \u20138.7 | \u20135.1 | \u20133.2 | \u20131.3 |\n  | Inventory build | \u20130.8 | \u20130.5 | \u20130.6 | \u20130.6 |\n  | Cumulative cash | \u20139.5 | \u201315.1 | \u201318.9 | \u201320.8 |\n  | Group operating margin | 4.5% | 6.6% | 7.5% | 8.2% |\n- Units: 300k / 560k / 850k / 1.1M on Amazon at $24.00.\n- Contribution $4.73 a unit (slide 8).\n- Fixed: compliance $0.5M + US team $0.9M + off-Amazon marketing $0.7M a year; setup $0.8M in 2027.\n- Doors 600 / 600 / 800 / 1,000 \u00d7 4.5 units \u00d7 52 weeks at $14.00 wholesale; contribution $7.55 a unit.\n- Amazon units 1.3\u00d7 Option A.\n- Fixed $9.6M a year (A's $2.1M + $6.0M retail marketing + $1.5M field team); one-time $0.8M setup + $0.5M launch fee + $1,100 per new door.\n- Source: Onsoo planning-team briefing pack (synthetic benchmark data); team analysis. Inventory = four months of landed cost (ex-factory + freight + duty). One-time costs and door fixtures expensed in the year incurred. Before tax; no receivables or payables (not in the pack).\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 17 ===\n[Title] Sensitivity cases: Option B under corrected inputs, the CEO's 2029 retail add-on, and Option J\n- APPENDIX 2 \u00b7 SENSITIVITIES\n[Table]\n  | Case | 2030 revenue | Peak cash need | Cash, end-2030 | Lowest group margin |\n  | A \u00b7 plan (25% ACoS) | $26.4M | $1.9M | +$2.4M | 9.5% |\n  | A \u00b7 28% ACoS | $26.4M | $2.4M | +$0.4M | 9.3% |\n  | A \u00b7 32% ACoS | $26.4M | $3.2M | \u2013$2.3M | 9.1% |\n  | A \u00b7 38% ACoS | $26.4M | $6.4M | \u2013$6.4M | 8.8% |\n  | A \u00b7 25% duty | $26.4M | $2.2M | +$1.3M | 9.4% |\n  | A \u00b7 32% ACoS + 25% duty | $26.4M | $3.9M | \u2013$3.4M | 9.0% |\n  | A \u00b7 80% volume | $21.1M | $2.4M | +$0.1M | 9.4% |\n  | A \u00b7 70% volume | $18.5M | $2.8M | \u2013$1.1M | 9.3% |\n  | A \u00b7 80% volume + 32% ACoS + 25% duty | $21.1M | $4.6M | \u2013$4.6M | 9.0% |\n  | B \u00b7 plan inputs | $37.6M | $20.8M | \u2013$20.8M | 4.5% |\n  | B \u00b7 no halo | $29.7M | $24.3M | \u2013$24.3M | 4.2% |\n  | B \u00b7 2.6 units per door, with halo | $36.2M | $22.9M | \u2013$22.9M | 4.2% |\n  | B \u00b7 corrected (2.6 units, no halo) | $28.3M | $26.4M | \u2013$26.4M | 4.0% |\n  | B \u00b7 corrected + 32% ACoS | $28.3M | $31.1M | \u2013$31.1M | 3.6% |\n  | CEO plan + B-scale retail in 2029 | $28.4M | $11.8M | \u2013$11.8M | 6.3% |\n  | J \u00b7 Japan scale-up | $7.0M | $1.1M | +$1.8M | 10.1% |\n- Source: Onsoo planning-team briefing pack (synthetic benchmark data); team analysis. \"CEO plan + B-scale retail in 2029\" = Option A plus 600 doors from 2029 at B's cost structure, at 4.6 units per door per week (the median for brands above 20% awareness) and no halo.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n\n=== Slide 18 ===\n[Title] How we built the numbers, and the choices we made where the pack was silent\n- APPENDIX 3 \u00b7 METHOD AND JUDGEMENT CALLS\n- Method\n- All inputs are the planning team's, as given in the briefing pack; no outside data is used.\n- Per-unit economics of the hero product (Rice Ferment Barrier Cream) are applied to all SKUs, as the planning team does.\n- Cash = operating profit minus the change in inventory, which is held at four months of landed cost. No tax, receivables or payables.\n- Group margin adds each option's operating profit and revenue to the ex-US plan (revenue $140\u2013158M at an 11.0% margin).\n- ACoS breakeven: the ACoS at which A's cumulative cash is exactly zero at end-2030, holding plan volumes.\n- Exchange rate held at KRW 1,380 per dollar; a weaker won would lower dollar product costs.\n- Judgement calls\n- Ambition read as $40M of US revenue in 2030 (Onsoo's own revenue, with retail at wholesale).\n- 2027 volumes treated as full-year, as in the planning team's tables.\n- One-time costs and door fixtures expensed in the year incurred (this makes the margin test conservative).\n- Onsoo placed in the \"below 10%\" awareness band (4% of all buyers, 9% of K-beauty buyers).\n- The bandwidth limit read as applying to 2027 only, so a Japan scale-up can be considered for 2028.\n- Proposed trigger levels and the $5M cash envelope are our recommendations, not board-set figures.\n- Japan figures used as given (the pack has no Japan working capital).\n- Choices marked here were made without the CEO's input and should be confirmed before the board meeting.\n- Onsoo Botanicals \u00b7 US entry \u00b7 Board pre-read\n"}, {"id": "DNWXFQ", "case": "c1-market-entry", "words": 5441, "doc": "## Part 1 \u00b7 Normalised storyline\n\n**Governing thought:** Onsoo should enter the US in 2027 with an Amazon-led launch: it is the only route that fits the board's financial rules, but it needs gates because payback depends on ad cost\n\n**Executive summary:**\n1. 1 Enter the US in 2027, rather than scale up Japan\n2. US K-beauty skincare is $3.6B, growing 17% a year (category: 5%), and 41% of it sells on Amazon.\n3. The pilot shows demand: 64,800 units in six months at 4.5 stars, a $4.0M annualised run-rate, and 29% repeat (benchmark 31%).\n4. Amazon-led gives $26.4M of US revenue in 2030 vs $7.0M of extra revenue from the Japan scale-up, with peak cash of only $1.9\u20133.2M.\n5. 2 Lead with Amazon, not a 600-door specialty-retail launch\n6. Amazon-led passes all three financial tests: peak cash \u2013$1.9M (cap $18M), payback in 2030, group margin never below 9.5%.\n7. Retail-led fails all three on its own numbers: peak cash \u2013$20.8M, no payback by 2030, group margin 4.5% in 2027.\n8. Its key inputs do not hold: at Onsoo's 4% awareness, newcomers sell a median 2.6 units/door/week (plan: 4.5; delisting below 4.0), and the 1.3\u00d7 halo rests on a correlation.\n9. 3 Launch with conditions, because three parts of the CEO's plan need changing\n10. Payback holds only if ACoS \u2264 28.6%. At the 32% benchmark for brands this size, cash is still \u2013$2.3M at end-2030, so set a 28% ACoS ceiling and hold a gate in March 2028.\n11. Retail from 2029 at the planned cost would break payback and the margin floor. Enter retail after payback and above 20% awareness (not 15%).\n12. No modeled route reaches $40M by 2030 inside the cash cap and payback rule. Keep the rules and move the $40M date to about 2032.\n13. Decision for March 2027: approve the Amazon-led launch with a $4M cash envelope, a 28% ACoS ceiling and a gate in March 2028; defer specialty retail; move the $40M ambition to about 2032.\n\n**Slides (title \u2192 claims \u2192 evidence):**\n\n- Slide 1: Onsoo Botanicals \u00b7 US market entry\n  - Claim: Should Onsoo enter the US market in 2027, and if so, by which route?\n  - Claim: Recommendation: yes, with an Amazon-led launch run as a gated build\n  - Claim: Prepared November 2026 using only the planning team's briefing pack (synthetic benchmark data; all figures fictional)\n- Slide 2: Onsoo should enter the US in 2027 with an Amazon-led launch: it is the only route that fits the board's financial rules, but it needs gates because payback depends on ad cost\n  - Claim: Enter the US in 2027, rather than scale up Japan\n    - Evidence: US K-beauty skincare is $3.6B, growing 17% a year (category: 5%), and 41% of it sells on Amazon.\n    - Evidence: 64,800 units in six months at 4.5 stars, a $4.0M annualised run-rate, and 29% repeat (benchmark 31%)\n    - Evidence: Amazon-led gives $26.4M of US revenue in 2030 vs $7.0M of extra revenue from the Japan scale-up, with peak cash of only $1.9\u20133.2M\n  - Claim: Lead with Amazon, not a 600-door specialty-retail launch\n    - Evidence: Amazon-led passes all three financial tests: peak cash \u2013$1.9M (cap $18M), payback in 2030, group margin never below 9.5%\n    - Evidence: Retail-led fails all three on its own numbers: peak cash \u2013$20.8M, no payback by 2030, group margin 4.5% in 2027\n    - Evidence: at Onsoo's 4% awareness, newcomers sell a median 2.6 units/door/week (plan: 4.5; delisting below 4.0), and the 1.3\u00d7 halo rests on a correlation\n  - Claim: Launch with conditions, because three parts of the CEO's plan need changing\n    - Evidence: Payback holds only if ACoS \u2264 28.6%. At the 32% benchmark for brands this size, cash is still \u2013$2.3M at end-2030\n    - Evidence: Retail from 2029 at the planned cost would break payback and the margin floor\n    - Evidence: No modeled route reaches $40M by 2030 inside the cash cap and payback rule\n  - Claim: Decision for March 2027: approve the Amazon-led launch with a $4M cash envelope, a 28% ACoS ceiling and a gate in March 2028; defer specialty retail; move the $40M ambition to about 2032.\n- Slide 3: We tested the CEO's starting hypothesis against seven conditions: the Amazon-first route holds, but payback, retail timing and the $40M date need changing\n  - Claim: Market: US K-beauty skincare is large, growing and bought mainly on Amazon \u2014 \u2713 Holds\n    - Evidence: $3.6B in 2025, +17%/yr; Amazon 41% of sales; 61% of K-beauty buyers buy there most often\n  - Claim: Product: Onsoo's products win with US Amazon shoppers \u2014 \u2713 Holds, after a label fix\n    - Evidence: 4.5 stars from 2,140 reviews; units +89% Jan\u2192Jun; repeat 29% vs 31% benchmark; 6% complain of Korean-only labels\n  - Claim: Use of 2027: The US is a better use of the single 2027 launch slot than Japan \u2014 \u2713 Holds\n    - Evidence: 2030 revenue $26.4M (US) vs $7.0M (Japan); both inside the constraints on plan; Japan grows 1.5%/yr\n  - Claim: Route: Starting on Amazon beats starting in 600 specialty doors \u2014 \u2713 Holds\n    - Evidence: Retail-led breaks the cash cap, payback and margin floor; 4.5 units/door/week is unsupported at 4% awareness\n  - Claim: Economics: Amazon-led meets the cash cap, payback and margin floor \u2014 \u25d0 Partly: payback at risk\n    - Evidence: Cap and margin hold in every case tested; payback only if ACoS \u2264 28.6% (benchmark at this scale 32%)\n  - Claim: Retail timing: Retail from 2029 at $10M sales and 15% awareness works \u2014 \u2717 Does not hold\n    - Evidence: At 10\u201320% awareness the median is 3.5 units/door/week (< 4.0 delisting bar); 2029 retail takes cash to \u2013$11.8M\n  - Claim: Ambition: The route gets Onsoo to $40M of US revenue by 2030 \u2014 \u2717 Does not hold\n    - Evidence: Amazon-led reaches $26.4M; only retail-led gets close ($37.6M), and it breaks the cash cap\n  - Claim: Revised answer: enter via Amazon in 2027, run against a 28% ACoS ceiling with a gate in March 2028; add specialty retail only after payback and above 20% awareness; move the $40M ambition to about 2032.\n    - Evidence: Starting hypothesis (CEO): \"Launch in the US in 2027 through Amazon, then add specialty beauty retail from 2029 once Amazon sales pass $10M and aided awareness passes 15%.\"\n- Slide 4: US K-beauty skincare is a $3.6B segment growing 17% a year, over three times the category's rate, and 41% of it is bought on Amazon\n  - Claim: K-beauty share rose from 9.5% to 14.7%\n    - Evidence: K-beauty brands $B 2021\u20132025: 1.9; 2.3; 2.7; 3.1; 3.6\n    - Evidence: Other facial skincare $B 2021\u20132025: 18.2; 19; 19.9; 20.4; 20.9\n    - Evidence: CAGR 2021\u201325: K-beauty +17% \u00b7 all facial skincare +5% \u00b7 non-K-beauty +3.5%\n  - Claim: 41% of K-beauty skincare is bought on Amazon\n    - Evidence: Share of 2025 K-beauty skincare sales: Amazon 0.41; Specialty beauty 0.27; Mass retail 0.14; Brand DTC its unit margin cannot cover\n  - Claim: Per-unit economics Amazon vs specialty retail\n    - Evidence: Price Onsoo receives: 24.00 | 14.00 (50% of $28 shelf)\n    - Evidence: Amazon referral fee (15%): \u20133.60 | \u2014\n    - Evidence: Amazon FBA fee: \u20135.10 | \u2014\n    - Evidence: Ex-factory product cost: \u20133.50 | \u20133.50\n    - Evidence: Freight: \u20130.55 | \u20130.75\n    - Evidence: Import duty (15% of ex-factory): \u20130.53 | \u20130.53\n    - Evidence: Co-op marketing (8%) + returns (4%) of wholesale: \u2014 | \u20131.68\n    - Evidence: Contribution before advertising: 10.73 | 7.55\n    - Evidence: Advertising at 25% ACoS (plan) / 32% (benchmark): \u20136.00 / \u20137.68 | in fixed budget\n    - Evidence: Contribution per unit: 4.73 / 3.05 | 7.55\n  - Claim: Retail's own break-even, at the planned cost base\n    - Evidence: Retail-only fixed cost: $6.0M national marketing + $1.5M field team = $7.5M a year.\n    - Evidence: Units needed = $7.5M \u00f7 $7.545 = 994k a year. Across 600 doors that is \u00f7 (600 \u00d7 52) = 32 units/door/week.\n    - Evidence: The plan assumes 4.5; the evidence for Onsoo suggests 2.6. At 4.5, retail would need \u22484,248 doors to cover its costs.\n    - Evidence: At 4.5 units/door/week, 600 doors sell 140k units: $2.0M of wholesale revenue against $7.5M of fixed cost.\n  - Claim: Amazon's sensitivity is advertising\n    - Evidence: Each ACoS point costs $0.24 a unit, or \u2248 $0.67M over the 2.81M units planned for 2027\u201330.\n    - Evidence: Unit break-even ACoS is 44.7%, but covering fixed costs by 2030 needs \u2264 28.6%\n  - Claim: So what: retail only makes sense if it lifts Amazon sales enough to pay for itself. That rests on the halo assumption tested on page 10.\n- Slide 8: Only the Amazon-led route passes all three of the board's financial tests; retail-led fails all three even on the planning team's own assumptions\n  - Claim: Board tests by option (A / B / J)\n    - Evidence: Peak cash \u2264  Payback by 2030 is the binding constraint: Amazon-led pays back only if ACoS stays at or below 28.6%, while the benchmark for brands this size is 32%\n  - Claim: Option A cumulative cash at end-2030 by ACoS\n    - Evidence: 25% plan: 2.39975; 26% low end: 1.72535; 28% pilot: 0.37655; 30%: -0.97225; 32% median: -2.32105; 35%: -4.34425; 38% high end: -6.36745\n  - Claim: Cumulative cash at end-2030: ACoS \u00d7 volume\n    - Evidence: 70%: \u2013$1.1M | \u2013$2.5M | \u2013$3.4M | \u2013$4.4M | \u2013$5.8M (25/28/30/32/35%)\n    - Evidence: 85%: +$0.7M | \u2013$1.1M | \u2013$2.2M | \u2013$3.4M | \u2013$5.1M\n    - Evidence: 100% (plan): +$2.4M | +$0.4M | \u2013$1.0M | \u2013$2.3M | \u2013$4.3M\n    - Evidence: 115%: +$4.1M | +$1.8M | +$0.3M | \u2013$1.3M | \u2013$3.6M\n  - Claim: The plan assumes ACoS falls to 25% as the brand matures. The agency data says it rises as brands bid on broader keywords, to a median of 32% between $5M and $20M a year, which is exactly A's path ($7.2M \u2192 $26.4M).\n    - Evidence: \u00a711 (agency benchmark: median 32%, range 26\u201338% for brands scaling $5M\u2192$20M on Amazon US)\n  - Claim: At the pilot's 28%, volume must reach \u2265 96% of plan to pay back. At 25%, \u2265 79%.\n  - Claim: The cash cap is never the issue: peak cash stays between \u2013$1.9M and \u2013$6.4M across 25\u201338% ACoS.\n  - Claim: So what: treat ACoS as the key operating metric. Cap blended ACoS at 28%, and give up growth rather than buy volume above the ceiling. Re-forecast at 32% before launch.\n- Slide 12: The downside is bounded: even if sales stall or tariffs rise, Amazon-led needs at most $7.1M of peak cash, well under the $18M cap, and group margin stays above the 8% floor\n  - Claim: Peak US cash need by scenario, $M\n    - Evidence: Plan (25% ACoS): 1.94\n    - Evidence: Pilot ACoS (28%): 2.4097\n    - Evidence: Tariff rises to 25%: 2.15683\n    - Evidence: Benchmark ACoS (32%): 3.2353\n    - Evidence: 32% ACoS + 25% tariff: 3.88697\n    - Evidence: ACoS at top of range (38%): 6.36745\n    - Evidence: Sales stall at $4.8M/yr, 32% ACoS: 7.069\n    - Evidence: B \u00b7 Retail-led plan (comparison): 20.7962\n    - Evidence: $18M cap\n  - Claim: Payback by 2030 and lowest group margin by scenario\n    - Evidence: Plan (25% ACoS): \u2713 Yes, 9.5%\n    - Evidence: Pilot ACoS (28%): \u2713 Yes, 9.3%\n    - Evidence: Tariff rises to 25%: \u2713 Yes, 9.4%\n    - Evidence: Benchmark ACoS (32%): \u2717 No, 9.1%\n    - Evidence: 32% ACoS + 25% tariff: \u2717 No, 9.0%\n    - Evidence: ACoS at top of range (38%): \u2717 No, 8.8%\n    - Evidence: Sales stall at $4.8M/yr, 32% ACoS: \u2717 No, 9.1%\n    - Evidence: B \u00b7 Retail-led plan (comparison): \u2717 No, 4.5%\n  - Claim: If sales stall and we stop at the March 2028 gate, the loss is about $3M (2027: \u2013$2.6M, plus one quarter of 2028).\n  - Claim: A 10% weaker won (\u2248 \u2013$0.40 a unit) would roughly offset the tariff rise (+$0.35 a unit).\n  - Claim: So what: the cash cap and margin floor are safe in every Amazon-led case. The real risk is payback. A gate can limit the cost of a stall to about $3M.\n- Slide 13: Specialty retail should follow payback, not come before it: 600 doors in 2029 would break payback and the margin floor, and a 15% awareness gate is too low\n  - Claim: Cumulative US cash, $M: A only vs A + 600 retail doors from 2029\n    - Evidence: A \u00b7 Amazon-led only: -1.94; -1.7905; -0.3165; 2.39975\n    - Evidence: A + 600 retail doors from 2029 (CEO's phase 2): -1.94; -1.7905; -8.12208; -11.823\n  - Claim: Gates for entering retail: CEO's proposal vs recommended\n    - Evidence: Timing: From 2029 | Decide in 2030 for 2031 | 2029 entry: \u2013$11.8M at 2030, margin 6.3%\n    - Evidence: Aided awareness: > 15% | > 20% | 10\u201320%: median 3.5 < 4.0 bar; >20%: median 4.6\n    - Evidence: Amazon sales: > $10M | > $10M (kept) | Reached in 2028 on plan; not binding\n    - Evidence: US cash: \u2014 | Cumulative \u2265 0 (payback met) | Boar d by measured results rather than by the calendar\n  - Claim: Phase 1 \u00b7 Launch, Apr\u2013Dec 2027\n    - Evidence: Set up the US entity, MoCRA registration and US-compliant labels (removes the Korean-only label complaint)\n    - Evidence: Move the listings from the cross-border seller to Onsoo's own Amazon operation\n    - Evidence: Add four SKUs (seven in total); weight the $0.7M off-Amazon budget to TikTok and social\n    - Evidence: Run at a blended ACoS ceiling of 28%; cash envelope $4M (covers the \u2013$3.9M stress case)\n  - Claim: Phase 2 \u00b7 Scale on Amazon, 2028\u20132030\n    - Evidence: Scale towards ~1.1M units ($26M) only while ACoS \u2264 28%\n    - Evidence: Build aided awareness from 4% towards 20%; survey every year\n    - Evidence: Lift 90-day repeat from 29% to \u2265 31% through the wider range\n    - Evidence: Look again at the Japan scale-up for 2028 (bandwidth now free)\n  - Claim: Phase 3 \u00b7 Add retail, Decide 2030 \u2192 launch 2031\n    - Evidence: Only when awareness > 20% and US cash has paid back\n    - Evidence: Start with a door-scaled cost base, not the $7.5M national model\n    - Evidence: Measure the Amazon halo directly before scaling doors\n    - Evidence: Path to $40M around 2032\n  - Claim: Gate 1 \u00b7 March 2028 board on full-year 2027 results\n    - Evidence: Green: scale \u2014 ACoS \u2264 28% and units \u2265 96% of plan (re-forecast pays back by 2030); repeat \u2265 31%\n    - Evidence: Amber: hold \u2014 Anything between green and red: hold ad spend at the ceiling, slow SKU additions, re-forecast in 6 months\n    - Evidence: Red: stop \u2014 ACoS > 32% or units < 70% of plan (stall zone): move to a maintenance model or exit; cash at risk about $3M\n  - Claim: KPIs tracked monthly\n    - Evidence: Blended ACoS: 28% (pilot) \u2192 \u2264 28% ceiling\n    - Evidence: Amazon units vs plan: 168k/yr run-rate \u2192 300k in 2027 \u2192 1.1M in 2030\n    - Evidence: 90-day repeat: 29% \u2192 \u2265 31% by Gate 1\n    - Evidence: Aided awareness, category buyers: 4% \u2192 > 20% before retail\n    - Evidence: Cumulative US cash: \u2014 \u2192 \u2265 \u2013$4M envelope; \u2265 0 by 2030\n  - Claim: Gate thresholds derived from the team model: payback needs \u226596% of planned volume at 28% ACoS (\u226579% at 25%); 70% of plan \u2248 the stall zone of peers below $5M; 20% awareness from Table 8.\n- Slide 16: Six risks could derail the plan; ad cost at scale is the largest, and each risk has an early warning sign and an agreed response\n  - Claim: Ad cost at scale\n    - Evidence: Pilot 28% on a small budget; benchmark 32% (26\u201338%)\n    - Evidence: \u2013$0.67M per ACoS point; 32% \u2192 \u2013$2.3M (no payback)\n    - Evidence: Early warning: Monthly blended ACoS\n    - Evidence: Response: 28% ceiling; slower growth over paid volume\n  - Claim: Demand stall\n    - Evidence: 2 of 3 Amazon-first peers stayed below $5M\n    - Evidence: \u2013$7.1M by 2030 if continued; about \u2013$3M if stopped at Gate 1\n    - Evidence: Early warning: Units vs plan; growth after SKU launches\n    - Evidence: Response: Gate 1 red rule; maintenance model or exit\n  - Claim: Tariff 15% \u2192 25%\n    - Evidence: US review; decision mid-2027\n    - Evidence: +$0.35/unit; \u2013$1.1M; break-even ACoS 28.6% \u2192 26.9%\n    - Evidence: Response: Re-forecast; FX offset; review price (limited: 52% buy partly on price)\n  - Claim: Low repeat\n    - Evidence: 29% vs 31% benchmark; 48% in Korea\n    - Evidence: Lower lifetime value means more reliance on ads\n    - Evidence: Early warning: 90-day repeat by cohort\n    - Evidence: Response: Range build-out, US labels, regimen bundles\n  - Claim: FX (KRW/USD)\n    - Evidence: Product costs in won\n    - Evidence: 10% weaker won = +$0.40/unit (upside); stronger won is the mirror risk\n    - Evidence: Early warning: Monthly KRW/USD\n    - Evidence: Response: Budget at today's rate; group treasury policy\n  - Claim: Launch execution\n    - Evidence: Korea
